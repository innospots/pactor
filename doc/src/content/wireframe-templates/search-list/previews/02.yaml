# 提炼自「结构 S2 — 筛选与表格在同一区域」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 结构 S2 — 筛选与表格在同一区域
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            - type: Form
              props:
                layout: inline
              children:
                - type: Field
                  props: { label: 关键词 }
                  children:
                    - type: Input
                      props:
                        name: keyword
                        placeholder: 输入关键词
                - type: Field
                  props: { label: 状态 }
                  children:
                    - type: Select
                      props:
                        name: status
                        placeholder: 选择状态
                        options:
                          - label: 全部
                            value: all
                          - label: 启用
                            value: enabled
                          - label: 停用
                            value: disabled
                - type: Field
                  children:
                    - type: Button
                      props:
                        text: 查询
                        variant: primary
                        submit: true
                    - type: Button
                      props:
                        text: 重置
            - type: Separator
            - type: Table
              props:
                columns:
                  - title: 名称
                    dataIndex: name
                  - title: 负责人
                    dataIndex: owner
                  - title: 状态
                    dataIndex: status
                dataSource:
                  - id: 1
                    name: 示例数据 A
                    owner: 张三
                    status: 启用
                  - id: 2
                    name: 示例数据 B
                    owner: 李四
                    status: 停用
                  - id: 3
                    name: 示例数据 C
                    owner: 王五
                    status: 启用
            - type: Pagination
              props:
                total: 128
                pageSize: 10
                align: right
                showTotal: true
                pageSizeOptions: [10, 20, 50]

