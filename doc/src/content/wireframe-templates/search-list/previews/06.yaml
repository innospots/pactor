# 提炼自「4.1 工具栏分区（两层）」：表格级工具栏（已选摘要 + 批量操作 + 刷新/列设置）。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
# 行多选经 rowSelection 开启（首列 Checkbox + 表头全选/半选），选中 keys 受控绑定
# state.selectedKeys，「已选 N 项」随选择实时更新；selectionDisabledField 按行数据字段
# 禁用选择（第二行无选择权限），操作列「编辑」按行 editable 字段禁用（无编辑权限）；
# 「刷新」演示 loading 态（setState → delay → setState）。
title: 表格工具栏 — 批量操作条（表格级，表头上方）
state:
  selectedKeys: [1]
  tableLoading: false
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            # 表格工具栏：左侧已选摘要 + 批量操作；右侧列表级操作
            - type: Flex
              props:
                justify: space-between
                align: center
              children:
                - type: Flex
                  props:
                    align: center
                    gap: small
                  children:
                    - type: Text
                      props:
                        text: 已选 ${state.selectedKeys.length} 项
                        type: secondary
                    - type: Button
                      props:
                        text: 批量启用
                    - type: Button
                      props:
                        text: 批量删除
                - type: Flex
                  props:
                    gap: small
                  children:
                    # 刷新：loading 态演示（setState → delay → setState）
                    - type: Button
                      props:
                        text: 刷新
                        icon: refresh
                        variant: text
                      events:
                        onClick:
                          - action: setState
                            params: { tableLoading: true }
                          - action: delay
                            params: { ms: 800 }
                          - action: setState
                            params: { tableLoading: false }
                    - type: Button
                      props:
                        text: 列设置
                        icon: settings
                        variant: text
            - type: Separator
            - type: Table
              props:
                rowSelection: true
                selectedRowKeys: ${state.selectedKeys}
                selectionDisabledField: selectDisabled
                loading: ${state.tableLoading}
                columns:
                  - title: 名称
                    dataIndex: name
                  - title: 负责人
                    dataIndex: owner
                  - title: 状态
                    dataIndex: status
                  # 操作列固定最右：一律 Button variant: link，主操作在左；居中
                  - title: 操作
                    width: 200
                    align: center
                    fixed: right
                    cell:
                      type: Flex
                      props:
                        align: center
                        justify: center
                        gap: 4
                      children:
                        - type: Button
                          props:
                            text: 详情
                            variant: link
                        # 无编辑权限的行禁用「编辑」（行数据 editable: false）
                        - type: Button
                          props:
                            text: 编辑
                            variant: link
                            disabled: ${!row.editable}
                        - type: DropdownMenu
                          props:
                            align: end
                            items:
                              - label: 停用
                                value: disable
                              - separator: true
                              - label: 删除
                                value: delete
                                icon: trash
                                danger: true
                          children:
                            - type: Button
                              props:
                                icon: ellipsis
                                variant: text
                dataSource:
                  - id: 1
                    name: 示例数据 A
                    owner: 张三
                    status: 启用
                    editable: true
                  # 无选择权限（Checkbox 禁用）+ 无编辑权限（隐藏「编辑」）
                  - id: 2
                    name: 示例数据 B
                    owner: 李四
                    status: 停用
                    selectDisabled: true
                    editable: false
                  - id: 3
                    name: 示例数据 C
                    owner: 王五
                    status: 启用
                    editable: true
              events:
                onSelectChange:
                  - action: setState
                    params:
                      selectedKeys: ${event}
            - type: Pagination
              props:
                total: 128
                pageSize: 10
                align: right
                showTotal: true
                pageSizeOptions: [10, 20, 50]
