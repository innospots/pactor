# 提炼自「筛选 F3 — 标签筛选（Chip / 标签行）」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
# F3 要点：ChipFilter 快筛行（参考 pactor-prd 模板 provider-list.yaml 用法）——
# 多组标签（组标题左对齐）、即点即生效（onChange 改 state，无提交语义、不包 Form）；
# single 单选 toggle 回 allValue，multi 多选数组。容器结构同 S2。
title: 筛选 F3 — 标签筛选（Chip / 标签行）
state:
  statusChip: all
  scopeChip: all
  typeChips: []
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            # 状态：单选快筛（点已选项回「全部」；dot 为状态色点）
            - type: Flex
              props:
                align: center
                gap: small
                style: { flexWrap: wrap }
              children:
                - type: Text
                  props:
                    text: 状态
                    strong: true
                    className: w-10
                - type: ChipFilter
                  props:
                    mode: single
                    value: ${state.statusChip}
                    items:
                      - { value: all, text: 全部 6 }
                      - { value: enabled, text: 启用 4, dot: '#22c55e' }
                      - { value: disabled, text: 停用 2, dot: '#f59e0b' }
                  events:
                    onChange:
                      - action: setState
                        params:
                          statusChip: ${event}
            # 归属：单选快筛
            - type: Flex
              props:
                align: center
                gap: small
                style: { flexWrap: wrap }
              children:
                - type: Text
                  props:
                    text: 归属
                    strong: true
                    className: w-10
                - type: ChipFilter
                  props:
                    mode: single
                    value: ${state.scopeChip}
                    items:
                      - { value: all, text: 全部 }
                      - { value: platform, text: 平台 }
                      - { value: tenant, text: 租户 }
                      - { value: workspace, text: 工作空间 }
                  events:
                    onChange:
                      - action: setState
                        params:
                          scopeChip: ${event}
            # 类型：多选快筛（value 为数组；「全部」项清空选择）
            - type: Flex
              props:
                align: center
                gap: small
                style: { flexWrap: wrap }
              children:
                - type: Text
                  props:
                    text: 类型
                    strong: true
                    className: w-10
                - type: ChipFilter
                  props:
                    mode: multi
                    value: ${state.typeChips}
                    items:
                      - { value: all, text: 全部 }
                      - { value: login, text: 登录 }
                      - { value: create, text: 创建 }
                      - { value: update, text: 更新 }
                      - { value: delete, text: 删除 }
                      - { value: export, text: 导出 }
                  events:
                    onChange:
                      - action: setState
                        params:
                          typeChips: ${event}
            - type: Separator
            - type: Table
              props:
                columns:
                  - title: 名称
                    dataIndex: name
                  - title: 负责人
                    dataIndex: owner
                  - title: 状态
                    dataIndex: status
                dataSource:
                  - id: 1
                    name: 示例数据 A
                    owner: 张三
                    status: 启用
                  - id: 2
                    name: 示例数据 B
                    owner: 李四
                    status: 停用
                  - id: 3
                    name: 示例数据 C
                    owner: 王五
                    status: 启用
            - type: Pagination
              props:
                total: 128
                pageSize: 10
                align: right
                showTotal: true
                pageSizeOptions: [10, 20, 50]
