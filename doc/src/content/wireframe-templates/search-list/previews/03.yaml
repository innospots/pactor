title: 筛选 F1 — Form inline 表单筛选
body:
  type: Flex
  props:
    direction: column
    gap: 16
  children:
    - type: Form
      props:
        layout: inline
      children:
        - type: Field
          children:
            - type: Input
        - type: Button
          props:
            text: 查询
            htmlType: submit
        - type: Button
          props:
            text: 重置
