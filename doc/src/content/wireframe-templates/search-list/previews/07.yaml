# 提炼自「4.2 表头与排序」：sorter 列表头带 ⇅ 图标，点击三态循环 asc ↑ → desc ↓ → 取消；
# 不可排序列（操作列、纯展示统计、枚举标签）不声明 sorter；默认序经 defaultSortOrder 声明。
# 排序变化经 Table events.onChange 传出 { field, order }（DSL 侧可衔接 reload）。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 表头与排序 — sorter 列 ⇅ 与默认序
height: 400
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Table
          props:
            columns:
              # 可排序列：sorter: true（表头自动带 ⇅ 图标）
              - title: 角色名称
                dataIndex: name
                sorter: true
              - title: 编码
                dataIndex: code
              - title: 归属范围
                dataIndex: scope
                sorter: true
              - title: 成员数
                dataIndex: members
                align: right
                sorter: true
              - title: 状态
                dataIndex: status
              # 默认序：创建时间降序（初始即按此排序，表头显示 ↓）
              - title: 创建时间
                dataIndex: createdAt
                sorter: true
                defaultSortOrder: descend
            dataSource:
              - id: 1
                name: 平台管理员
                code: platform-admin
                scope: 平台
                members: 3
                status: 启用
                createdAt: 2026-09-12
              - id: 2
                name: 租户管理员
                code: tenant-admin
                scope: 租户
                members: 12
                status: 启用
                createdAt: 2026-09-08
              - id: 3
                name: 审计只读
                code: audit-readonly
                scope: 工作空间
                members: 5
                status: 停用
                createdAt: 2026-08-30
