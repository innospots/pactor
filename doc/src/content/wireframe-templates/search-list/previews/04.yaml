# 提炼自「筛选 F2 — 筛选按钮 + 弹层筛选（Popover / Dropdown Panel）」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
# F2 要点：文档流仅关键词 + 「筛选」按钮（弹层锚点）+ 主操作；完整筛选表单在 Popover 浮层内，
# 不占用、不改变表格区的垂直空间。容器结构参考 S2：同一 Card 内 工具条 / 分割线 / 表格 / 分页。
title: 筛选 F2 — 筛选按钮 + 弹层筛选（Popover / Dropdown Panel）
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            # 工具条：左侧关键词快捷项，右侧「筛选」弹层锚点 + 主操作
            - type: Flex
              props:
                justify: space-between
                gap: 8
              children:
                - type: Input
                  props:
                    name: keyword
                    placeholder: 输入关键词
                    style: { width: 260 }
                - type: Flex
                  props:
                    gap: 8
                  children:
                    - type: Popover
                      props:
                        align: end
                        style: { width: 300 }
                        # 浮层内为完整 Form（字段 + 查询/重置），独立于文档流
                        content:
                          type: Form
                          props:
                            layout: vertical
                          children:
                            - type: Field
                              props: { label: 状态 }
                              children:
                                - type: Select
                                  props:
                                    name: status
                                    value: all
                                    options:
                                      - { label: 全部, value: all }
                                      - { label: 启用, value: enabled }
                                      - { label: 停用, value: disabled }
                            - type: Field
                              props: { label: 负责人 }
                              children:
                                - type: Input
                                  props:
                                    name: owner
                                    placeholder: 请输入
                            - type: Field
                              props: { label: 类型 }
                              children:
                                - type: Select
                                  props:
                                    name: category
                                    placeholder: 请选择
                                    options:
                                      - { label: 全部, value: all }
                                      - { label: 登录, value: login }
                                      - { label: 创建, value: create }
                                      - { label: 更新, value: update }
                            - type: Field
                              children:
                                - type: Flex
                                  props:
                                    justify: end
                                    gap: 8
                                  children:
                                    - type: Button
                                      props:
                                        text: 重置
                                    - type: Button
                                      props:
                                        text: 查询
                                        variant: primary
                                        submit: true
                      children:
                        - type: Button
                          props:
                            text: 筛选
                            icon: funnel
                    - type: Button
                      props:
                        text: 新建
                        variant: primary
                        icon: plus
            - type: Separator
            # 表格区：弹层打开/关闭均不改变其高度与排版
            - type: Table
              props:
                columns:
                  - title: 名称
                    dataIndex: name
                  - title: 负责人
                    dataIndex: owner
                  - title: 状态
                    dataIndex: status
                dataSource:
                  - id: 1
                    name: 示例数据 A
                    owner: 张三
                    status: 启用
                  - id: 2
                    name: 示例数据 B
                    owner: 李四
                    status: 停用
                  - id: 3
                    name: 示例数据 C
                    owner: 王五
                    status: 启用
            - type: Pagination
              props:
                total: 128
                pageSize: 10
                align: right
                showTotal: true
                pageSizeOptions: [10, 20, 50]
