# 提炼自「4.3 表体与列类型」：多选列（rowSelection 开启，首列 Checkbox + 表头全选）/
# 链接列（主字段 link 进详情）/ 数字右对齐 / 状态列（Status 状态点 + 文案）。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 表体与列类型 — 多选列 / 链接列 / 数字右对齐 / 状态列
height: 400
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Table
          props:
            # 行多选（非受控，组件内部管理选中态）
            rowSelection: true
            columns:
              # 链接列：主字段用 link 样式按钮，点击进详情（与操作列「详情」二选一）
              - title: 名称
                cell:
                  type: Button
                  props:
                    text: ${row.name}
                    variant: link
              - title: 负责人
                dataIndex: owner
              # 数字列右对齐
              - title: 成员数
                dataIndex: members
                align: right
              # 状态列：Status 状态点 + 文案（●启用 / ○停用）
              - title: 状态
                cell:
                  type: Status
                  props:
                    status: ${row.statusType}
                    text: ${row.status}
            dataSource:
              - id: 1
                name: 示例数据 A
                owner: 张三
                members: 3
                status: 启用
                statusType: success
              - id: 2
                name: 示例数据 B
                owner: 李四
                members: 12
                status: 停用
                statusType: default
              - id: 3
                name: 示例数据 C
                owner: 王五
                members: 5
                status: 启用
                statusType: success
