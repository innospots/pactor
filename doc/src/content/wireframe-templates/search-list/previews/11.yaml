# 提炼自「五、状态与异常 — 空数据」：页面结构（工具栏 / 表头）保留，数据区域展示
# 空态图标 + 文案；文案经 emptyText 由外部传入（缺省走 i18n「暂无数据」）；
# 空表时分页器隐藏（4.5 规则：总条数 0 分页器禁用或隐藏）。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 状态与异常 — 空数据（Empty 图标 + 可配文案）
height: 420
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            # 工具栏保留：搜索与主操作不受空态影响
            - type: Flex
              props:
                justify: space-between
                gap: 8
              children:
                - type: Input
                  props:
                    name: keyword
                    placeholder: 输入关键词
                    style: { width: 260 }
                - type: Button
                  props:
                    text: 新建
                    variant: primary
                    icon: plus
            - type: Separator
            - type: Table
              props:
                # 空态文案由外部传入（缺省为 i18n「暂无数据」）
                emptyText: 暂无符合条件的角色
                columns:
                  - title: 名称
                    dataIndex: name
                  - title: 负责人
                    dataIndex: owner
                  - title: 状态
                    dataIndex: status
                  - title: 操作
                    width: 200
                    align: center
                    fixed: right
                dataSource: []
