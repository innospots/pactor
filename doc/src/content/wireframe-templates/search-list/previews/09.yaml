# 提炼自「4.4 操作列（固定右侧）」：常规 link 按钮横排（主操作在左：详情/编辑），
# 次要操作收进 ⋯ 更多菜单；危险操作（删除/停用）在 ⋯ 内，须二次确认（danger 标红）。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 操作列 — link 按钮横排 + ⋯ 更多菜单
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            - type: Table
              props:
                columns:
                  - title: 名称
                    dataIndex: name
                    width: 340
                  - title: 负责人
                    dataIndex: owner
                    width: 340
                  - title: 状态
                    dataIndex: status
                    width: 340
                  # 操作列固定最右（sticky）：一律 Button variant: link，主操作在左；居中
                  - title: 操作
                    width: 200
                    align: center
                    fixed: right
                    cell:
                      type: Flex
                      props:
                        align: center
                        justify: center
                        gap: 4
                      children:
                        - type: Button
                          props:
                            text: 详情
                            variant: link
                        - type: Button
                          props:
                            text: 编辑
                            variant: link
                        # 次要操作收进 ⋯ 更多菜单（危险项 danger 标红）
                        - type: DropdownMenu
                          props:
                            align: end
                            items:
                              - label: 停用
                                value: disable
                              - separator: true
                              - label: 删除
                                value: delete
                                icon: trash
                                danger: true
                          children:
                            - type: Button
                              props:
                                icon: ellipsis
                                variant: text
                dataSource:
                  - id: 1
                    name: 示例数据 A
                    owner: 张三
                    status: 启用
                  - id: 2
                    name: 示例数据 B
                    owner: 李四
                    status: 停用
                  - id: 3
                    name: 示例数据 C
                    owner: 王五
                    status: 启用
            - type: Pagination
              props:
                total: 128
                pageSize: 10
                align: right
                showTotal: true
                pageSizeOptions: [10, 20, 50]
