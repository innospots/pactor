# 提炼自「W5 — 快捷入口卡（Card + Icon）」：高频模块导航入口。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: W5 — 快捷入口卡（Card + Icon）
height: 220
center: true
body:
  type: Page
  children:
    - type: Grid
      props: { columns: 4, gap: 16, style: { width: 560 } }
      children:
        - type: Card
          props: { hoverable: true, contentClassName: flex flex-col items-center justify-center gap-2 }
          children:
            - type: Icon
              props: { name: building, size: lg }
            - type: Text
              props: { text: 租户管理 }
        - type: Card
          props: { hoverable: true, contentClassName: flex flex-col items-center justify-center gap-2 }
          children:
            - type: Icon
              props: { name: user, size: lg }
            - type: Text
              props: { text: 用户管理 }
        - type: Card
          props: { hoverable: true, contentClassName: flex flex-col items-center justify-center gap-2 }
          children:
            - type: Icon
              props: { name: plus, size: lg }
            - type: Text
              props: { text: 邀请成员 }
        - type: Card
          props: { hoverable: true, contentClassName: flex flex-col items-center justify-center gap-2 }
          children:
            - type: Icon
              props: { name: file-text, size: lg }
            - type: Text
              props: { text: 帮助文档 }
