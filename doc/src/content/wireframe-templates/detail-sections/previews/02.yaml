# 提炼自「布局 B — 日志/审计详情」：标题行（状态 + 耗时）+ 操作信息/执行结果 Descriptions + 请求参数 Collapsible(JSONViewer) + 底部操作。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 B — 日志/审计详情
height: 560
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16, align: start }
      children:
        - type: Flex
          props: { justify: space-between, align: center, className: w-full }
          children:
            - type: Text
              props: { text: 导出用户列表, size: large, strong: true }
            - type: Flex
              props: { gap: 8, align: center }
              children:
                - type: Status
                  props: { status: success, text: 成功 }
                - type: Text
                  props: { text: 120 ms, size: small, type: secondary }
        - type: Card
          props: { title: 操作信息, className: w-full }
          children:
            - type: Descriptions
              props:
                column: 3
                items:
                  - { label: 操作人, value: 张三 }
                  - { label: 操作时间, value: '2026-10-09 14:32:08' }
                  - { label: 来源 IP, value: '103.86.*.*' }
                  - { label: 模块, value: 用户管理 }
                  - { label: 操作类型, value: 导出 }
                  - { label: 结果, value: 成功 }
        - type: Card
          props: { title: 执行结果, className: w-full }
          children:
            - type: Descriptions
              props:
                column: 2
                items:
                  - { label: 导出记录数, value: '1,284' }
                  - { label: 文件有效期, value: 24 小时 }
        - type: Collapsible
          props: { title: 请求参数（脱敏）, className: w-full }
          children:
            - type: JSONViewer
              props:
                expandedDepth: 2
                copyable: false
                data:
                  keyword: ''
                  status: active
                  page: 1
                  pageSize: 2000
                  password: '******'
        - type: Flex
          props: { justify: end, gap: 8, className: w-full }
          children:
            - type: Button
              props: { text: 复制 ID }
            - type: Button
              props: { text: 返回, variant: primary }
