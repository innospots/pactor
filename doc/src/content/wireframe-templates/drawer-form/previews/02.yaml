# 提炼自「布局 B — 窄滑层（轻量编辑）」：列表行「编辑」打开 360px 窄滑层，仅 4 个字段，保存后刷新行。
# 交互：「新建成员」/ 行内「编辑」打开滑层；遮罩 / 取消关闭；「保存」提交并校验必填项。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 B — 窄滑层（轻量编辑）
height: 560
state: { drawerOpen: true }
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16 }
      children:
        - type: Flex
          props: { justify: space-between, align: center }
          children:
            - type: Text
              props: { text: 成员管理, size: large, strong: true }
            - type: Button
              props: { text: 新建成员, variant: primary, icon: plus }
              events:
                onClick:
                  - action: setState
                    params: { drawerOpen: true }
        - type: Table
          props:
            columns:
              - { title: 姓名, dataIndex: name }
              - { title: 邮箱, dataIndex: email }
              - { title: 角色, dataIndex: role }
              - title: 操作
                width: 100
                align: center
                cell:
                  type: Button
                  props: { text: 编辑, variant: link }
                  events:
                    onClick:
                      - action: setState
                        params: { drawerOpen: true }
            dataSource:
              - { id: 1, name: 张三, email: zhangsan@example.com, role: 管理员 }
              - { id: 2, name: 李四, email: lisi@example.com, role: 成员 }
        - type: Drawer
          props:
            title: 编辑成员
            open: "${state.drawerOpen}"
            style: { width: 360, maxWidth: 'none' }
          events:
            onClose:
              - action: setState
                params: { drawerOpen: false }
          children:
            - type: Form
              events:
                onSubmit:
                  - action: message
                    params: { messageType: success, text: 保存成功 }
                  - action: setState
                    params: { drawerOpen: false }
              children:
                - type: Field
                  props: { label: 姓名, required: true }
                  children:
                    - type: Input
                      props:
                        name: name
                        value: 张三
                        rules:
                          - { required: true, message: 请输入姓名 }
                - type: Field
                  props: { label: 邮箱 }
                  children:
                    - type: Input
                      props: { name: email, placeholder: 请输入邮箱 }
                - type: Field
                  props: { label: 角色 }
                  children:
                    - type: Select
                      props:
                        name: role
                        value: 管理员
                        options:
                          - { label: 管理员, value: 管理员 }
                          - { label: 成员, value: 成员 }
                - type: Field
                  props: { label: 状态 }
                  children:
                    - type: Switch
                      props: { name: enabled, value: true }
                - type: Flex
                  props: { justify: end, gap: 8, className: mt-4 }
                  children:
                    - type: Button
                      props: { text: 取消 }
                      events:
                        onClick:
                          - action: setState
                            params: { drawerOpen: false }
                    - type: Button
                      props: { text: 保存, variant: primary, submit: true }
