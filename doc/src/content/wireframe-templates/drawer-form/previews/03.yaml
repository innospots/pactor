# 提炼自「布局 C — 行内展开（非滑层变体）」：表格行下展开编辑区静态模拟（DSL Table 暂无 expandable 能力）。
# 交互：「完成」提交并校验必填项；「取消本项」提示取消。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 C — 行内展开（静态模拟）
height: 560
body:
  type: Page
  children:
    - type: Card
      props: { title: 字典项 · 用户性别, className: w-full }
      children:
        - type: Flex
          props: { direction: vertical, gap: 0 }
          children:
            - type: Table
              props:
                pagination: false
                columns:
                  - { title: 项名称, dataIndex: name }
                  - { title: 值, dataIndex: value }
                  - title: 状态
                    cell:
                      type: Status
                      props:
                        status: "${row.statusType}"
                        text: "${row.statusText}"
                  - title: 操作
                    width: 100
                    align: center
                    cell:
                      type: Button
                      props: { text: 编辑, variant: link }
                dataSource:
                  - { id: 1, name: 简体中文, value: zh-CN, statusType: success, statusText: 启用 }
            - type: Flex
              props:
                direction: vertical
                gap: 12
                className: border border-border rounded-md bg-muted/50 p-4
              children:
                - type: Form
                  events:
                    onSubmit:
                      - action: message
                        params: { messageType: success, text: 已保存 }
                  children:
                    - type: Grid
                      props: { columns: 2, gap: 16 }
                      children:
                        - type: Field
                          props: { label: 值, required: true }
                          children:
                            - type: Input
                              props:
                                name: value
                                value: zh-CN
                                rules:
                                  - { required: true, message: 请输入值 }
                        - type: Field
                          props: { label: 多语言名称 }
                          children:
                            - type: Input
                              props: { name: label, value: 简体中文 }
                        - type: Field
                          props: { label: 排序 }
                          children:
                            - type: NumberInput
                              props: { name: sort, value: 1 }
                        - type: Field
                          props: { label: 状态 }
                          children:
                            - type: Switch
                              props: { name: enabled, value: true }
                    - type: Flex
                      props: { justify: end, gap: 8 }
                      children:
                        - type: Button
                          props: { text: 取消本项, variant: link }
                          events:
                            onClick:
                              - action: message
                                params: { messageType: info, text: 已取消修改 }
                        - type: Button
                          props: { text: 完成, variant: primary, submit: true }
