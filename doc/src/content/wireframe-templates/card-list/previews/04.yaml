# 提炼自「2.8 插件列表示例（上中下 + 平铺）」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 2.8 插件列表示例（上中下 + 平铺）
height: 220
center: true
body:
  type: EntityCard
  props:
    icon: users
    title: 用户管理
    subtitle: v0.1.0
    description: 管理插件安装状态与运行生命周期。
    hoverable: true
    style: { width: 380 }
    tags:
      - { text: 已安装, color: success }
    actions:
      - { text: 停用 }
  events:
    # 整卡可点进详情；「停用」独立点击 + 二次确认（不触发整卡点击）
    onClick:
      - action: message
        params: { messageType: info, text: 进入「用户管理」详情 }
    onAction:
      - action: confirm
        id: disableConfirm
        params:
          title: 确认停用「用户管理」？
          content: 停用后依赖该插件的功能将不可用。
      - action: if
        params:
          condition: ${actions.disableConfirm}
          then:
            - action: message
              params: { messageType: success, text: 已停用「用户管理」 }
