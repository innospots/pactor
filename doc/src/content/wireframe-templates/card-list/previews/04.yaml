title: 2.8 插件列表示例（上中下 + 平铺）
body:
  type: Flex
  props:
    direction: column
    gap: 16
  children:
    - type: Card
      children:
        - type: Flex
          children:
            - type: Text
              props:
                text: Logo
                type: secondary
            - type: Text
              props:
                text: Typography
                type: secondary
