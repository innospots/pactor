# 提炼自「L3 — 网格 + 末尾占位卡」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: L3 — 网格 + 末尾占位卡
state:
  plugins:
    - id: 1
      icon: users
      title: 用户管理
      subtitle: v0.1.0
      description: 管理插件安装状态与运行生命周期，支持启停与依赖检查。
      tags:
        - { text: 已安装, color: success }
      actions:
        - { text: 停用 }
    - id: 2
      icon: database
      title: 数据同步
      subtitle: v2.3.1
      description: 定时将外部数据源同步至平台，支持增量与全量两种模式。
      tags:
        - { text: 未安装 }
      actions:
        - { text: 安装, variant: primary }
body:
  type: Page
  children:
    # createText 渲染首格「新建」占位卡（虚线、内容居中），占 1 格参与网格流
    - type: CardList
      props:
        items: ${state.plugins}
        columns: 3
        createText: 新建插件
        showCount: true
      events:
        onCreateClick:
          - action: message
            params: { messageType: info, text: 打开新建插件弹层 }
        onItemAction:
          - action: message
            params:
              messageType: info
              text: 已触发「${event.text}」：${event.item.title}
