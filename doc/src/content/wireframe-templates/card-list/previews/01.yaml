# 提炼自「L1 — 响应式网格（默认）」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: L1 — 响应式网格（默认）
state:
  plugins:
    - id: 1
      icon: users
      title: 用户管理
      subtitle: v0.1.0
      description: 管理插件安装状态与运行生命周期，支持启停与依赖检查。
      tags:
        - { text: 已安装, color: success }
      actions:
        - { text: 停用 }
    - id: 2
      icon: database
      title: 数据同步
      subtitle: v2.3.1
      description: 定时将外部数据源同步至平台，支持增量与全量两种模式。
      tags:
        - { text: 已安装, color: success }
      actions:
        - { text: 停用 }
    - id: 3
      icon: file-text
      title: 审计日志
      subtitle: v1.8.0
      description: 记录平台关键操作与登录行为，提供检索与导出能力。
      tags:
        - { text: 未安装 }
      actions:
        - { text: 安装, variant: primary }
    - id: 4
      icon: bell
      title: 消息通知
      subtitle: v3.0.2
      description: 站内信、邮件与 Webhook 多渠道通知，支持模板配置。
      tags:
        - { text: 已安装, color: success }
      actions:
        - { text: 停用 }
    - id: 5
      icon: chart
      title: 报表中心
      subtitle: v0.9.5
      description: 预置常用运营报表，支持自定义指标与订阅推送。
      tags:
        - { text: 未安装 }
      actions:
        - { text: 安装, variant: primary }
    - id: 6
      icon: folder
      title: 文件存储
      subtitle: v1.2.4
      description: 对接对象存储服务，提供统一的上传、预览与权限管理。
      tags:
        - { text: 已安装, color: success }
      actions:
        - { text: 停用 }
body:
  type: Page
  children:
    # 页面工具栏：标题 + 刷新
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Text
          props:
            text: 插件列表
            strong: true
            size: large
        - type: Button
          props:
            text: 刷新
            icon: refresh
            variant: text
    # 筛选区（F1 形态，见「搜索列表页」模板）
    - type: Form
      props:
        layout: inline
      children:
        - type: Field
          props: { label: 关键词 }
          children:
            - type: Input
              props:
                name: keyword
                placeholder: 输入插件名称
        - type: Field
          props: { label: 状态 }
          children:
            - type: Select
              props:
                name: status
                value: all
                options:
                  - { label: 全部, value: all }
                  - { label: 已安装, value: installed }
                  - { label: 未安装, value: notInstalled }
        - type: Field
          children:
            - type: Button
              props:
                text: 查询
                variant: primary
                submit: true
            - type: Button
              props:
                text: 重置
    # 卡片网格 + 结果计数：CardList 业务组件一次完成
    - type: CardList
      props:
        items: ${state.plugins}
        columns: 3
        showCount: true
      events:
        onItemAction:
          - action: message
            params:
              messageType: info
              text: 已触发「${event.text}」：${event.item.title}
