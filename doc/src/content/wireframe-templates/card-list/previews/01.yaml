# 提炼自「L1 — 响应式网格（默认）」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: L1 — 响应式网格（默认）
state:
  plugins:
    - id: 1
      name: 用户管理
      version: 0.1.0
      desc: 管理插件安装状态与运行生命周期，支持启停与依赖检查。
      statusText: 已安装
      statusColor: success
    - id: 2
      name: 数据同步
      version: 2.3.1
      desc: 定时将外部数据源同步至平台，支持增量与全量两种模式。
      statusText: 已安装
      statusColor: success
    - id: 3
      name: 审计日志
      version: 1.8.0
      desc: 记录平台关键操作与登录行为，提供检索与导出能力。
      statusText: 未安装
      statusColor: default
    - id: 4
      name: 消息通知
      version: 3.0.2
      desc: 站内信、邮件与 Webhook 多渠道通知，支持模板配置。
      statusText: 已安装
      statusColor: success
    - id: 5
      name: 报表中心
      version: 0.9.5
      desc: 预置常用运营报表，支持自定义指标与订阅推送。
      statusText: 未安装
      statusColor: default
    - id: 6
      name: 文件存储
      version: 1.2.4
      desc: 对接对象存储服务，提供统一的上传、预览与权限管理。
      statusText: 已安装
      statusColor: success
body:
  type: Page
  children:
    # 页面工具栏：标题 + 刷新
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Text
          props:
            text: 插件列表
            strong: true
            size: large
        - type: Button
          props:
            text: 刷新
            icon: refresh
            variant: text
    # 筛选区（F1 形态，见「搜索列表页」模板）
    - type: Form
      props:
        layout: inline
      children:
        - type: Field
          props: { label: 关键词 }
          children:
            - type: Input
              props:
                name: keyword
                placeholder: 输入插件名称
        - type: Field
          props: { label: 状态 }
          children:
            - type: Select
              props:
                name: status
                value: all
                options:
                  - { label: 全部, value: all }
                  - { label: 已安装, value: installed }
                  - { label: 未安装, value: notInstalled }
        - type: Field
          children:
            - type: Button
              props:
                text: 查询
                variant: primary
                submit: true
            - type: Button
              props:
                text: 重置
    # 卡片网格：For 承担网格容器（maxColumns 4，预览取 3 列）
    - type: For
      props:
        items: ${state.plugins}
        keyField: id
        columns: 3
      children:
        - type: Card
          children:
            - type: Flex
              props:
                direction: vertical
                gap: 8
              children:
                # 上层·平铺：左 Logo+标题+版本，右状态 Tag
                - type: Flex
                  props:
                    justify: space-between
                    align: center
                  children:
                    - type: Flex
                      props:
                        align: center
                        gap: 8
                      children:
                        - type: Flex
                          props:
                            align: center
                            justify: center
                            className: size-9 rounded-md bg-muted
                          children:
                            - type: Icon
                              props:
                                name: package
                        - type: Flex
                          props:
                            direction: vertical
                            gap: 2
                          children:
                            - type: Text
                              props:
                                text: ${row.name}
                                strong: true
                            - type: Text
                              props:
                                text: v${row.version}
                                type: secondary
                                size: small
                    - type: Tag
                      props:
                        text: ${row.statusText}
                        color: ${row.statusColor}
                # 中层·居左：描述区域固定两行高度，超出截断
                - type: Text
                  props:
                    text: ${row.desc}
                    type: secondary
                    size: small
                    className: line-clamp-2
                    style: { minHeight: 32 }
                # 下层·居右·浅底栏：主操作长方形按钮
                - type: Flex
                  props:
                    justify: end
                    gap: 4
                    className: -mx-4 -mb-4 mt-1 rounded-b-lg bg-muted px-4 py-2
                  children:
                    - type: Button
                      props:
                        text: 停用
    # 结果计数（卡片列表常仅展示总数）
    - type: Text
      props:
        text: 共 ${state.plugins.length} 个
        type: secondary
        size: small
