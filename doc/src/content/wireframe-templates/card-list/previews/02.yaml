title: L2 — 单列宽卡片
body:
  type: Flex
  props:
    direction: column
    gap: 16
  children:
    - type: Grid
      props:
        columns: 1
      children:
        - type: Card
          children:
            - type: Flex
              props:
                direction: vertical
                gap: 8
              children:
                - type: Text
                  props:
                    text: 卡片标题
                - type: Text
                  props:
                    text: 卡片内容描述
                    type: secondary
