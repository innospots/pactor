# 提炼自「L2 — 单列宽卡片」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: L2 — 单列宽卡片
state:
  plugins:
    - id: 1
      icon: users
      title: 用户管理
      subtitle: v0.1.0
      description: 管理插件安装状态与运行生命周期，支持启停、依赖检查与灰度发布，覆盖平台全部业务空间。
      meta: 平台组 · 更新于 2026-09-28
      tags:
        - { text: 已安装, color: success }
      actions:
        - { text: 配置, variant: link }
        - { text: 停用 }
    - id: 2
      icon: database
      title: 数据同步
      subtitle: v2.3.1
      description: 定时将外部数据源同步至平台，支持增量与全量两种模式，失败自动重试并推送告警。
      meta: 数据组 · 更新于 2026-09-20
      tags:
        - { text: 未安装 }
      actions:
        - { text: 配置, variant: link }
        - { text: 安装, variant: primary }
body:
  type: Page
  children:
    # 单列宽卡片：columns: 1，meta 与描述在中层平铺
    - type: CardList
      props:
        items: ${state.plugins}
        columns: 1
        showCount: true
      events:
        onItemAction:
          - action: message
            params:
              messageType: info
              text: 已触发「${event.text}」：${event.item.title}
