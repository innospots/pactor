# 提炼自「布局 T-html / T-plain — HTML 与纯文本卡」：RichText 渲染消毒后 HTML 子集，Text 承载一两句无排版备注。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 T-html / T-plain — HTML 与纯文本卡
height: 560
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16 }
      children:
        - type: Card
          props: { title: 活动说明, className: w-full }
          children:
            - type: RichText
              props:
                html: |
                  <h3>限时优惠</h3>
                  <p>即日起至年底，<strong>年费 8 折</strong>。</p>
                  <ul>
                    <li>仅限新购</li>
                    <li>不可与代金券叠加</li>
                  </ul>
        - type: Card
          props: { title: 备注, className: w-full }
          children:
            - type: Text
              props:
                text: 本订单仅用于内部测试，请勿绑定生产密钥。
