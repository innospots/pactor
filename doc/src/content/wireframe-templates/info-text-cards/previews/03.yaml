# 提炼自「布局 T-markdown — Markdown 文本卡」：Card 承载 Markdown 阅读区，覆盖标题 / 列表 / 引用 / 代码 / 表格 / 链接。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 T-markdown — Markdown 文本卡
height: 640
body:
  type: Page
  children:
    - type: Card
      props: { title: 接入指南, className: w-full }
      children:
        - type: Markdown
          props:
            content: |
              ## 准备工作

              请先创建客户端并记录 **Client ID**。

              ### 步骤

              1. 控制台创建客户端
              2. 下载凭证
              3. 配置回调 URL

              > 注意：回调须为 HTTPS。

              行内代码 `client_id` 与代码块：

              ```bash
              curl -X POST https://api.example.com/v1/token \
                -H "Authorization: Bearer <token>" \
                -d "client_id=<client_id>"
              ```

              | 参数 | 必填 | 说明 |
              | --- | --- | --- |
              | name | 是 | 显示名 |
              | client_id | 是 | 客户端 ID |
              | callback_url | 否 | 回调地址 |

              详见[开放平台文档](https://example.com/docs)。
