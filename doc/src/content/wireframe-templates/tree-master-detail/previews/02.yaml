# 提炼自「布局 B — 窄树 + 宽表单（3:7）」：占位已清洗、示例数据已注入，可直接渲染。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 B — 窄树 + 宽表单（3:7）
state:
  tree:
    - key: home
      title: 首页
    - key: system
      title: 系统管理
      children:
        - key: menu
          title: 菜单管理
        - key: role
          title: 角色管理
        - key: user
          title: 用户管理
    - key: help
      title: 帮助中心
      children:
        - key: doc
          title: 使用文档
        - key: changelog
          title: 更新日志
body:
  type: Page
  children:
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Text
          props:
            text: 自定义导航配置
            strong: true
            size: large
        - type: Button
          props:
            text: 新建节点
            variant: primary
            icon: plus
    # 窄树（3）+ 宽表单（7）：左侧仅搜索与节点标题，右侧容纳长表单
    - type: Flex
      props:
        gap: middle
        align: start
      children:
        - type: Card
          props:
            title: 导航结构
            style: { flex: 3 }
          children:
            - type: Flex
              props:
                direction: vertical
                gap: small
              children:
                - type: Input
                  props:
                    name: keyword
                    placeholder: 搜索节点
                - type: Tree
                  props:
                    treeData: ${state.tree}
                    defaultExpandedKeys: [system, help]
                    defaultSelectedKeys: [changelog]
        - type: Card
          props:
            title: 节点属性
            style: { flex: 7 }
          children:
            - type: Form
              props:
                layout: vertical
              children:
                # Form 内控件必须放 Field 内（label / required 归 Field）
                - type: Field
                  props: { label: 名称, required: true }
                  children:
                    - type: Input
                      props:
                        name: name
                        value: 更新日志
                - type: Field
                  props: { label: 类型 }
                  children:
                    - type: RadioGroup
                      props:
                        name: type
                        direction: horizontal
                        value: link
                        options:
                          - { label: 目录, value: catalog }
                          - { label: 页面, value: page }
                          - { label: 外链, value: link }
                - type: Field
                  props: { label: 外链 URL }
                  children:
                    - type: Input
                      props:
                        name: url
                        value: https://example.com/changelog
                        placeholder: https://
                - type: Field
                  props: { label: 页面入口 }
                  children:
                    - type: Select
                      props:
                        name: entry
                        placeholder: 选择已发布页面（类型为页面时必填）
                        options:
                          - { label: 帮助中心 / 使用文档, value: doc }
                          - { label: 帮助中心 / 常见问题, value: faq }
                - type: Field
                  props: { label: 打开方式 }
                  children:
                    - type: RadioGroup
                      props:
                        name: target
                        direction: horizontal
                        value: blank
                        options:
                          - { label: 当前页, value: self }
                          - { label: 新窗口, value: blank }
                - type: Field
                  props: { label: 排序 }
                  children:
                    - type: NumberInput
                      props:
                        name: sort
                        value: 20
                - type: Field
                  children:
                    - type: Switch
                      props:
                        name: visible
                        label: 显示
                        value: true
                - type: Field
                  children:
                    - type: Flex
                      props:
                        justify: end
                        gap: 8
                      children:
                        - type: Button
                          props:
                            text: 取消
                        - type: Button
                          props:
                            text: 保存
                            variant: primary
                            submit: true
