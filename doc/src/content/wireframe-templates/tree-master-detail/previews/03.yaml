# 提炼自「布局 C — 树表格」：Table 原生树形数据（children 自动树形）+ 行拖拽排序（rowDraggable）。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 C — 树表格（树形数据 + 拖拽排序）
height: 420
body:
  type: Page
  children:
    - type: Card
      children:
        - type: Table
          props:
            # 行数据含 children 自动树形；默认全部展开，拖拽手柄列同级内排序
            rowDraggable: true
            defaultExpandAllRows: true
            columns:
              - title: 名称
                dataIndex: name
              - title: 类型
                dataIndex: type
              - title: 排序
                dataIndex: sort
                align: right
                sorter: true
              - title: 显示
                cell:
                  type: Status
                  props:
                    status: ${row.visibleType}
                    text: ${row.visibleText}
              - title: 操作
                width: 120
                align: center
                cell:
                  type: Button
                  props:
                    text: 编辑
                    variant: link
            dataSource:
              - { id: 1, name: 首页, type: 页面, sort: 10, visibleType: success, visibleText: 显示 }
              - id: 2
                name: 系统管理
                type: 目录
                sort: 20
                visibleType: success
                visibleText: 显示
                children:
                  - { id: 21, name: 菜单管理, type: 页面, sort: 10, visibleType: success, visibleText: 显示 }
                  - { id: 22, name: 角色管理, type: 页面, sort: 20, visibleType: default, visibleText: 隐藏 }
                  - { id: 23, name: 用户管理, type: 页面, sort: 30, visibleType: success, visibleText: 显示 }
              - id: 3
                name: 帮助中心
                type: 目录
                sort: 30
                visibleType: success
                visibleText: 显示
                children:
                  - { id: 31, name: 使用文档, type: 外链, sort: 10, visibleType: success, visibleText: 显示 }
