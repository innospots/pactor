# 提炼自「布局 B — 多选添加成员」：成员列表背景 + 640px Dialog，内嵌筛选行 + 多选 Table + 已选计数与底部操作。
# 交互：「添加成员」打开弹窗；遮罩 / 取消关闭；「添加到角色」关闭并提示。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 B — 多选添加成员
height: 560
state: { addOpen: true }
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16 }
      children:
        - type: Flex
          props: { justify: space-between, align: center }
          children:
            - type: Text
              props: { text: 成员列表, size: large, strong: true }
            - type: Button
              props: { text: 添加成员, variant: primary, icon: plus }
              events:
                onClick:
                  - action: setState
                    params: { addOpen: true }
        - type: Table
          props:
            columns:
              - { title: 姓名, dataIndex: name }
              - { title: 账号, dataIndex: account }
              - { title: 组织, dataIndex: org }
              - { title: 加入时间, dataIndex: joinedAt }
            dataSource:
              - { id: 1, name: 张三, account: zhangsan, org: 平台研发部, joinedAt: 2026-02-01 }
              - { id: 2, name: 李四, account: lisi, org: 平台研发部, joinedAt: 2026-03-18 }
        - type: Dialog
          props:
            title: 添加到「超级管理员」
            open: "${state.addOpen}"
            style: { width: 640, maxWidth: 'none' }
          events:
            onClose:
              - action: setState
                params: { addOpen: false }
          children:
            - type: Flex
              props: { direction: vertical, gap: 12 }
              children:
                - type: Flex
                  props: { gap: 8 }
                  children:
                    - type: Select
                      props:
                        placeholder: 类型
                        style: { width: 120 }
                        options:
                          - { label: 用户, value: user }
                          - { label: 用户组, value: group }
                    - type: Input
                      props:
                        placeholder: 搜索姓名或账号
                        style: { flex: 1 }
                - type: Table
                  props:
                    rowSelection: true
                    selectedRowKeys: [2]
                    pagination: false
                    columns:
                      - { title: 姓名, dataIndex: name }
                      - { title: 账号, dataIndex: account }
                      - { title: 组织, dataIndex: org }
                      - title: 状态
                        cell:
                          type: Status
                          props:
                            status: "${row.statusType}"
                            text: "${row.statusText}"
                    dataSource:
                      - { id: 1, name: 张三, account: zhangsan, org: 平台研发部, statusType: success, statusText: 正常 }
                      - { id: 2, name: 李四, account: lisi, org: 信息安全部, statusType: success, statusText: 正常 }
                      - { id: 3, name: 王五, account: wangwu, org: 平台研发部, statusType: default, statusText: 停用 }
                - type: Flex
                  props: { justify: space-between, align: center }
                  children:
                    - type: Text
                      props: { text: 已选 1 项, size: small, type: secondary }
                    - type: Flex
                      props: { gap: 8 }
                      children:
                        - type: Button
                          props: { text: 取消 }
                          events:
                            onClick:
                              - action: setState
                                params: { addOpen: false }
                        - type: Button
                          props: { text: 添加到角色, variant: primary }
                          events:
                            onClick:
                              - action: setState
                                params: { addOpen: false }
                              - action: message
                                params: { messageType: success, text: 已添加 1 名成员 }
