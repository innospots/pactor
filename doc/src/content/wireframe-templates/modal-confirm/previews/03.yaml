# 提炼自「布局 C — 信息预览」：自定义导航列表背景 + 560px Dialog 只读展示导航结构，底部仅 [关闭]。
# 交互：行内「预览」打开弹窗；遮罩 / 「关闭」关闭。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 C — 信息预览
height: 520
state: { previewOpen: true }
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16 }
      children:
        - type: Flex
          props: { justify: space-between, align: center }
          children:
            - type: Text
              props: { text: 自定义导航, size: large, strong: true }
            - type: Button
              props: { text: 新增菜单, variant: primary, icon: plus }
        - type: Table
          props:
            columns:
              - { title: 名称, dataIndex: name }
              - { title: 路径, dataIndex: path }
              - title: 操作
                width: 100
                align: center
                cell:
                  type: Button
                  props: { text: 预览, variant: link }
                  events:
                    onClick:
                      - action: setState
                        params: { previewOpen: true }
            dataSource:
              - { id: 1, name: 数据总览, path: /dashboard }
              - { id: 2, name: 资源管理, path: /resources }
        - type: Dialog
          props:
            title: 预览导航
            open: "${state.previewOpen}"
            style: { width: 560, maxWidth: 'none' }
          events:
            onClose:
              - action: setState
                params: { previewOpen: false }
          children:
            - type: Flex
              props: { direction: vertical, gap: 12 }
              children:
                - type: Flex
                  props: { direction: vertical, gap: 8 }
                  children:
                    - type: Flex
                      props: { align: center, gap: 8 }
                      children:
                        - type: Icon
                          props: { name: file-text }
                        - type: Text
                          props: { text: 数据总览 }
                        - type: Text
                          props: { text: /dashboard, size: small, type: secondary }
                    - type: Flex
                      props: { align: center, gap: 8 }
                      children:
                        - type: Icon
                          props: { name: file-text }
                        - type: Text
                          props: { text: 资源管理 }
                        - type: Text
                          props: { text: /resources, size: small, type: secondary }
                    - type: Flex
                      props: { align: center, gap: 8 }
                      children:
                        - type: Icon
                          props: { name: file-text }
                        - type: Text
                          props: { text: 审计日志 }
                        - type: Text
                          props: { text: /audit, size: small, type: secondary }
                - type: Flex
                  props: { justify: end }
                  children:
                    - type: Button
                      props: { text: 关闭, variant: primary }
                      events:
                        onClick:
                          - action: setState
                            params: { previewOpen: false }
