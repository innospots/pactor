# 提炼自「布局 C — 左侧竖 Tab」：Tab ≥4 或左侧需放摘要时使用；Tabs tabPosition=left 竖排页签。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 C — 左侧竖 Tab
height: 560
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16, align: start }
      children:
        - type: Breadcrumb
          props:
            items:
              - { label: 角色管理, href: /roles }
              - { label: 超级管理员 }
        - type: Flex
          props: { align: center, gap: 8 }
          children:
            - type: Text
              props: { text: 超级管理员, size: large, strong: true }
            - type: Status
              props: { status: success, text: 启用 }
            - type: Text
              props: { text: ROLE_ADMIN, type: secondary, size: small }
        - type: Card
          props: { className: w-full }
          children:
            - type: Tabs
              props:
                tabPosition: left
                items:
                  - key: info
                    label: 基本信息
                    children:
                      - type: Flex
                        props: { direction: vertical, className: px-2 py-4 }
                        children:
                          - type: Form
                            children:
                              - type: Field
                                props: { label: 角色名称, required: true }
                                children:
                                  - type: Input
                                    props: { name: name, value: 超级管理员 }
                              - type: Field
                                props: { label: 角色编码, description: 编码创建后不可修改 }
                                children:
                                  - type: Input
                                    props: { name: code, value: ROLE_ADMIN, disabled: true }
                              - type: Field
                                props: { label: 状态 }
                                children:
                                  - type: Switch
                                    props: { name: enabled, value: true }
                              - type: Field
                                props: { label: 备注 }
                                children:
                                  - type: Textarea
                                    props:
                                      name: remark
                                      value: 拥有全部菜单与操作权限，不可删除
                              - type: Field
                                children:
                                  - type: Button
                                    props: { text: 保存, variant: primary, submit: true }
                  - key: permissions
                    label: 权限设置
                    children:
                      - type: Flex
                        props: { direction: vertical, className: px-2 py-4 }
                        children:
                          - type: Table
                            props:
                              pagination: false
                              columns:
                                - { title: 权限点, dataIndex: name }
                                - { title: 描述, dataIndex: description }
                                - title: 状态
                                  cell:
                                    type: Status
                                    props:
                                      status: ${row.statusType}
                                      text: ${row.statusText}
                              dataSource:
                                - { id: 1, name: user:view, description: 查看用户列表与详情, statusType: success, statusText: 已授权 }
                                - { id: 2, name: user:edit, description: 新建、编辑、禁用用户, statusType: success, statusText: 已授权 }
                                - { id: 3, name: audit:export, description: 导出审计日志, statusType: default, statusText: 未授权 }
                  - key: members
                    label: 成员列表
                    children:
                      - type: Flex
                        props: { direction: vertical, className: px-2 py-4 }
                        children:
                          - type: Table
                            props:
                              pagination: false
                              columns:
                                - { title: 成员, dataIndex: name }
                                - { title: 部门, dataIndex: dept }
                                - { title: 加入时间, dataIndex: joinedAt }
                              dataSource:
                                - { id: 1, name: 张三, dept: 平台研发部, joinedAt: 2026-02-01 }
                                - { id: 2, name: 李四, dept: 平台研发部, joinedAt: 2026-03-18 }
                  - key: logs
                    label: 操作日志
                    children:
                      - type: Flex
                        props: { direction: vertical, className: px-2 py-4 }
                        children:
                          - type: Table
                            props:
                              pagination: false
                              columns:
                                - { title: 时间, dataIndex: time }
                                - { title: 操作人, dataIndex: operator }
                                - { title: 动作, dataIndex: action }
                              dataSource:
                                - { id: 1, time: 2026-09-28 16:03, operator: 张三, action: 更新权限设置 }
                                - { id: 2, time: 2026-09-10 09:41, operator: 李四, action: 添加成员 王五 }
