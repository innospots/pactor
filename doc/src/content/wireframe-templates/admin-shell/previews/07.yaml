# 提炼版：布局 A1 通栏顶栏 + 右侧分栏扩展区（Resizable 拖拽调宽，挤压主内容）。
title: 展开形态 D-分栏 — 挤压主内容 + 可拖拽调宽
body:
  type: Layout
  props:
    className: shell-root
  children:
    - type: Header
      props:
        className: shell-header
        logo: /logo.svg
        title: Pactor Console
        locales:
          - { label: 中文, value: zh-CN }
          - { label: English, value: en-US }
        dropdown:
          label: 默认工作空间
          position: right
          items:
            - { label: 默认工作空间, value: default, selected: true }
            - { label: 平台运营, value: ops }
            - { label: 用户研究, value: research }
        user:
          name: 管理员
          items:
            - { label: 个人设置, value: settings, icon: settings }
            - { separator: true }
            - { label: 登出, value: logout, icon: log-out }
    - type: Sidebar
      props:
        className: shell-main
        collapsible: true
        content:
          type: SitemapMenu
          props:
            collapsible: true
            items:
              - { key: home, label: 首页, icon: home }
              - key: assets
                label: 模型资产
                icon: package
                children:
                  - { key: providers, label: 供应商 }
              - key: routing
                label: 模型路由
                icon: share
                children:
                  - { key: routes, label: 路由 }
      children:
        - type: Resizable
          props:
            direction: horizontal
            style: { height: "100%" }
            panels:
              # 主内容区（被右栏挤压，宽度随拖拽变化）
              - children:
                  - type: Content
                    props:
                      className: shell-content
                    children:
                      - type: Flex
                        props:
                          justify: center
                          align: center
                          style: { min-height: 240px }
                        children:
                          - type: Text
                            props: { text: 页面内容出口（宽度被右栏挤压）, type: secondary }
              # 扩展面板（拖拽手柄调宽）
              - defaultSize: 25
                minSizePx: 200
                maxSizePx: 420
                children:
                  - type: Flex
                    props:
                      direction: vertical
                      gap: 8
                      style: { padding: 12px, border-left: 1px solid var(--border), height: "100%" }
                    children:
                      - type: Text
                        props: { text: 扩展面板, type: title }
                      - type: Text
                        props:
                          text: 分栏形态：占据文档流，主内容等比收窄；分栏线可拖拽调宽
                          type: secondary
