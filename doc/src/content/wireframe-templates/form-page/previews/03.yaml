# 提炼自「布局 B2 — 分组多 Card（宽屏横排 / 折叠高级区）」：Grid 两列 Card + Collapsible 高级选项。
# 交互：「保存」校验必填项并提示；「取消」提示。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 B2 — 宽屏横排 + 折叠高级区
height: 560
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16, align: start }
      children:
        - type: Text
          props: { text: 新建接入应用, size: large, strong: true }
        - type: Form
          props: { layout: vertical, className: w-full }
          events:
            onSubmit:
              - action: message
                params: { messageType: success, text: 保存成功 }
          children:
            - type: Grid
              props: { columns: 2, gap: 16 }
              children:
                - type: Card
                  props: { title: 基本信息 }
                  children:
                    - type: Field
                      props: { label: 名称, required: true }
                      children:
                        - type: Input
                          props:
                            name: name
                            placeholder: 请输入应用名称
                            rules:
                              - { required: true, message: 请输入应用名称 }
                    - type: Field
                      props: { label: 编码, required: true, description: 创建后不可修改 }
                      children:
                        - type: Input
                          props:
                            name: code
                            placeholder: 如 data-sync
                            rules:
                              - { required: true, message: 请输入应用编码 }
                - type: Card
                  props: { title: 扩展配置 }
                  children:
                    - type: Field
                      props: { label: 接入区域 }
                      children:
                        - type: Select
                          props:
                            name: region
                            placeholder: 请选择接入区域
                            options:
                              - { label: 华东, value: cn-east }
                              - { label: 华北, value: cn-north }
                              - { label: 华南, value: cn-south }
                    - type: Field
                      props: { label: 回调地址 }
                      children:
                        - type: Input
                          props: { name: callbackUrl, placeholder: https://example.com/callback }
            - type: Collapsible
              props: { title: 高级选项, className: mt-4 }
              children:
                - type: Field
                  props: { label: 数据保留期 }
                  children:
                    - type: Select
                      props:
                        name: retention
                        value: d90
                        options:
                          - { label: 30 天, value: d30 }
                          - { label: 90 天, value: d90 }
                          - { label: 1 年, value: y1 }
                - type: Field
                  props: { label: 开启审计 }
                  children:
                    - type: Switch
                      props: { name: auditEnabled, value: false }
            - type: Field
              props: { className: mt-4 }
              children:
                - type: Flex
                  props: { justify: end, gap: 8 }
                  children:
                    - type: Button
                      props: { text: 取消 }
                      events:
                        onClick:
                          - action: message
                            params: { messageType: info, text: 已取消 }
                    - type: Button
                      props: { text: 保存, variant: primary, submit: true }
