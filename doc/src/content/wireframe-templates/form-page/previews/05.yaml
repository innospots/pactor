# 提炼自「布局 D — 无 Card 裸表单区」：标题 + 描述后直接 Form vertical，字段落在页面背景上。
# 交互：「创建」校验必填项并提示；「取消」提示。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 D — 无 Card 裸表单
height: 560
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16, align: start }
      children:
        - type: Breadcrumb
          props:
            items:
              - { label: 平台用户, href: /platform-users }
              - { label: 添加平台用户 }
        - type: Text
          props: { text: 添加平台用户, size: large, strong: true }
        - type: Text
          props: { text: 为平台运维团队创建登录账号, size: small, type: secondary }
        - type: Form
          props: { layout: vertical, className: w-full }
          events:
            onSubmit:
              - action: message
                params: { messageType: success, text: 创建成功 }
          children:
            - type: Field
              props: { label: 登录名, required: true, description: 创建后不可修改 }
              children:
                - type: Input
                  props:
                    name: username
                    placeholder: 请输入登录名
                    rules:
                      - { required: true, message: 请输入登录名 }
            - type: Field
              props: { label: 显示名称 }
              children:
                - type: Input
                  props: { name: displayName, placeholder: 请输入显示名称 }
            - type: Field
              props: { label: 邮箱 }
              children:
                - type: Input
                  props: { name: email, placeholder: name@example.com }
            - type: Field
              props: { label: 角色 }
              children:
                - type: Select
                  props:
                    name: role
                    placeholder: 请选择角色
                    options:
                      - { label: 平台管理员, value: admin }
                      - { label: 只读运维, value: readonly }
            - type: Field
              children:
                - type: Checkbox
                  props: { name: forceReset, label: 创建后强制首次登录改密, value: true }
            - type: Field
              children:
                - type: Flex
                  props: { justify: end, gap: 8 }
                  children:
                    - type: Button
                      props: { text: 取消 }
                      events:
                        onClick:
                          - action: message
                            params: { messageType: info, text: 已取消 }
                    - type: Button
                      props: { text: 创建, variant: primary, submit: true }
