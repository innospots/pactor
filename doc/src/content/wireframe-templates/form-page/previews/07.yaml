# 提炼自「布局 F — Card 内双列栅格」：Grid columns 2 排短字段，整行字段 gridColumn 跨列。
# 交互：「保存」校验必填项并提示；「取消」提示。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 F — Card 内双列栅格
height: 560
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16, align: start }
      children:
        - type: Text
          props: { text: 编辑企业档案, size: large, strong: true }
        - type: Card
          props: { title: 企业档案, className: w-full }
          children:
            - type: Form
              props: { layout: vertical }
              events:
                onSubmit:
                  - action: message
                    params: { messageType: success, text: 保存成功 }
              children:
                - type: Grid
                  props: { columns: 2, gap: 16 }
                  children:
                    - type: Field
                      props: { label: 法定名称, required: true }
                      children:
                        - type: Input
                          props:
                            name: legalName
                            placeholder: 请输入企业法定名称
                            rules:
                              - { required: true, message: 请输入企业法定名称 }
                    - type: Field
                      props: { label: 统一信用代码 }
                      children:
                        - type: Input
                          props: { name: creditCode, placeholder: 18 位统一社会信用代码 }
                    - type: Field
                      props: { label: 联系人 }
                      children:
                        - type: Input
                          props: { name: contact, placeholder: 请输入联系人姓名 }
                    - type: Field
                      props: { label: 联系电话 }
                      children:
                        - type: Input
                          props: { name: phone, placeholder: 请输入联系电话 }
                    - type: Field
                      props: { label: 邮箱 }
                      children:
                        - type: Input
                          props: { name: email, placeholder: name@example.com }
                    - type: Field
                      props: { label: 注册地址, style: { gridColumn: '1 / -1' } }
                      children:
                        - type: Input
                          props: { name: regAddress, placeholder: 请输入注册地址 }
                - type: Field
                  props: { className: mt-4 }
                  children:
                    - type: Flex
                      props: { justify: end, gap: 8 }
                      children:
                        - type: Button
                          props: { text: 取消 }
                          events:
                            onClick:
                              - action: message
                                params: { messageType: info, text: 已取消 }
                        - type: Button
                          props: { text: 保存, variant: primary, submit: true }
