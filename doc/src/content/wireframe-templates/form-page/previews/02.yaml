# 提炼自「布局 B1 — 分组多 Card（纵向堆叠）」：单 Form 内多 Card 分段，提交钮集中在最底部。
# 交互：「确认开通」校验必填项并提示；「取消」提示。
# 人工提炼入库、落盘维护；构建期只读取，不做推导。
title: 布局 B1 — 分组多 Card（纵向）
height: 640
body:
  type: Page
  children:
    - type: Flex
      props: { direction: vertical, gap: 16, align: start }
      children:
        - type: Text
          props: { text: 开通租户, size: large, strong: true }
        - type: Form
          props: { layout: vertical, className: w-full }
          events:
            onSubmit:
              - action: message
                params: { messageType: success, text: 开通成功 }
          children:
            - type: Card
              props: { title: 租户信息 }
              children:
                - type: Field
                  props: { label: 显示名称, required: true }
                  children:
                    - type: Input
                      props:
                        name: displayName
                        placeholder: 请输入租户显示名称
                        rules:
                          - { required: true, message: 请输入租户显示名称 }
                - type: Field
                  props: { label: 租户编码, required: true, description: 创建后不可修改 }
                  children:
                    - type: Input
                      props:
                        name: tenantCode
                        placeholder: 如 acme-corp
                        rules:
                          - { required: true, message: 请输入租户编码 }
                - type: Field
                  props: { label: 套餐 }
                  children:
                    - type: Select
                      props:
                        name: plan
                        placeholder: 请选择套餐
                        options:
                          - { label: 基础版, value: basic }
                          - { label: 专业版, value: pro }
                          - { label: 旗舰版, value: flagship }
            - type: Card
              props: { title: 企业档案, className: mt-4 }
              children:
                - type: Field
                  props: { label: 法定名称, required: true }
                  children:
                    - type: Input
                      props:
                        name: legalName
                        placeholder: 请输入企业法定名称
                        rules:
                          - { required: true, message: 请输入企业法定名称 }
                - type: Field
                  props: { label: 统一信用代码 }
                  children:
                    - type: Input
                      props: { name: creditCode, placeholder: 18 位统一社会信用代码 }
                - type: Field
                  props: { label: 联系人 }
                  children:
                    - type: Input
                      props: { name: contact, placeholder: 请输入联系人姓名 }
                - type: Field
                  props: { label: 联系电话 }
                  children:
                    - type: Input
                      props: { name: phone, placeholder: 请输入联系电话 }
            - type: Field
              props: { className: mt-4 }
              children:
                - type: Flex
                  props: { justify: end, gap: 8 }
                  children:
                    - type: Button
                      props: { text: 取消 }
                      events:
                        onClick:
                          - action: message
                            params: { messageType: info, text: 已取消 }
                    - type: Button
                      props: { text: 确认开通, variant: primary, submit: true }
