# 默认 404 页（页面不存在）：blank 布局，hidden 路由；宿主可声明同名页面整体替换。
dsl: "1.0"
page:
  id: '404'
  title: 页面不存在
body:
  type: Page
  props: { className: pactor-shell-error-page }
  children:
    - type: Typography
      props: { variant: h1, className: pactor-shell-error-code, text: '404' }
    - type: Typography
      props: { variant: muted, text: 页面不存在或已被移除。 }
    - type: Button
      props: { text: 返回工作台, variant: primary }
      events:
        onClick:
          - action: navigate
            params: { to: /workspace }
