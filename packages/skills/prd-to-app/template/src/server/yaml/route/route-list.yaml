                                            text: "${data.routes.items[7].status == 'enabled' ? '停用后，Runtime
                                              不再匹配该路由，客户端通过该入口的调用将失败。' :
                                              '启用后，Runtime
                                              将按入口配置与路由策略匹配并调度该路由。'}"
                                        - type: Flex
                                          props:
                                            direction: vertical
                                            gap: small
                                          children:
                                            - type: Text
                                              props:
                                                text: 影响范围：
                                                strong: true
                                            - type: Text
                                              props:
                                                text: · 关联模型：${data.routes.items[7].models.length} 个（启用
                                                  ${data.routes.items[7].enabledModelCount}
                                                  个）
                                                type: secondary
                                            - type: Text
                                              props:
                                                text: · 请求入口：${data.routes.items[7].path} · ${data.routes.items[7].protocol}
                                                type: secondary
                                        - type: Text
                                          when: ${data.routes.items[7].status == 'enabled' &&
                                            data.routes.items[7].enabledModelCount
                                            > 0}
                                          props:
                                            size: small
                                            text: ⚠ 存在启用模型时，建议先完成流量切换再停用。
                                            type: warning
                                        - type: Flex
                                          props:
                                            justify: end
                                            gap: middle
                                          children:
                                            - type: Button
                                              props:
                                                text: 取消
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                            - type: Button
                                              props:
                                                text: "${data.routes.items[7].status == 'enabled' ? '确认停用' : '确认启用'}"
                                                variant: primary
                                                danger: ${data.routes.items[7].status == 'enabled'}
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                                    params:
                                                      payload:
                                                        ok: true
                              - action: if
                                params:
                                  condition: ${actions.statusCfm.ok}
                                  then:
                                    - action: message
                                      params:
                                        messageType: success
                                        text: "${data.routes.items[7].status == 'enabled' ? '已停用' : '已启用'}（演示：静态页面不落库）"
                    - type: Tooltip
                      props:
                        content: 编辑
                      children:
                        - type: Button
                          props:
                            icon: pencil
                            variant: text
                            size: small
                            className: size-6 p-0
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /routes/${data.routes.items[7].code}/edit
                - type: Text
                  props:
                    text: ${data.routes.items[7].entrySummary}
                    type: secondary
                - type: Flex
                  props:
                    align: center
                    gap: small
                    style:
                      flexWrap: wrap
                  children:
                    - type: Badge
                      when: ${data.routes.items[7].tags[0] != null}
                      props:
                        text: ${data.routes.items[7].tags[0]}
                        variant: outline
                    - type: Badge
                      when: ${data.routes.items[7].tags[1] != null}
                      props:
                        text: ${data.routes.items[7].tags[1]}
                        variant: outline
                    - type: Badge
                      when: ${data.routes.items[7].tags[2] != null}
                      props:
                        text: ${data.routes.items[7].tags[2]}
                        variant: outline
                    - type: Badge
                      when: ${data.routes.items[7].tags[3] != null}
                      props:
                        text: ${data.routes.items[7].tags[3]}
                        variant: outline
                    - type: Text
                      when: ${data.routes.items[7].tags.length == 0}
                      props:
                        text: —
                        type: secondary
                - type: Text
                  props:
                    text: ${data.routes.items[7].policySummary}
                    type: secondary
                    className: text-sm
    - type: Empty
      when: ${data.routes.items != null && data.routes.items.length == 0}
      props:
        title: 无匹配路由
        description: 调整状态、类型或标签筛选后重试；也可以新建一条路由
