# 风险决策：总览（根路径）+ 对接日志（/integration-logs）。
# 页面与布局 DSL 在 /api/sitemap 响应中内联下发。
# 外壳：只有二级侧栏（总览 / 对接日志，样式与 next-app-starter 系统管理
# 分组一致）+ 右侧内容区；不含一级图标轨——一级菜单由对接后的主应用提供。
id: site
resourceType: sitemap
version: 3
dslVersion: "1.0"
app: { name: Pactor Console }

layouts:
  # 模块壳：二级侧栏 + 右侧内容区（PageOutlet）
  admin:
    dsl: "1.0"
    body:
      type: Layout
      props: { className: shell-root }
      children:
        - type: Flex
          props: { className: kn-shell }
          children:
            - type: ModuleSidebar
              props:
                title: 风险决策
                items:
                  - { path: /, title: 总览 }
                  - { path: /integration-logs, title: 对接日志 }
            - type: Content
              props: { className: shell-content }
              children:
                - type: PageOutlet

pages:
  - id: risk-decision
    path: /
    title: 总览
    version: 1
    file: risk-decision/risk-decision.page.yaml
  # 总览「查看对接日志」跳转进入
  - id: integration-logs
    path: /integration-logs
    title: 对接日志
    version: 1
    file: risk-decision/integration-logs.page.yaml

menus:
  - id: risk-decision
    type: group
    title: 风险决策
    icon: shield
    children:
      - id: overview
        type: page
        pageId: risk-decision
        path: /
        title: 总览
        layout: admin
        public: true
      - id: integration-logs
        type: page
        pageId: integration-logs
        path: /integration-logs
        title: 对接日志
        layout: admin
        public: true
