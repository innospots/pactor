# Shell 站点定制层：品牌 + 全量导航。
#
# 菜单策略：所有模块在 module-list.json 中设为 menuMode: "hidden"，
# 模块自带的 menus 不再进入导航（仅保留为隐藏路由），导航完全由本文件定义。
# 因此这里的每条菜单都需要：
#   - pageId：装配后的全局页面 id（<moduleId>:<pageId>）；
#   - path：装配后的公开路径（<basePath><pages[].path>），Shell 站点不会
#     自动为跨模块页面推导 path，必须显式写。
#
# 覆盖说明：menus 与包默认站点按 id 合并，同 id 的宿主条目覆盖默认条目。
# 这里用 id: workspace 覆盖默认欢迎页入口，id: themes 保留主题设置。
id: shell
resourceType: sitemap
version: 2
dslVersion: "1.0"
app: { name: InnoSpots }

menus:
  # ── general-app：工作台 / 数据概览 / 系统管理 ────────────────────────
  - { id: workspace, type: page, pageId: "pactor-app-general-app:workspace", path: /general-app/workspace, title: 工作台, icon: workspace }
  - { id: dashboard, type: page, pageId: "pactor-app-general-app:dashboard", path: /general-app/dashboard, title: 数据概览, icon: chart }

  - id: system
    type: group
    title: 系统管理
    icon: settings
    children:
      - { id: system-settings, type: page, pageId: "pactor-app-general-app:system-settings", path: /general-app/settings/general, title: 系统设置 }
      - { id: dictionaries, type: page, pageId: "pactor-app-general-app:dictionaries", path: /general-app/settings/dictionaries, title: 字典管理 }
      - { id: audit-logs, type: page, pageId: "pactor-app-general-app:audit-logs", path: /general-app/settings/audit-logs, title: 审计日志 }
      - { id: roles, type: page, pageId: "pactor-app-general-app:roles", path: /general-app/settings/roles, title: 角色管理 }
      - { id: users, type: page, pageId: "pactor-app-general-app:users", path: /general-app/settings/users, title: 用户管理, permission: "user:view" }

  # ── 数据分析 ────────────────────────────────────────────────────────
  - id: data-analysis
    type: group
    title: 数据分析
    icon: chart
    children:
      - { id: da-dashboard, type: page, pageId: "pactor-app-data-analysis:dashboard", path: /data-analysis/dashboard, title: 数据看板, public: true }
      - { id: da-reports, type: page, pageId: "pactor-app-data-analysis:reports", path: /data-analysis/reports, title: 数据报表, public: true }
      - { id: da-users, type: page, pageId: "pactor-app-data-analysis:users", path: /data-analysis/users, title: 用户分析, public: true }
      - { id: da-detail, type: page, pageId: "pactor-app-data-analysis:detail", path: /data-analysis/detail, title: 数据详情, public: true }

  # ── 产品中心 ────────────────────────────────────────────────────────
  - id: product-center
    type: group
    title: 产品中心
    icon: file-text
    children:
      - { id: pc-products, type: page, pageId: "pactor-app-product-center:products", path: /product-center/products, title: 产品管理, public: true }
      - { id: pc-settings, type: page, pageId: "pactor-app-product-center:settings", path: /product-center/settings, title: 产品配置设置, public: true }
      - { id: pc-board, type: page, pageId: "pactor-app-product-center:board", path: /product-center/board, title: 产品状态任务看板, public: true }

  # ── 框架默认菜单 ────────────────────────────────────────────────────
  # 主题设置由包默认站点提供；同 id 覆盖默认条目（保留其路由）
  - { id: themes, type: page, pageId: "shell:themes", path: /settings/themes, title: 主题设置, icon: palette }
