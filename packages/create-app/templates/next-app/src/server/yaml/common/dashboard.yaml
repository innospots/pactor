dsl: "1.0"
page:
  id: dashboard
  title: 仪表盘
  name: dashboard
  description: 运营概览：核心指标、趋势分析、用量构成
state:
  range:
    start: "{{DEMO_DATE_START}}"
    end: "{{DEMO_DATE_END}}"
  trendMetric: requests
dataSources:
  dashboard:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/dashboard
      params:
        start: ${state.range.start}
        end: ${state.range.end}
body:
  type: Page
  children:
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            align: baseline
            gap: middle
          children:
            - type: Typography
              props:
                variant: h3
                text: "${t('dashboard.title')}"
            - type: Typography
              props:
                variant: muted
                text: "${t('dashboard.subtitle')}"
        - type: Flex
          props:
            align: center
            gap: middle
          children:
            - type: Text
              props:
                text: "${t('dashboard.realtime', { rpm: data.dashboard.realtime.rpm, tpm: data.dashboard.realtime.tpm })}"
                type: secondary
                className: tabular-nums
            - type: Button
              props:
                text: "${t('dashboard.refresh')}"
                size: small
              events:
                onClick:
                  - action: reload
                    params:
                      dataSource: dashboard
                  - action: message
                    params:
                      messageType: success
                      text: "${t('dashboard.refreshed')}"
    - type: Card
      children:
        - type: Flex
          props:
            align: center
            gap: middle
          children:
            - type: Text
              props:
                text: "${t('dashboard.rangeLabel')}"
                strong: true
            - type: DatePicker
              props:
                mode: range
                value: ${state.range}
                placeholder: "${t('dashboard.rangePlaceholder')}"
                style:
                  width: 280
                presets:
                  - label: "${t('dashboard.preset.today')}"
                    days: 1
                  - key: thisWeek
                  - key: thisMonth
                  - label: "${t('dashboard.preset.lastDays', { days: 3 })}"
                    days: 3
                  - label: "${t('dashboard.preset.lastDays', { days: 7 })}"
                    days: 7
                  - label: "${t('dashboard.preset.lastDays', { days: 14 })}"
                    days: 14
                  - label: "${t('dashboard.preset.lastDays', { days: 30 })}"
                    days: 30
              events:
                onChange:
                  - action: setState
                    condition: ${event}
                    params:
                      range: ${event}
                  - action: reload
                    condition: ${event}
                    params:
                      dataSource: dashboard
    - type: Typography
      props:
        variant: h4
        text: "${t('dashboard.coreOverview', { start: state.range.start, end: state.range.end })}"
    - type: Row
      props:
        gutter: [16, 16]
        align: stretch
      children:
        - type: Col
          props: { span: 24, md: 12, xl: 6 }
          children:
            - type: Card
              props:
                className: stat-card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: start
                  children:
                    - type: Statistic
                      props:
                        title: "${t('dashboard.stats.requests')}"
                        value: ${data.dashboard.stats.requests}
                    - type: Icon
                      props:
                        name: chart
                        size: lg
                        className: stat-card-icon
                - type: Typography
                  props:
                    variant: muted
                    text: "${t('dashboard.stats.activeClients', { clients: data.dashboard.stats.activeClients, tokens: data.dashboard.stats.tokens })}"
        - type: Col
          props: { span: 24, md: 12, xl: 6 }
          children:
            - type: Card
              props:
                className: stat-card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: start
                  children:
                    - type: Statistic
                      props:
                        title: "${t('dashboard.stats.successRate')}"
                        value: ${data.dashboard.stats.successRate}
                        suffix: "%"
                    - type: Icon
                      props:
                        name: check-circle
                        size: lg
                        className: stat-card-icon
                - type: Button
                  props:
                    text: "${t('dashboard.stats.failures', { failures: data.dashboard.stats.failures, errorRate: data.dashboard.stats.errorRate })}"
                    variant: link
                    size: small
                    style:
                      alignSelf: flex-start
                    className: p-0
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text: "${t('dashboard.toast.callLog')}"
        - type: Col
          props: { span: 24, md: 12, xl: 6 }
          children:
            - type: Card
              props:
                className: stat-card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: start
                  children:
                    - type: Statistic
                      props:
                        title: "${t('dashboard.stats.avgLatency')}"
                        value: ${data.dashboard.stats.avgLatency}
                        suffix: " ms"
                    - type: Icon
                      props:
                        name: clock
                        size: lg
                        className: stat-card-icon
                - type: Button
                  props:
                    text: "${t('dashboard.link.reliability')}"
                    variant: link
                    size: small
                    style:
                      alignSelf: flex-start
                    className: p-0
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text: "${t('dashboard.toast.providerAvailability')}"
        - type: Col
          props: { span: 24, md: 12, xl: 6 }
          children:
            - type: Card
              props:
                className: stat-card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: start
                  children:
                    - type: Statistic
                      props:
                        title: "${t('dashboard.stats.cost')}"
                        value: ${data.dashboard.stats.cost}
                    - type: Icon
                      props:
                        name: credit-card
                        size: lg
                        className: stat-card-icon
                - type: Typography
                  props:
                    variant: muted
                    text: "${t('dashboard.stats.avgCost', { cost: data.dashboard.stats.avgCost })}"
    - type: Card
      props:
        title: "${t('dashboard.trend.title')}"
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
          children:
            - type: Typography
              props:
                variant: muted
                text: "${t('dashboard.trend.subtitle')}"
            - type: ToggleGroup
              props:
                value: ${state.trendMetric}
                options:
                  - label: "${t('dashboard.metric.requests')}"
                    value: requests
                  - label: Token
                    value: tokens
                  - label: "${t('dashboard.metric.cost')}"
                    value: cost
                  - label: "${t('dashboard.metric.latency')}"
                    value: latency
              events:
                onChange:
                  - action: setState
                    condition: ${event}
                    params:
                      trendMetric: ${event}
        - type: AreaChart
          props:
            data: ${data.dashboard.trend}
            xKey: t
            yKeys: ${data.dashboard.metricKeys[state.trendMetric]}
            style:
              height: 320
    - type: Row
      props:
        gutter: [16, 16]
        align: stretch
      children:
        - type: Col
          props: { span: 24, md: 12 }
          children:
            - type: Card
              props:
                title: "${t('dashboard.usage.models')}"
              children:
                - type: Typography
                  props:
                    variant: muted
                    text: "${t('dashboard.usage.modelsSubtitle')}"
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.models[0].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.models[0].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.models[0].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.models[1].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.models[1].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.models[1].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.models[2].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.models[2].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.models[2].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.models[3].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.models[3].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.models[3].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Button
                  props:
                    text: "${t('dashboard.link.allModels')}"
                    variant: link
                    size: small
                    style:
                      alignSelf: flex-start
                    className: p-0
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text: "${t('dashboard.toast.models')}"
        - type: Col
          props: { span: 24, md: 12 }
          children:
            - type: Card
              props:
                title: "${t('dashboard.usage.clients')}"
              children:
                - type: Typography
                  props:
                    variant: muted
                    text: "${t('dashboard.usage.clientsSubtitle')}"
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[0].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.clients[0].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[0].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[1].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.clients[1].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[1].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[2].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.clients[2].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[2].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[3].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.clients[3].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[3].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Button
                  props:
                    text: "${t('dashboard.link.allClients')}"
                    variant: link
                    size: small
                    style:
                      alignSelf: flex-start
                    className: p-0
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text: "${t('dashboard.toast.clients')}"
