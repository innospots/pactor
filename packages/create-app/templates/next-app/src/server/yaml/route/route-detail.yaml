dsl: "1.0"
page:
  id: route-detail
  title: 路由详情
  name: routeDetail
  description: 模型路由 / 路由详情：基本信息、入口配置、模型与路由策略（单页纵向，无 Tab）
dataSources:
  detail:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/routes/${route.params.code}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 模型路由
          - label: 路由
            href: /routes
          - label: ${route.params.code}
    - type: Flex
      when: ${data.detail != null}
      props:
        direction: vertical
        gap: middle
        align: stretch
      children:
        - type: Card
          children:
            - type: Flex
              props:
                justify: space-between
                align: middle
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-12 shrink-0 rounded-full bg-(--muted)
                      children:
                        - type: Icon
                          props:
                            name: list-filter
                            size: 24
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 0
                      children:
                        - type: Flex
                          props:
                            align: center
                            gap: middle
                          children:
                            - type: Typography
                              props:
                                variant: h3
                                text: ${data.detail.name}
                            - type: StatusBadge
                              props:
                                status: ${data.detail.status}
                        - type: Text
                          props:
                            text: ${data.detail.code} · ${data.detail.typeLabel} · ${data.detail.path}
                            type: secondary
                - type: Flex
                  props:
                    align: center
                    gap: small
                  children:
                    - type: Button
                      props:
                        text: 编辑
                        icon: edit
                        variant: primary
                        size: small
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /routes/${route.params.code}/edit
                    - type: Button
                      props:
                        text: "${data.detail.status == 'enabled' ? '停用' : '启用'}"
                        icon: "${data.detail.status == 'enabled' ? 'x-circle' : 'check-circle'}"
                        size: small
                      events:
                        onClick:
                          - id: statusCfm
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: "${data.detail.status == 'enabled' ? '确认停用 Route' : '确认启用 Route'}"
                                width: 480
                                content:
                                  type: Flex
                                  props:
                                    direction: vertical
                                    gap: middle
                                  children:
                                    - type: Text
                                      props:
                                        size: small
                                        text: "${data.detail.status == 'enabled' ? '停用后，Runtime 不再匹配该路由，客户端通过该入口的调用将失败。'
                                          : '启用后，Runtime 将按入口配置与路由策略匹配并调度该路由。'}"
                                    - type: Flex
                                      props:
                                        direction: vertical
                                        gap: small
                                      children:
                                        - type: Text
                                          props:
                                            text: 影响范围：
                                            strong: true
                                        - type: Text
                                          props:
                                            text: · 关联模型：${data.detail.models.length} 个（启用 ${data.detail.enabledModelCount}
                                              个）
                                            type: secondary
                                        - type: Text
                                          props:
                                            text: · 请求入口：${data.detail.path} · ${data.detail.protocol}
                                            type: secondary
                                    - type: Text
                                      when: ${data.detail.status == 'enabled' && data.detail.enabledModelCount > 0}
                                      props:
                                        size: small
                                        text: ⚠ 存在启用模型时，建议先完成流量切换再停用。
                                        type: warning
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: middle
                                      children:
                                        - type: Button
                                          props:
                                            text: 取消
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: "${data.detail.status == 'enabled' ? '确认停用' : '确认启用'}"
                                            variant: primary
                                            danger: ${data.detail.status == 'enabled'}
                                          events:
                                            onClick:
                                              - action: overlay.close
                                                params:
                                                  payload:
                                                    ok: true
                          - action: if
                            params:
                              condition: ${actions.statusCfm.ok}
                              then:
                                - action: message
                                  params:
                                    messageType: success
                                    text: 状态已切换
                    - type: Button
                      props:
                        text: 模拟调用
                        icon: zap
                        size: small
                      events:
                        onClick:
                          - id: simulate
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: 模拟调用
                                width: 560
                                content:
                                  type: Flex
                                  props:
                                    direction: vertical
                                    gap: middle
                                    align: stretch
                                  children:
                                    - type: Text
                                      props:
                                        text: 输入 channel、routeTag 等参数，演算当前路由的命中模型与策略结果。
                                        type: secondary
                                        className: text-sm
                                    - type: Field
                                      props:
                                        label: Channel
                                      children:
                                        - type: Input
                                          props:
                                            className: w-full
                                            placeholder: 如 web / ios / android
                                    - type: Field
                                      props:
                                        label: Route Tag
                                      children:
                                        - type: Input
                                          props:
                                            className: w-full
                                            placeholder: 可选，如 premium
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: middle
                                      children:
                                        - type: Button
                                          props:
                                            text: 取消
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: 运行演算
                                            icon: send
                                            variant: primary
                                          events:
                                            onClick:
                                              - action: overlay.close
                                              - action: message
                                                params:
                                                  messageType: success
                                                  text: 命中模型：${data.detail.models[0].modelName} ·
                                                    策略：${data.detail.strategyLabel}
                    - type: DropdownMenu
                      props:
                        items:
                          - label: 复制路由标识
                            value: copy
                            icon: copy
                          - label: 导出配置 JSON
                            value: export
                            icon: download
                      events:
                        onSelect:
                          - action: message
                            params:
                              messageType: info
                              text: 操作：${event}
                      children:
                        - type: Button
                          props:
                            text: ···
                            variant: text
        - type: Card
          props:
            title: ① 基本信息
          children:
            - type: Flex
              props:
                direction: vertical
                gap: middle
                align: stretch
              children:
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 路由名称
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.name}
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 路由标识
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.code}（创建后不可修改）
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 类型
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.typeLabel}
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 逻辑模型 Alias
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: "${data.detail.alias != '' ? data.detail.alias : '—'}"
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 标签
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: "${data.detail.tagsText != '' ? data.detail.tagsText : '—'}"
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 描述
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: "${data.detail.description != '' ? data.detail.description : '—'}"
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 状态
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: "${data.detail.status == 'enabled' ? '● 启用' : data.detail.status ==
                          'disabled' ? '● 停用' : '草稿'}"
        - type: Card
          props:
            title: ② 入口配置
          children:
            - type: Flex
              props:
                direction: vertical
                gap: middle
                align: stretch
              children:
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 请求路径
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.path}
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 协议格式
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.protocol}
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: Ingress Operation
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.operation}
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 协议说明
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: Schema 引用与示例 JSON（只读）
                            type: secondary
                        - type: Button
                          props:
                            text: 查看 Schema / 示例 JSON
                            icon: code
                            size: small
                          events:
                            onClick:
                              - id: schemaView
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: 协议说明
                                    width: 560
                                    content:
                                      type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                        align: stretch
                                      children:
                                        - type: Alert
                                          props:
                                            showIcon: true
                                            variant: info
                                            message: Ingress Protocol 描述对外请求格式，与 Model「提供商」Tab 中的上游协议无关。
                                        - type: Text
                                          props:
                                            text: >-
                                              {
                                                "model": "reasoning",
                                                "messages": [
                                                  { "role": "system", "content": "You are a helpful assistant." },
                                                  { "role": "user", "content": "你好" }
                                                ],
                                                "channel": "web",
                                                "routeTag": "premium"
                                              }
                                            className: font-mono text-sm whitespace-pre-wrap break-all
        - type: Card
          props:
            title: ③ 模型与路由策略
          children:
            - type: Flex
              props:
                direction: vertical
                gap: middle
                align: stretch
              children:
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 路由策略
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: ${data.detail.strategySummary}
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 粘性 Session
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: "${data.detail.stickySession ? '开' : '关'}"
                - type: Flex
                  props:
                    align: baseline
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: 健康过滤
                        type: secondary
                        style:
                          width: 180
                          flexShrink: 0
                    - type: Text
                      props:
                        text: "${data.detail.healthFilter ? '仅调度 HEALTHY 实例' : '关闭'}"
            - type: Table
              props:
                dataSource: ${data.detail.models}
                rowKey: modelCode
                pagination: false
                className: mt-2
                columns:
                  - title: Model
                    cell:
                      type: Button
                      props:
                        text: ${row.modelName}
                        variant: link
                        size: small
                        className: p-0 h-auto
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /models/${row.modelCode}
                  - title: Provider 摘要
                    dataIndex: providerSummary
                  - title: 权重
                    cell:
                      type: Text
                      props:
                        text: ${row.weight}
                        className: tabular-nums
                  - title: 优先级
                    dataIndex: priority
                  - title: C
                    cell:
                      type: Text
                      props:
                        text: "${row.costRate == null ? '继承' : '×' + row.costRate}"
                  - title: M
                    cell:
                      type: Text
                      props:
                        text: "${row.billingRate == null ? '继承' : '×' + row.billingRate}"
                  - title: 状态
                    cell:
                      type: StatusBadge
                      props:
                        status: ${row.status}
            - type: Text
              when: ${data.detail.models.length == 0}
              props:
                text: 尚未添加模型；草稿允许 0 条，启用前至少 1 条启用模型。
                type: secondary
            - type: Text
              props:
                text: 权重合计（启用）${data.detail.weightTotal} · 点击模型名 → Model 详情
                type: secondary
                className: text-sm
    - type: Empty
      when: ${data.detail == null && !dataStatus.detail.loading}
      props:
        title: 未找到路由
        description: 路由标识「${route.params.code}」不存在或已被删除
      children:
        - type: Button
          props:
            text: 返回列表
            variant: primary
          events:
            onClick:
              - action: navigate
                params:
                  to: /routes
