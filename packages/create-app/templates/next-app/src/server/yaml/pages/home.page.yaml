# 首页 DSL：内联在 sitemap 中下发（需登录）。
# ${data.session.user.name} 由客户端注入的 session dataSource 提供。
dsl: "1.0"
page:
  id: home
  title: $i18n{page.home.text1:首页}
  name: home
  grantGroup: homeGroup

i18n:
  namespaces: [ app ]

body:
  type: Page
  props: { title: "$i18n{page.home.text2:首页}" }
  children:
    - type: Alert
      props:
        variant: info
        message:
          $i18n:
            key: page.home.text3
            params:
              name: ${data.session.user.name}
            fallback: 欢迎回来，{{name}}！
        description: $i18n{page.home.text4:本页与外壳布局均由 sitemap
          对象下发（design/dynamic-page.md）；菜单随角色裁剪。}
        style: { marginBottom: 16 }
    - type: Button
      props: { text: "$i18n{page.home.text5:查看月报（需 report:view）}" }
      events:
        onClick:
          - action: navigate
            params: { to: /reports/monthly }
