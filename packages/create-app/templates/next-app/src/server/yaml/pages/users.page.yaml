# 用户列表页 DSL：由 /api/pages/users 懒加载下发（见 src/server/sitemap.ts）。
# 数据来自 /api/users（接口侧鉴权，需登录且具备 user:view 权限）。
dsl: "1.0"
page:
  id: users
  title: $i18n{page.users.text1:用户列表}
  name: users
  grantGroup: userGroup
  permission: user:view

state:
  keyword: ""
  role: ""

dataSources:
  users:
    type: http
    autoLoad: true
    request:
      method: GET
      url: http://localhost:9011/api/users
      params:
        keyword: ${state.keyword}
        role: ${state.role}

i18n:
  namespaces: [ app ]

body:
  type: Page
  props: { title: "$i18n{page.users.text2:用户列表}" }
  children:
    - type: Card
      props: { title: "$i18n{page.users.text3:筛选}" }
      children:
        - type: Form
          props: { layout: inline }
          events:
            onSubmit:
              - action: setState
                params:
                  keyword: ${event.keyword}
                  role: ${event.role}
              - action: reload
                params: { dataSource: users }
          children:
            - type: Input
              props:
                {
                  name: keyword,
                  label: "$i18n{page.users.text4:关键词}",
                  placeholder: "$i18n{page.users.text5:姓名 / 用户名}"
                }
            - type: Select
              props:
                name: role
                label: $i18n{page.users.text6:角色}
                placeholder: $i18n{page.users.text7:请选择角色}
                options:
                  - { label: "$i18n{page.users.text8:管理员}", value: admin }
                  - { label: "$i18n{page.users.text9:成员}", value: member }
                  - { label: "$i18n{page.users.text10:访客}", value: guest }
            - type: Button
              props: { text: "$i18n{page.users.text11:查询}", variant: primary, submit: true }
    - type: Card
      props: { title: "$i18n{page.users.text12:用户数据}" }
      children:
        - type: Table
          props:
            dataSource: ${data.users}
            loading: ${dataStatus.users.loading}
            rowKey: id
            pagination: { pageSize: 5 }
            columns:
              - { title: "$i18n{page.users.text13:姓名}", dataIndex: name }
              - { title: "$i18n{page.users.text14:用户名}", dataIndex: username }
              - title: $i18n{page.users.text15:角色}
                dataIndex: role
                cell:
                  type: Badge
                  props:
                    text: ${row.role}
                    variant: secondary
              - { title: "$i18n{page.users.text16:邮箱}", dataIndex: email }
              - { title: "$i18n{page.users.text17:创建时间}", dataIndex: createdAt }
              - title: $i18n{page.users.text18:操作}
                cell:
                  type: Button
                  props: { text: "$i18n{page.users.text19:查看}", variant: primary, size: small }
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text:
                            $i18n:
                              key: page.users.text20
                              params:
                                name: ${row.name}
                                username: ${row.username}
                              fallback: 用户 {{name}}（{{username}}）
