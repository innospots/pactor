dsl: "1.0"
page:
  id: dashboard
  title: $i18n{page.dashboard.title:仪表盘}
  name: dashboard
  description: $i18n{page.dashboard.description:运营概览：核心指标、趋势分析、用量构成}
i18n:
  namespaces:
    - app
state:
  range:
    start: "2026-10-01"
    end: "2026-10-30"
  trendMetric: requests
dataSources:
  dashboard:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/dashboard
      params:
        start: ${state.range.start}
        end: ${state.range.end}
body:
  type: Page
  children:
    - type: Flex
      props:
        direction: vertical
        gap: 20
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
          children:
            - type: Flex
              props:
                align: baseline
                gap: middle
              children:
                - type: Typography
                  props:
                    variant: h3
                    text: $i18n{dashboard.title:仪表盘}
                - type: Typography
                  props:
                    variant: muted
                    text: $i18n{dashboard.subtitle:运营概览}
            - type: Flex
              props:
                align: center
                gap: middle
              children:
                - type: Text
                  props:
                    text:
                      $i18n:
                        key: dashboard.realtime
                        params:
                          rpm: ${data.dashboard.realtime.rpm}
                          tpm: ${data.dashboard.realtime.tpm}
                        fallback: 实时 {{rpm}} RPM · {{tpm}} TPM
                    type: secondary
                    className: tabular-nums
                - type: Button
                  props:
                    text: $i18n{dashboard.refresh:↻ 刷新}
                    size: small
                  events:
                    onClick:
                      - action: reload
                        params:
                          dataSource: dashboard
                      - action: message
                        params:
                          messageType: success
                          text: $i18n{dashboard.refreshed:看板数据已刷新}
        - type: Card
          children:
            - type: Flex
              props:
                align: center
                justify: end
                gap: middle
              children:
                - type: Text
                  props:
                    text: $i18n{dashboard.rangeLabel:分析时间范围}
                    strong: true
                - type: DatePicker
                  props:
                    mode: range
                    value: ${state.range}
                    placeholder: $i18n{dashboard.rangePlaceholder:选择时间范围}
                    style:
                      width: 280
                    presets:
                      - label: $i18n{dashboard.preset.today:今天}
                        days: 1
                      - key: thisWeek
                      - key: thisMonth
                      - label:
                          $i18n:
                            key: dashboard.preset.lastDays
                            params:
                              days: 3
                            fallback: 近{{days}}天
                        days: 3
                      - label:
                          $i18n:
                            key: dashboard.preset.lastDays
                            params:
                              days: 7
                            fallback: 近{{days}}天
                        days: 7
                      - label:
                          $i18n:
                            key: dashboard.preset.lastDays
                            params:
                              days: 14
                            fallback: 近{{days}}天
                        days: 14
                      - label:
                          $i18n:
                            key: dashboard.preset.lastDays
                            params:
                              days: 30
                            fallback: 近{{days}}天
                        days: 30
                  events:
                    onChange:
                      - action: setState
                        condition: ${event}
                        params:
                          range: ${event}
                      - action: reload
                        condition: ${event}
                        params:
                          dataSource: dashboard
        - type: Typography
          props:
            variant: h4
            text:
              $i18n:
                key: dashboard.coreOverview
                params:
                  start: ${state.range.start}
                  end: ${state.range.end}
                fallback: 核心概览 · {{start}} — {{end}}
        - type: Row
          props:
            gutter:
              - 16
              - 16
            align: stretch
          children:
            - type: Col
              props:
                span: 24
                md: 12
                xl: 6
              children:
                - type: Card
                  props:
                    className: stat-card
                  children:
                    - type: Flex
                      props:
                        justify: space-between
                        align: start
                      children:
                        - type: Statistic
                          props:
                            title: $i18n{dashboard.stats.requests:请求量}
                            value: ${data.dashboard.stats.requests}
                        - type: Icon
                          props:
                            name: chart
                            size: lg
                            className: stat-card-icon
                    - type: Typography
                      props:
                        variant: muted
                        text:
                          $i18n:
                            key: dashboard.stats.activeClients
                            params:
                              clients: ${data.dashboard.stats.activeClients}
                              tokens: ${data.dashboard.stats.tokens}
                            fallback: "{{clients}} 位活跃客户端 · {{tokens}} Token"
            - type: Col
              props:
                span: 24
                md: 12
                xl: 6
              children:
                - type: Card
                  props:
                    className: stat-card
                  children:
                    - type: Flex
                      props:
                        justify: space-between
                        align: start
                      children:
                        - type: Statistic
                          props:
                            title: $i18n{dashboard.stats.successRate:成功率}
                            value: ${data.dashboard.stats.successRate}
                            suffix: "%"
                        - type: Icon
                          props:
                            name: check-circle
                            size: lg
                            className: stat-card-icon
                    - type: Button
                      props:
                        text:
                          $i18n:
                            key: dashboard.stats.failures
                            params:
                              failures: ${data.dashboard.stats.failures}
                              errorRate: ${data.dashboard.stats.errorRate}
                            fallback: "{{failures}} 个失败 · 错误率 {{errorRate}}%"
                        variant: link
                        size: small
                        style:
                          alignSelf: flex-start
                        className: p-0
                      events:
                        onClick:
                          - action: message
                            params:
                              messageType: info
                              text: $i18n{dashboard.toast.callLog:跳转调用日志（失败筛选）}
            - type: Col
              props:
                span: 24
                md: 12
                xl: 6
              children:
                - type: Card
                  props:
                    className: stat-card
                  children:
                    - type: Flex
                      props:
                        justify: space-between
                        align: start
                      children:
                        - type: Statistic
                          props:
                            title: $i18n{dashboard.stats.avgLatency:平均响应时间}
                            value: ${data.dashboard.stats.avgLatency}
                            suffix: " ms"
                        - type: Icon
                          props:
                            name: clock
                            size: lg
                            className: stat-card-icon
                    - type: Button
                      props:
                        text: $i18n{dashboard.link.reliability:查看可靠性分析 →}
                        variant: link
                        size: small
                        style:
                          alignSelf: flex-start
                        className: p-0
                      events:
                        onClick:
                          - action: message
                            params:
                              messageType: info
                              text: $i18n{dashboard.toast.providerAvailability:跳转供应商可用性}
            - type: Col
              props:
                span: 24
                md: 12
                xl: 6
              children:
                - type: Card
                  props:
                    className: stat-card
                  children:
                    - type: Flex
                      props:
                        justify: space-between
                        align: start
                      children:
                        - type: Statistic
                          props:
                            title: $i18n{dashboard.stats.cost:计费金额}
                            value: ${data.dashboard.stats.cost}
                        - type: Icon
                          props:
                            name: credit-card
                            size: lg
                            className: stat-card-icon
                    - type: Typography
                      props:
                        variant: muted
                        text:
                          $i18n:
                            key: dashboard.stats.avgCost
                            params:
                              cost: ${data.dashboard.stats.avgCost}
                            fallback: 平均每次 {{cost}}
        - type: Card
          props:
            title: $i18n{dashboard.trend.title:趋势分析}
          children:
            - type: Flex
              props:
                justify: space-between
                align: center
              children:
                - type: Typography
                  props:
                    variant: muted
                    text: $i18n{dashboard.trend.subtitle:观察流量变化与异常峰值}
                - type: ToggleGroup
                  props:
                    value: ${state.trendMetric}
                    options:
                      - label: $i18n{dashboard.metric.requests:请求}
                        value: requests
                      - label: Token
                        value: tokens
                      - label: $i18n{dashboard.metric.cost:费用}
                        value: cost
                      - label: $i18n{dashboard.metric.latency:延迟}
                        value: latency
                  events:
                    onChange:
                      - action: setState
                        condition: ${event}
                        params:
                          trendMetric: ${event}
            - type: AreaChart
              props:
                data: ${data.dashboard.trend}
                xKey: t
                yKeys: ${data.dashboard.metricKeys[state.trendMetric]}
                style:
                  height: 320
        - type: Row
          props:
            gutter:
              - 16
              - 16
            align: stretch
          children:
            - type: Col
              props:
                span: 24
                md: 12
              children:
                - type: Card
                  props:
                    title: $i18n{dashboard.usage.models:用量构成 · 模型}
                  children:
                    - type: Typography
                      props:
                        variant: muted
                        text: $i18n{dashboard.usage.modelsSubtitle:按请求量分布，识别主要模型流量来源}
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: ${data.dashboard.models[0].name}
                            style:
                              width: 110
                        - type: Progress
                          props:
                            value: ${data.dashboard.models[0].percent}
                            style:
                              flex: 1
                        - type: Text
                          props:
                            text: ${data.dashboard.models[0].percent}%
                            type: secondary
                            className: tabular-nums
                            style:
                              width: 40
                              textAlign: right
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: ${data.dashboard.models[1].name}
                            style:
                              width: 110
                        - type: Progress
                          props:
                            value: ${data.dashboard.models[1].percent}
                            style:
                              flex: 1
                        - type: Text
                          props:
                            text: ${data.dashboard.models[1].percent}%
                            type: secondary
                            className: tabular-nums
                            style:
                              width: 40
                              textAlign: right
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: ${data.dashboard.models[2].name}
                            style:
                              width: 110
                        - type: Progress
                          props:
                            value: ${data.dashboard.models[2].percent}
                            style:
                              flex: 1
                        - type: Text
                          props:
                            text: ${data.dashboard.models[2].percent}%
                            type: secondary
                            className: tabular-nums
                            style:
                              width: 40
                              textAlign: right
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: ${data.dashboard.models[3].name}
                            style:
                              width: 110
                        - type: Progress
                          props:
                            value: ${data.dashboard.models[3].percent}
                            style:
                              flex: 1
                        - type: Text
                          props:
                            text: ${data.dashboard.models[3].percent}%
                            type: secondary
                            className: tabular-nums
                            style:
                              width: 40
                              textAlign: right
                    - type: Button
                      props:
                        text: $i18n{dashboard.link.allModels:查看全部 → 模型用量}
                        variant: link
                        size: small
                        style:
                          alignSelf: flex-start
                        className: p-0
                      events:
                        onClick:
                          - action: message
                            params:
                              messageType: info
                              text: $i18n{dashboard.toast.models:跳转模型用量}
            - type: Col
              props:
                span: 24
                md: 12
              children:
                - type: Card
                  props:
                    title: $i18n{dashboard.usage.clients:用量构成 · 客户端}
                  children:
                    - type: Typography
                      props:
                        variant: muted
                        text: $i18n{dashboard.usage.clientsSubtitle:按请求量分布，识别主要客户端流量来源}
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: ${data.dashboard.clients[0].name}
                            style:
                              width: 110
                        - type: Progress
                          props:
                            value: ${data.dashboard.clients[0].percent}
                            style:
                              flex: 1
                        - type: Text
                          props:
                            text: ${data.dashboard.clients[0].percent}%
                            type: secondary
                            className: tabular-nums
                            style:
                              width: 40
                              textAlign: right
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: ${data.dashboard.clients[1].name}
                            style:
                              width: 110
                        - type: Progress
                          props:
                            value: ${data.dashboard.clients[1].percent}
                            style:
                              flex: 1
                        - type: Text
                          props:
                            text: ${data.dashboard.clients[1].percent}%
                            type: secondary
                            className: tabular-nums
                            style:
                              width: 40
                              textAlign: right
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: ${data.dashboard.clients[2].name}
                            style:
                              width: 110
                        - type: Progress
                          props:
                            value: ${data.dashboard.clients[2].percent}
                            style:
                              flex: 1
                        - type: Text
                          props:
                            text: ${data.dashboard.clients[2].percent}%
                            type: secondary
                            className: tabular-nums
                            style:
                              width: 40
                              textAlign: right
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                      children:
                        - type: Text
                          props:
                            text: ${data.dashboard.clients[3].name}
                            style:
                              width: 110
                        - type: Progress
                          props:
                            value: ${data.dashboard.clients[3].percent}
                            style:
                              flex: 1
                        - type: Text
                          props:
                            text: ${data.dashboard.clients[3].percent}%
                            type: secondary
                            className: tabular-nums
                            style:
                              width: 40
                              textAlign: right
                    - type: Button
                      props:
                        text: $i18n{dashboard.link.allClients:查看全部 → 客户端用量}
                        variant: link
                        size: small
                        style:
                          alignSelf: flex-start
                        className: p-0
                      events:
                        onClick:
                          - action: message
                            params:
                              messageType: info
                              text: $i18n{dashboard.toast.clients:跳转客户端用量}
