dsl: '1.0'
page:
  id: customer-list
  title: 客户列表
  permission: customer:view

state:
  keyword: ''
  # 级联演示：省 → 市选项映射（编辑抽屉 region 字段 onChange 时查表写入 cityOptions）
  # 省市名为业务数据（与 mock service 的 region/city 取值一致），不参与 i18n
  cityMap:
    浙江:
      - { label: 杭州, value: 杭州 }
      - { label: 宁波, value: 宁波 }
      - { label: 温州, value: 温州 }
    江苏:
      - { label: 南京, value: 南京 }
      - { label: 苏州, value: 苏州 }
      - { label: 无锡, value: 无锡 }
    广东:
      - { label: 广州, value: 广州 }
      - { label: 深圳, value: 深圳 }
      - { label: 珠海, value: 珠海 }
  cityOptions: []

dataSources:
  # service 数据源：customer.list（内存 mock，约 300ms 延迟），
  # params 引用 state.keyword —— 查询表单提交后 setState + reload 即按新关键词重新加载
  customers:
    type: service
    service: customer.list
    autoLoad: true
    params:
      keyword: ${state.keyword}

body:
  type: Page
  props:
    title: ${t('customers.title')}
  children:
    # 页面说明区
    - type: Alert
      props:
        variant: info
        message: ${t('customers.intro.message')}
        description: ${t('customers.intro.description')}
    # 查询区
    - type: Card
      props:
        title: ${t('customers.search.title')}
      children:
        - type: Form
          props:
            layout: inline
          events:
            onSubmit:
              - action: setState
                params:
                  keyword: ${event.keyword}
              - action: reload
                params:
                  dataSource: customers
          children:
            - type: Input
              props:
                name: keyword
                label: ${t('customers.search.keyword.label')}
                placeholder: ${t('customers.search.keyword.placeholder')}
            - type: Button
              props:
                text: ${t('customers.search.submit')}
                variant: primary
                submit: true
    # 数据区
    - type: Card
      props:
        title: ${t('customers.table.title')}
      children:
        - type: Table
          props:
            dataSource: ${data.customers}
            pagination:
              pageSize: 5
            columns:
              - title: ID
                dataIndex: id
              - title: ${t('customers.column.name')}
                dataIndex: name
              - title: ${t('customers.column.phone')}
                dataIndex: phone
              - title: ${t('customers.column.level')}
                dataIndex: level
              - title: ${t('customers.column.owner')}
                dataIndex: owner
              - title: ${t('customers.column.actions')}
                # cell 行模板：row / rowIndex 子作用域
                cell:
                  type: Flex
                  props:
                    gap: 8
                  children:
                    - type: Button
                      props:
                        text: ${t('customers.action.edit')}
                        variant: primary
                        size: small
                      events:
                        onClick:
                          # 初始化级联选项：按当前行 region 查 cityMap（抽屉内 city 的 options 绑 state.cityOptions）
                          - action: setState
                            params:
                              cityOptions: ${state.cityMap[row.region]}
                          # 命名动作：overlay.open 的 close payload 即 actions.editResult
                          - id: editResult
                            action: overlay.open
                            params:
                              overlay:
                                type: drawer
                                title: ${t('customers.drawer.title')}
                                width: 420
                                params:
                                  id: ${row.id}
                                  name: ${row.name}
                                  phone: ${row.phone}
                                  level: ${row.level}
                                  region: ${row.region}
                                  city: ${row.city}
                                content:
                                  type: Form
                                  props:
                                    # 页面查询表单占用 default 名，抽屉表单显式命名避免重复注册
                                    name: edit
                                  events:
                                    onSubmit:
                                      - id: updateResult
                                        action: service.call
                                        params:
                                          service: customer.update
                                          params:
                                            id: ${params.id}
                                            name: ${event.name}
                                            phone: ${event.phone}
                                            level: ${event.level}
                                            region: ${event.region}
                                            city: ${event.city}
                                      - action: if
                                        params:
                                          condition: ${actions.updateResult.id}
                                          then:
                                            - action: overlay.close
                                              params:
                                                payload:
                                                  success: true
                                          else:
                                            - action: message
                                              params:
                                                type: error
                                                text: ${t('customers.form.saveError')}
                                  children:
                                    - type: Alert
                                      props:
                                        variant: info
                                        message: "${t('customers.drawer.editing', { name: params.name, id: params.id })}"
                                    - type: Input
                                      props:
                                        name: name
                                        label: ${t('customers.form.name.label')}
                                        # 字段级初始值：回填当前行数据
                                        value: ${params.name}
                                        placeholder: ${t('customers.form.name.placeholder')}
                                        rules:
                                          - required: true
                                            message: ${t('customers.form.name.required')}
                                    - type: Input
                                      props:
                                        name: phone
                                        label: ${t('customers.form.phone.label')}
                                        value: ${params.phone}
                                        placeholder: ${t('customers.form.phone.placeholder')}
                                    - type: Select
                                      props:
                                        name: level
                                        label: ${t('customers.form.level.label')}
                                        value: ${params.level}
                                        options:
                                          - label: ${t('customers.form.level.a')}
                                            value: A
                                          - label: ${t('customers.form.level.b')}
                                            value: B
                                          - label: ${t('customers.form.level.c')}
                                            value: C
                                    # 级联演示：region 变化 → form.setValues 清空 city + setState 更新 city 选项
                                    - type: Select
                                      props:
                                        name: region
                                        label: ${t('customers.form.region.label')}
                                        value: ${params.region}
                                        options:
                                          - { label: 浙江, value: 浙江 }
                                          - { label: 江苏, value: 江苏 }
                                          - { label: 广东, value: 广东 }
                                      events:
                                        onChange:
                                          - action: form.setValues
                                            params:
                                              form: edit
                                              values:
                                                city: ''
                                          - action: setState
                                            params:
                                              cityOptions: ${state.cityMap[event]}
                                    - type: Select
                                      props:
                                        name: city
                                        label: ${t('customers.form.city.label')}
                                        value: ${params.city}
                                        options: ${state.cityOptions}
                                    - type: Button
                                      props:
                                        text: ${t('customers.form.save')}
                                        variant: primary
                                        submit: true
                          # 抽屉以成功语义关闭后：reload 列表 + 成功 message
                          - action: if
                            params:
                              condition: ${actions.editResult.success}
                              then:
                                - action: reload
                                  params:
                                    dataSource: customers
                                - action: message
                                  params:
                                    type: success
                                    text: ${t('customers.updated')}
                    # 权限演示：permissions 不含 customer:delete，按钮以禁用态呈现
                    - type: Button
                      props:
                        text: ${t('customers.action.delete')}
                        danger: true
                        size: small
                      permission:
                        code: customer:delete
                        denied: disabled
