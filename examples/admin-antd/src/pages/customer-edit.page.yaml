dsl: '1.0'
page:
  id: customer-edit
  title: 编辑客户
  permission: customer:edit

dataSources:
  # route.params 驱动：/customers/:id/edit 的路径参数作为 detail 数据源入参
  detail:
    type: service
    service: customer.detail
    autoLoad: true
    params:
      id: ${route.params.id}

body:
  type: Page
  props:
    title: ${t('customerEdit.title')}
  children:
    # 返回操作（navigate 动作）
    - type: Button
      props:
        text: ${t('customerEdit.back')}
      events:
        onClick:
          action: navigate
          params:
            to: /customers
    - type: Card
      props:
        title: ${t('customerEdit.card.title')}
      children:
        - type: Alert
          props:
            variant: info
            message: "${t('customerEdit.editing', { name: data.detail.name, id: route.params.id })}"
        - type: Form
          events:
            onSubmit:
              - id: saveResult
                action: service.call
                params:
                  service: customer.update
                  params:
                    id: ${route.params.id}
                    name: ${event.name}
                    phone: ${event.phone}
                    level: ${event.level}
              - action: if
                params:
                  condition: ${actions.saveResult.id}
                  then:
                    - action: message
                      params:
                        type: success
                        text: ${t('customerEdit.saved')}
                    - action: navigate
                      params:
                        to: /customers
                  else:
                    - action: message
                      params:
                        type: error
                        text: ${t('customers.form.saveError')}
          children:
            - type: Input
              props:
                name: name
                label: ${t('customers.form.name.label')}
                placeholder: ${t('customerEdit.keepPlaceholder')}
                rules:
                  - required: true
                    message: ${t('customers.form.name.required')}
            - type: Input
              props:
                name: phone
                label: ${t('customers.form.phone.label')}
                placeholder: ${t('customerEdit.keepPlaceholder')}
            - type: Select
              props:
                name: level
                label: ${t('customers.form.level.label')}
                options:
                  - label: ${t('customers.form.level.a')}
                    value: A
                  - label: ${t('customers.form.level.b')}
                    value: B
                  - label: ${t('customers.form.level.c')}
                    value: C
            - type: Button
              props:
                text: ${t('customers.form.save')}
                variant: primary
                submit: true
