dsl: '1.0'
page:
  id: dashboard
  title: 工作台

dataSources:
  stats:
    type: static
    autoLoad: true
    value:
      customerTotal: 8
      activeToday: 5
      pendingTickets: 3
      conversionRate: 62.5

body:
  type: Page
  props:
    title: ${t('menu.dashboard')}
  children:
    # 欢迎横幅：内容区第一个 Alert，由 src/theme.css 结构选择器样式化为品牌渐变
    - type: Alert
      props:
        variant: info
        message: "${t('dashboard.welcome.message', { name: user.name })}"
        description: "${t('dashboard.welcome.description', { app: app.name, count: data.stats.pendingTickets })}"
    # 指标行：4 张指标卡，src/theme.css 经 .pcr-card:has(.pcr-statistic) 加 accent 强调条
    - type: Grid
      props:
        columns: 4
        gap: 16
      children:
        - type: Card
          children:
            - type: Statistic
              props:
                title: ${t('dashboard.stats.customerTotal')}
                value: ${data.stats.customerTotal}
                suffix: ${t('dashboard.stats.unit.customer')}
        - type: Card
          children:
            - type: Statistic
              props:
                title: ${t('dashboard.stats.activeToday')}
                value: ${data.stats.activeToday}
                suffix: ${t('dashboard.stats.unit.customer')}
        - type: Card
          children:
            - type: Statistic
              props:
                title: ${t('dashboard.stats.pendingTickets')}
                value: ${data.stats.pendingTickets}
                suffix: ${t('dashboard.stats.unit.ticket')}
        - type: Card
          children:
            - type: Statistic
              props:
                title: ${t('dashboard.stats.conversionRate')}
                value: ${data.stats.conversionRate}
                precision: 1
                suffix: '%'
    # 双栏内容区：公告/待办 Tabs + 快捷操作（navigate 动作演示）
    - type: Grid
      props:
        columns: 2
        gap: 16
      children:
        - type: Card
          props:
            title: ${t('dashboard.notice.title')}
          children:
            - type: Tabs
              props:
                items:
                  - key: notice
                    label: ${t('dashboard.notice.tab')}
                    children:
                      - type: Alert
                        props:
                          variant: info
                          message: ${t('dashboard.notice.message')}
                  - key: todo
                    label: ${t('dashboard.todo.tab')}
                    children:
                      - type: Alert
                        props:
                          variant: warning
                          message: "${t('dashboard.todo.message', { count: data.stats.pendingTickets })}"
        - type: Card
          props:
            title: ${t('dashboard.quickActions.title')}
          children:
            - type: Flex
              props:
                direction: vertical
                gap: 12
              children:
                - type: Alert
                  props:
                    variant: info
                    message: ${t('dashboard.quickActions.message')}
                - type: Flex
                  props:
                    gap: 8
                  children:
                    - type: Button
                      props:
                        text: ${t('dashboard.quickActions.customers')}
                        variant: primary
                      events:
                        onClick:
                          action: navigate
                          params:
                            to: /customers
                    - type: Button
                      props:
                        text: ${t('dashboard.quickActions.customerEdit')}
                      events:
                        onClick:
                          action: navigate
                          params:
                            to: /customers/1/edit
                - type: Alert
                  props:
                    variant: warning
                    message: ${t('dashboard.logout.message')}
                - type: Button
                  props:
                    text: ${t('dashboard.logout')}
                    danger: true
                  events:
                    onClick:
                      - action: service.call
                        params:
                          service: auth.logout
                      - action: app.reload
                        params:
                          to: /login
