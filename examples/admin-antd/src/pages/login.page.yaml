dsl: '1.0'
page:
  id: login
  title: 登录

state:
  # 提交中标记：驱动登录按钮 loading（onSubmit 动作串行执行，置位/复位夹着 service.call）
  submitting: false

body:
  # 登录布局（login layout）已提供品牌区与居中卡片，body 只需表单内容
  type: Form
  events:
    onSubmit:
      - action: setState
        params:
          submitting: true
      # 命名动作：成功时 actions.loginResult 为 service 返回的 { token, user }；
      # 失败时为 { ok: false, error }
      - id: loginResult
        action: service.call
        params:
          service: auth.login
          params:
            username: ${event.username}
            password: ${event.password}
      - action: setState
        params:
          submitting: false
      - action: if
        params:
          condition: ${actions.loginResult.token}
          then:
            # 登录成功需整页重载：让 bootstrap 重新按已登录会话
            # 返回 admin 布局与业务菜单（示例扩展动作，见 main.tsx）
            - action: app.reload
              params:
                to: /
          else:
            - action: message
              params:
                type: error
                text: ${t('login.error')}
  children:
    - type: Alert
      props:
        variant: info
        message: ${t('login.hint.message')}
        description: ${t('login.hint.description')}
    - type: Input
      props:
        name: username
        label: ${t('login.username.label')}
        placeholder: ${t('login.username.placeholder')}
        rules:
          - required: true
            message: ${t('login.username.required')}
    - type: Input
      props:
        name: password
        label: ${t('login.password.label')}
        # add-input-type-prop：password 掩码输入
        type: password
        placeholder: ${t('login.password.placeholder')}
        rules:
          - required: true
            message: ${t('login.password.required')}
    - type: Button
      props:
        text: ${t('login.submit')}
        variant: primary
        submit: true
        loading: ${state.submitting}
