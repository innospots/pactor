dsl: '1.0'
page:
  id: graph
  title: 关系图示例

state:
  # 选中节点详情：onNodeClick 事件写回（真实应用里图数据由 dataSource 下发）
  selectedNodeId: ''
  selectedNodeLabel: ''
  selectedNodeGroup: ''

dataSources:
  orderFlow:
    type: static
    autoLoad: true
    value:
      nodes:
        - { id: order, data: { label: 提交订单, group: 交易 } }
        - { id: pay, data: { label: 在线支付, group: 交易 } }
        - { id: risk, data: { label: 风控审核, group: 风控 } }
        - { id: manual, data: { label: 人工复核, group: 风控 } }
        - { id: warehouse, data: { label: 仓库拣货, group: 履约 } }
        - { id: logistics, data: { label: 物流配送, group: 履约 } }
        - { id: receipt, data: { label: 买家签收, group: 履约 } }
      edges:
        - { source: order, target: pay }
        - { source: pay, target: risk }
        - { source: risk, target: warehouse }
        - { source: risk, target: manual }
        - { source: manual, target: warehouse }
        - { source: warehouse, target: logistics }
        - { source: logistics, target: receipt }

body:
  type: Page
  props:
    title: 关系图示例
  children:
    - type: Alert
      props:
        variant: info
        message: G6 关系图（Graph 组件）
        description: dagre 布局的订单履约流程。滚轮缩放、拖拽平移、拖动节点，点按节点查看详情；图数据由 dataSource 下发，交互经事件写回 state。
    - type: Graph
      props:
        data: ${data.orderFlow}
        layout: dagre
        layoutOptions: { rankdir: LR, nodesep: 24, ranksep: 64 }
        # 节点标签缺省取 datum.data.label（组件内置），这里只调整位置与颜色
        nodeStyle:
          size: 32
          labelPlacement: bottom
          labelFill: '#333'
        # 分组配色：color 必填（内置色板名或颜色数组），否则 G6 分配不到颜色节点不可见
        palette: { type: group, field: group, color: ['#5B8FF9', '#F6BD16', '#5AD8A6'] }
        edgeStyle:
          endArrow: true
          stroke: '#b7bfc9'
        plugins: { tooltip: true, minimap: true }
        height: 420
      events:
        onNodeClick:
          - action: setState
            params:
              selectedNodeId: ${event.node.id}
              selectedNodeLabel: ${event.node.data.label}
              selectedNodeGroup: ${event.node.data.group}
    - type: Card
      props:
        title: 节点详情
      when: ${state.selectedNodeId != ''}
      children:
        - type: Descriptions
          props:
            items:
              - label: 节点 ID
                value: ${state.selectedNodeId}
              - label: 名称
                value: ${state.selectedNodeLabel}
              - label: 分组
                value: ${state.selectedNodeGroup}
    - type: Alert
      props:
        variant: info
        message: 点按上方任一节点查看详情
      when: ${state.selectedNodeId == ''}
