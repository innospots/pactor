dsl: '1.0'
page:
  id: customer-edit
  title: 编辑客户
  permission: customer:edit

dataSources:
  # route.params 驱动：/customers/:id/edit 的路径参数作为 detail 数据源入参
  detail:
    type: service
    service: customer.detail
    autoLoad: true
    params:
      id: ${route.params.id}

body:
  type: Page
  props:
    title: 编辑客户
  children:
    # 返回操作（navigate 动作）
    - type: Button
      props:
        text: ← 返回列表
      events:
        onClick:
          action: navigate
          params:
            to: /customers
    - type: Card
      props:
        title: 客户信息
      children:
        - type: Alert
          props:
            variant: info
            message: 正在编辑：${data.detail.name}（路由参数 id = ${route.params.id}）
        - type: Form
          events:
            onSubmit:
              - id: saveResult
                action: service.call
                params:
                  service: customer.update
                  params:
                    id: ${route.params.id}
                    name: ${event.name}
                    phone: ${event.phone}
                    level: ${event.level}
              - action: if
                params:
                  condition: ${actions.saveResult.id}
                  then:
                    - action: message
                      params:
                        messageType: success
                        text: 保存成功
                    - action: navigate
                      params:
                        to: /customers
                  else:
                    - action: message
                      params:
                        messageType: error
                        text: 保存失败，请重试
          children:
            - type: Input
              props:
                name: name
                label: 客户名称
                placeholder: 留空则保持不变
                rules:
                  - required: true
                    message: 请输入客户名称
            - type: Input
              props:
                name: phone
                label: 联系电话
                placeholder: 留空则保持不变
            - type: Select
              props:
                name: level
                label: 等级
                options:
                  - label: A 级
                    value: A
                  - label: B 级
                    value: B
                  - label: C 级
                    value: C
            - type: Button
              props:
                text: 保存
                variant: primary
                submit: true
