dsl: '1.0'
page:
  id: layout-demo
  title: 布局组件演示
  name: layoutDemo
  description: 'Layout / Header / Sider / Content / Footer / Menu 页面级自由组合（spec: layout-components）'
  permission: customer:view

meta:
  version: '1.0'
  author: platform-team

state:
  # Menu 受控选中态（selectedKey + onSelect 闭环）
  currentTool: overview
  # Sider 受控折叠态（collapsed + onCollapse 闭环）
  siderCollapsed: false

dataSources:
  # 菜单数据经数据源注入（Menu 不读外壳层 MenuRegistry）
  toolMenus:
    type: static
    value:
      - { key: overview, label: 总览 }
      - { key: report, label: 报表 }
      - key: manage
        label: 管理
        children:
          - { key: users, label: 用户 }
          - { key: roles, label: 角色 }

components:
  toolbar:
    type: Header
    children:
      - type: Alert
        props:
          message: 页内 Header（内容完全由 DSL 声明）
          variant: info
  toolContent:
    type: Content
    children:
      - type: Statistic
        props:
          title: 当前工具
          value: ${state.currentTool}
      - type: Alert
        props:
          message: 左侧菜单切换经 onSelect → setState 闭环驱动
          variant: success

body:
  type: Page
  props:
    title: 布局组件演示
  children:
    - type: Alert
      props:
        message: Layout / Header / Sider / Content / Footer / Menu 自由组合：Sider 折叠与 Menu 选中均为受控闭环（绑 state + 事件回写）。
        variant: info
    # Layout 含 Sider 子节点 → 自动横向；Footer 在纵向外层
    - type: Layout
      props:
        style: { height: 420, border: 1px solid var(--border), borderRadius: 8 }
      children:
        - type: Sider
          props:
            collapsible: true
            collapsed: ${state.siderCollapsed}
          events:
            onCollapse:
              - action: setState
                params:
                  siderCollapsed: ${event}
          children:
            - type: Menu
              props:
                items: ${data.toolMenus}
                selectedKey: ${state.currentTool}
              events:
                onSelect:
                  - action: setState
                    params:
                      currentTool: ${event}
        - type: Layout
          children:
            - component: toolbar
            - component: toolContent
            - type: Footer
              children:
                - type: Alert
                  props:
                    message: 页内 Footer
                    variant: info
