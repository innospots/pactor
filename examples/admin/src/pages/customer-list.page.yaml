dsl: '1.0'
page:
  id: customer-list
  title: 客户列表
  permission: customer:view

state:
  keyword: ''
  # 级联演示：省 → 市选项映射（编辑抽屉 region 字段 onChange 时查表写入 cityOptions）
  cityMap:
    浙江:
      - { label: 杭州, value: 杭州 }
      - { label: 宁波, value: 宁波 }
      - { label: 温州, value: 温州 }
    江苏:
      - { label: 南京, value: 南京 }
      - { label: 苏州, value: 苏州 }
      - { label: 无锡, value: 无锡 }
    广东:
      - { label: 广州, value: 广州 }
      - { label: 深圳, value: 深圳 }
      - { label: 珠海, value: 珠海 }
  cityOptions: []

dataSources:
  # service 数据源：customer.list（内存 mock，约 300ms 延迟），
  # params 引用 state.keyword —— 查询表单提交后 setState + reload 即按新关键词重新加载
  customers:
    type: service
    service: customer.list
    autoLoad: true
    params:
      keyword: ${state.keyword}

body:
  type: Page
  props:
    title: 客户列表
  children:
    # 页面说明区
    - type: Alert
      props:
        variant: info
        message: 客户列表演示查询、抽屉编辑与权限禁用
        description: 查询走 setState + reload 链路；行内"删除"因 permissions 不含 customer:delete 而禁用。
    # 查询区
    - type: Card
      props:
        title: 客户查询
      children:
        - type: Form
          props:
            layout: inline
          events:
            onSubmit:
              - action: setState
                params:
                  keyword: ${event.keyword}
              - action: reload
                params:
                  dataSource: customers
          children:
            - type: Input
              props:
                name: keyword
                label: 关键词
                placeholder: 客户名 / 负责人
            - type: Button
              props:
                text: 查询
                variant: primary
                submit: true
    # 数据区
    - type: Card
      props:
        title: 客户数据（service 数据源）
      children:
        - type: Table
          props:
            dataSource: ${data.customers}
            pagination:
              pageSize: 5
            columns:
              - title: ID
                dataIndex: id
              - title: 客户名称
                dataIndex: name
              - title: 联系电话
                dataIndex: phone
              - title: 等级
                dataIndex: level
              - title: 负责人
                dataIndex: owner
              - title: 操作
                # cell 行模板：row / rowIndex 子作用域
                cell:
                  type: Flex
                  props:
                    gap: 8
                  children:
                    - type: Button
                      props:
                        text: 编辑
                        variant: primary
                        size: small
                      events:
                        onClick:
                          # 初始化级联选项：按当前行 region 查 cityMap（抽屉内 city 的 options 绑 state.cityOptions）
                          - action: setState
                            params:
                              cityOptions: ${state.cityMap[row.region]}
                          # 命名动作：overlay.open 的 close payload 即 actions.editResult
                          - id: editResult
                            action: overlay.open
                            params:
                              overlay:
                                type: drawer
                                title: 编辑客户
                                width: 420
                                params:
                                  id: ${row.id}
                                  name: ${row.name}
                                  phone: ${row.phone}
                                  level: ${row.level}
                                  region: ${row.region}
                                  city: ${row.city}
                                content:
                                  type: Form
                                  props:
                                    # 页面查询表单占用 default 名，抽屉表单显式命名避免重复注册
                                    name: edit
                                  events:
                                    onSubmit:
                                      - id: updateResult
                                        action: service.call
                                        params:
                                          service: customer.update
                                          params:
                                            id: ${params.id}
                                            name: ${event.name}
                                            phone: ${event.phone}
                                            level: ${event.level}
                                            region: ${event.region}
                                            city: ${event.city}
                                      - action: if
                                        params:
                                          condition: ${actions.updateResult.id}
                                          then:
                                            - action: overlay.close
                                              params:
                                                payload:
                                                  success: true
                                          else:
                                            - action: message
                                              params:
                                                type: error
                                                text: 保存失败，请重试
                                  children:
                                    - type: Alert
                                      props:
                                        variant: info
                                        message: 正在编辑：${params.name}（ID ${params.id}）
                                    - type: Input
                                      props:
                                        name: name
                                        label: 客户名称
                                        # 字段级初始值：回填当前行数据
                                        value: ${params.name}
                                        placeholder: 请输入客户名称
                                        rules:
                                          - required: true
                                            message: 请输入客户名称
                                    - type: Input
                                      props:
                                        name: phone
                                        label: 联系电话
                                        value: ${params.phone}
                                        placeholder: 请输入联系电话
                                    - type: Select
                                      props:
                                        name: level
                                        label: 等级
                                        value: ${params.level}
                                        options:
                                          - label: A 级
                                            value: A
                                          - label: B 级
                                            value: B
                                          - label: C 级
                                            value: C
                                    # 级联演示：region 变化 → form.setValues 清空 city + setState 更新 city 选项
                                    - type: Select
                                      props:
                                        name: region
                                        label: 省份
                                        value: ${params.region}
                                        options:
                                          - { label: 浙江, value: 浙江 }
                                          - { label: 江苏, value: 江苏 }
                                          - { label: 广东, value: 广东 }
                                      events:
                                        onChange:
                                          - action: form.setValues
                                            params:
                                              form: edit
                                              values:
                                                city: ''
                                          - action: setState
                                            params:
                                              cityOptions: ${state.cityMap[event]}
                                    - type: Select
                                      props:
                                        name: city
                                        label: 城市（随省份联动）
                                        value: ${params.city}
                                        options: ${state.cityOptions}
                                    - type: Button
                                      props:
                                        text: 保存
                                        variant: primary
                                        submit: true
                          # 抽屉以成功语义关闭后：reload 列表 + 成功 message
                          - action: if
                            params:
                              condition: ${actions.editResult.success}
                              then:
                                - action: reload
                                  params:
                                    dataSource: customers
                                - action: message
                                  params:
                                    type: success
                                    text: 客户已更新
                    # 权限演示：permissions 不含 customer:delete，按钮以禁用态呈现
                    - type: Button
                      props:
                        text: 删除
                        danger: true
                        size: small
                      permission:
                        code: customer:delete
                        denied: disabled
