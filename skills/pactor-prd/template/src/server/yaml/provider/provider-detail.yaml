dsl: "1.0"
page:
  id: provider-detail
  title: Provider 详情
  name: providerDetail
  description: 模型资产 / Provider 详情：基本信息、连接与凭证、关联模型、引用关系
state:
  capExtExpanded: false
dataSources:
  detail:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/data/providers/${route.params.code}
  upstream:
    type: http
    request:
      method: GET
      url: /api/data/providers/${route.params.code}/pull-models
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 模型资产
          - label: Provider
            href: /providers
          - label: ${route.params.code}
    - type: Flex
      when: ${data.detail != null}
      props:
        direction: vertical
        gap: middle
        align: stretch
      children:
        - type: Card
          children:
            - type: Flex
              props:
                justify: space-between
                align: middle
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Icon
                      props:
                        name: ${data.detail.icon}
                        size: lg
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 0
                      children:
                        - type: Flex
                          props:
                            align: center
                            gap: middle
                          children:
                            - type: Typography
                              props:
                                variant: h3
                                text: ${data.detail.name}
                            - type: StatusBadge
                              props:
                                status: ${data.detail.status}
                        - type: Text
                          props:
                            text: "Provider Code: ${data.detail.code}"
                            type: secondary
                - type: Flex
                  props:
                    align: center
                    gap: small
                  children:
                    - type: Button
                      props:
                        text: 编辑
                        icon: edit
                        variant: primary
                        size: small
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /providers/${route.params.code}/edit
                    - type: Button
                      props:
                        text: "${data.detail.status == 'enabled' ? '停用' : '启用'}"
                        icon: "${data.detail.status == 'enabled' ? 'x-circle' : 'check-circle'}"
                        size: small
                      events:
                        onClick:
                          - id: statusCfm
                            action: overlay.open
                            params:
                              overlay:
                                type: modal
                                title: "${data.detail.status == 'enabled' ? '确认停用 Provider' : '确认启用 Provider'}"
                                width: 480
                                content:
                                  type: Flex
                                  props:
                                    direction: vertical
                                    gap: middle
                                  children:
                                    - type: Text
                                      props:
                                        size: small
                                        text: "${data.detail.status == 'enabled' ? '停用后，该 Provider 将无法被新建 Model / Target
                                          引用。' : '启用后，该 Provider 可被 Model /
                                          Target 引用。'}"
                                    - type: Flex
                                      props:
                                        direction: vertical
                                        gap: small
                                      children:
                                        - type: Text
                                          props:
                                            text: 影响范围：
                                            strong: true
                                        - type: Text
                                          props:
                                            text: · Model：${data.detail.modelCount} 个（${data.detail.enabledModelCount} 个启用）
                                            type: secondary
                                        - type: Text
                                          props:
                                            text: · Route Target 引用：${data.detail.routes.total} 个
                                            type: secondary
                                    - type: Text
                                      when: ${data.detail.status == 'enabled'}
                                      props:
                                        size: small
                                        text: ⚠ 存在 ONLINE Target 引用时，建议先完成切换再停用。
                                        type: warning
                                    - type: Flex
                                      props:
                                        justify: end
                                        gap: middle
                                      children:
                                        - type: Button
                                          props:
                                            text: 取消
                                          events:
                                            onClick:
                                              - action: overlay.close
                                        - type: Button
                                          props:
                                            text: "${data.detail.status == 'enabled' ? '确认停用' : '确认启用'}"
                                            variant: primary
                                            danger: ${data.detail.status == 'enabled'}
                                          events:
                                            onClick:
                                              - action: overlay.close
                                                params:
                                                  payload:
                                                    ok: true
                          - action: if
                            params:
                              condition: ${actions.statusCfm.ok}
                              then:
                                - action: message
                                  params:
                                    messageType: success
                                    text: 状态已切换（演示）
                    - type: Button
                      props:
                        text: 查看模型
                        icon: eye
                        size: small
                      events:
                        onClick:
                          - action: message
                            params:
                              messageType: info
                              text: 跳转 Model 列表（演示：目标页建设中）
                    - type: DropdownMenu
                      props:
                        items:
                          - label: 导出
                            value: export
                            icon: download
                          - label: 复制 Code
                            value: copy
                            icon: copy
                      events:
                        onSelect:
                          - action: message
                            params:
                              messageType: info
                              text: 操作：${event}（演示）
                      children:
                        - type: Button
                          props:
                            text: ···
                            variant: text
        - type: Grid
          props:
            columns: 4
            gap: 16
          children:
            - type: Card
              children:
                - type: Statistic
                  props:
                    title: 密钥状态
                    value: "${data.detail.keyStatus == 'configured' ? '已配置' : data.detail.keyStatus
                      == 'pending' ? '待填密钥' : '无密钥'}"
            - type: Card
              children:
                - type: Statistic
                  props:
                    title: 模型数量
                    value: ${data.detail.modelCount}
            - type: Card
              children:
                - type: Statistic
                  props:
                    title: 默认协议
                    value: ${data.detail.protocol}
            - type: Card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: baseline
                  children:
                    - type: Text
                      props:
                        text: 最后更新
                        type: secondary
                        className: text-sm
                    - type: Typography
                      props:
                        variant: muted
                        text: 操作人：${data.detail.operator}
                        style:
                          whiteSpace: nowrap
                          flexShrink: 0
                - type: Statistic
                  props:
                    value: ${data.detail.updatedAt}
                    className: mt-[6px]
        - type: Card
          children:
            - type: Tabs
              props:
                variant: line
                items:
                  - key: basic
                    label: 基本信息
                    className: p-2
                    children:
                      - type: Table
                        props:
                          rowKey: label
                          pagination: false
                          dataSource:
                            - label: Provider Code
                              value: ${data.detail.code}（创建后不可修改）
                            - label: Provider Name
                              value: ${data.detail.name}
                            - label: Provider Type
                              value: ${data.detail.providerType}
                            - label: Default Protocol
                              value: ${data.detail.protocol}
                            - label: Status
                              value: "${data.detail.status == 'enabled' ? '● 启用' : '● 停用'}"
                            - label: Description
                              value: ${data.detail.description}
                            - label: Capability Extension
                              value: ${data.detail.capabilityExtension}
                              pre: true
                            - label: Created At
                              value: ${data.detail.createdAt}
                            - label: Updated At
                              value: ${data.detail.updatedAt}
                            - label: Operator
                              value: ${data.detail.operator}
                          columns:
                            - title: 字段
                              dataIndex: label
                              width: 220
                            - title: 值
                              dataIndex: value
                              cell:
                                type: Flex
                                props:
                                  direction: vertical
                                  gap: small
                                  align: start
                                children:
                                  - type: Text
                                    props:
                                      text: ${row.value}
                                      className: "${row.pre ? (state.capExtExpanded ? 'font-mono text-sm
                                        whitespace-pre-wrap break-all block' :
                                        'font-mono text-sm block line-clamp-1
                                        whitespace-normal break-all') : ''}"
                                  - type: Button
                                    props:
                                      text: "${state.capExtExpanded ? '收起' : '展开'}"
                                      variant: link
                                      size: small
                                      className: h-auto p-0
                                    when: ${row.pre}
                                    events:
                                      onClick:
                                        - action: setState
                                          params:
                                            capExtExpanded: ${!state.capExtExpanded}
                  - key: connection
                    label: 连接与凭证
                    className: p-2
                    children:
                      - type: Flex
                        props:
                          direction: vertical
                          gap: small
                          className: mt-2
                        children:
                          - type: Alert
                            props:
                              showIcon: true
                              variant: info
                              message: Runtime 调用该 Provider 时使用的上游地址与 API Key
                              className: mb-2
                          - type: Flex
                            props:
                              align: baseline
                              gap: middle
                            children:
                              - type: Text
                                props:
                                  text: Base URL
                                  type: secondary
                                  style:
                                    width: 180
                                    flexShrink: 0
                              - type: Text
                                props:
                                  text: ${data.detail.baseUrl}
                          - type: Flex
                            props:
                              align: baseline
                              gap: middle
                            children:
                              - type: Text
                                props:
                                  text: Region
                                  type: secondary
                                  style:
                                    width: 180
                                    flexShrink: 0
                              - type: Text
                                props:
                                  text: ${data.detail.region || '—'}
                          - type: Flex
                            props:
                              align: baseline
                              gap: middle
                            children:
                              - type: Text
                                props:
                                  text: API Key
                                  type: secondary
                                  style:
                                    width: 180
                                    flexShrink: 0
                              - type: Text
                                props:
                                  text: "${data.detail.keyStatus == 'configured' ? data.detail.maskedKey : '未配置'}"
                          - type: Flex
                            props:
                              align: baseline
                              gap: middle
                            children:
                              - type: Text
                                props:
                                  text: Timeout
                                  type: secondary
                                  style:
                                    width: 180
                                    flexShrink: 0
                              - type: Text
                                props:
                                  text: ${data.detail.timeout} ms
                          - type: Flex
                            props:
                              align: baseline
                              gap: middle
                            children:
                              - type: Text
                                props:
                                  text: Proxy
                                  type: secondary
                                  style:
                                    width: 180
                                    flexShrink: 0
                              - type: Text
                                props:
                                  text: ${data.detail.proxy || '—'}
                          - type: Flex
                            props:
                              align: baseline
                              gap: middle
                            children:
                              - type: Text
                                props:
                                  text: Last Test
                                  type: secondary
                                  style:
                                    width: 180
                                    flexShrink: 0
                              - type: Text
                                props:
                                  text: "${data.detail.lastTest != null ? data.detail.lastTest.time + '  ' +
                                    (data.detail.lastTest.ok ? '● 成功' : '● 失败')
                                    + '  (' + data.detail.lastTest.detail + ')'
                                    : '—'}"
                          - type: Flex
                            props:
                              justify: end
                              gap: middle
                              className: mt-2
                            children:
                              - type: Button
                                props:
                                  text: 测试连接
                                  icon: zap
                                events:
                                  onClick:
                                    - action: message
                                      params:
                                        messageType: success
                                        text: 连接测试成功：HTTP 200, 128ms（演示）
                              - type: Button
                                props:
                                  text: 编辑连接配置
                                  icon: edit
                                  variant: primary
                                events:
                                  onClick:
                                    - action: navigate
                                      params:
                                        to: /providers/${route.params.code}/edit
                          - type: Alert
                            props:
                              showIcon: true
                              variant: warning
                              message: API Key 保存后不可查看明文；更换时需重新输入。
                              className: mt-2
                  - key: models
                    label: 关联模型
                    className: p-2
                    children:
                      - type: Flex
                        props:
                          justify: space-between
                          align: center
                          className: my-2
                        children:
                          - type: Text
                            props:
                              text: 该 Provider 下的模型
                              strong: true
                          - type: Flex
                            props:
                              align: center
                              gap: small
                            children:
                              - type: Button
                                props:
                                  text: 拉取
                                  icon: download
                                  size: small
                                events:
                                  onClick:
                                    - action: reload
                                      params:
                                        dataSource: upstream
                                    - id: pullResult
                                      action: overlay.open
                                      params:
                                        overlay:
                                          type: modal
                                          title: 拉取模型
                                          width: 720
                                          content:
                                            type: Flex
                                            props:
                                              direction: vertical
                                              gap: middle
                                            children:
                                              - type: Text
                                                props:
                                                  size: small
                                                  type: secondary
                                                  text: 将从 ${data.detail.name} 上游拉取模型列表（Base URL + API Key）
                                                  className: text-sm
                                              - type: Table
                                                props:
                                                  dataSource: ${data.upstream}
                                                  rowKey: id
                                                  pagination: false
                                                  columns:
                                                    - title: 状态
                                                      width: 64
                                                      cell:
                                                        type: Checkbox
                                                        props:
                                                          value: ${row.local == '新增'}
                                                          disabled: ${row.local != '新增'}
                                                    - title: Provider Model ID
                                                      dataIndex: id
                                                    - title: 建议 Model Name
                                                      dataIndex: name
                                                    - title: 本地状态
                                                      dataIndex: local
                                              - type: Text
                                                props:
                                                  text: 已选 2 项（新增） · 0 项已存在将跳过
                                                  type: secondary
                                                  className: text-sm
                                              - type: Flex
                                                props:
                                                  justify: end
                                                  gap: middle
                                                children:
                                                  - type: Button
                                                    props:
                                                      text: 取消
                                                    events:
                                                      onClick:
                                                        - action: overlay.close
                                                  - type: Button
                                                    props:
                                                      text: 确认拉取
                                                      variant: primary
                                                    events:
                                                      onClick:
                                                        - action: overlay.close
                                                          params:
                                                            payload:
                                                              ok: true
                                    - action: if
                                      params:
                                        condition: ${actions.pullResult.ok}
                                        then:
                                          - action: message
                                            params:
                                              messageType: success
                                              text: 已为选中项批量创建 Model（演示）
                                          - action: reload
                                            params:
                                              dataSource: detail
                              - type: Button
                                props:
                                  text: 导入
                                  icon: upload
                                  size: small
                                events:
                                  onClick:
                                    - id: importResult
                                      action: overlay.open
                                      params:
                                        overlay:
                                          type: modal
                                          title: 导入模型
                                          width: 560
                                          content:
                                            type: Form
                                            props:
                                              name: importModel
                                            events:
                                              onSubmit:
                                                - action: overlay.close
                                                  params:
                                                    payload:
                                                      ok: true
                                            children:
                                              - type: Field
                                                props:
                                                  label: Model Name
                                                  required: true
                                                children:
                                                  - type: Input
                                                    props:
                                                      name: modelName
                                                      placeholder: 展示名称，平台内识别用
                                                      rules:
                                                        - required: true
                                                          message: 请输入 Model Name
                                              - type: Field
                                                props:
                                                  label: Provider Model ID
                                                  required: true
                                                children:
                                                  - type: Input
                                                    props:
                                                      name: providerModelId
                                                      placeholder: 上游 API 实际调用的模型 ID
                                                      rules:
                                                        - required: true
                                                          message: 请输入 Provider Model ID
                                              - type: Field
                                                props:
                                                  label: Model Type
                                                children:
                                                  - type: Select
                                                    props:
                                                      name: modelType
                                                      value: LLM
                                                      options:
                                                        - label: LLM
                                                          value: LLM
                                                        - label: Embedding
                                                          value: Embedding
                                                        - label: Image
                                                          value: Image
                                                        - label: Audio
                                                          value: Audio
                                                      controlClassName: w-full [&_[data-slot=select-trigger]]:w-full
                                              - type: Field
                                                props:
                                                  label: Model Code
                                                children:
                                                  - type: Input
                                                    props:
                                                      name: modelCode
                                                      placeholder: 留空时根据 Name 自动生成
                                              - type: Flex
                                                props:
                                                  justify: end
                                                  gap: middle
                                                children:
                                                  - type: Button
                                                    props:
                                                      text: 取消
                                                    events:
                                                      onClick:
                                                        - action: overlay.close
                                                  - type: Button
                                                    props:
                                                      text: 确认导入
                                                      variant: primary
                                                      submit: true
                                    - action: if
                                      params:
                                        condition: ${actions.importResult.ok}
                                        then:
                                          - action: message
                                            params:
                                              messageType: success
                                              text: 已创建 Model 草稿（演示：可去编辑补全定价与参数）
                                          - action: reload
                                            params:
                                              dataSource: detail
                              - type: Button
                                props:
                                  text: 查看全部模型
                                  icon: eye
                                  size: small
                                events:
                                  onClick:
                                    - action: message
                                      params:
                                        messageType: info
                                        text: 跳转 Model 列表（带 Provider 筛选，演示：目标页建设中）
                      - type: Table
                        props:
                          dataSource: ${data.detail.models}
                          rowKey: code
                          pagination:
                            pageSize: 10
                          columns:
                            - title: Model Code
                              dataIndex: code
                            - title: Model Name
                              dataIndex: name
                            - title: Type
                              dataIndex: type
                            - title: Provider Model ID
                              dataIndex: providerModelId
                            - title: 定价摘要
                              dataIndex: pricing
                            - title: Status
                              cell:
                                type: Badge
                                props:
                                  text: ${row.status}
                                  variant: "${row.status == 'ONLINE' ? 'default' : 'secondary'}"
                            - title: 路由
                              dataIndex: routes
                            - title: 操作
                              cell:
                                type: Button
                                props:
                                  text: 详情
                                  variant: link
                                  size: small
                                  className: p-0
                                events:
                                  onClick:
                                    - action: message
                                      params:
                                        messageType: info
                                        text: 跳转模型详情：${row.code}（演示：目标页建设中）
                  - key: relations
                    label: 引用关系
                    className: p-2
                    children:
                      - type: Card
                        props:
                          bordered: false
                        children:
                          - type: Text
                            props:
                              text: >-
                                ${data.detail.code} (Provider)

                                │

                                ├── Model (${data.detail.modelCount})

                                │   ├── ${data.detail.models[0].code}

                                │   └── ...

                                │

                                └── 被引用
                                    └── Model → Route Target (${data.detail.routes.total}) → Route Pool
                              className: font-mono text-sm
                              style:
                                whiteSpace: pre
                          - type: Flex
                            props:
                              align: center
                              gap: middle
                            children:
                              - type: Button
                                props:
                                  text: 展开全部
                                  size: small
                                events:
                                  onClick:
                                    - action: message
                                      params:
                                        messageType: info
                                        text: 展开全部（演示）
                              - type: Button
                                props:
                                  text: 导出关系图
                                  size: small
                                events:
                                  onClick:
                                    - action: message
                                      params:
                                        messageType: info
                                        text: 导出关系图（演示）
    - type: Empty
      when: ${data.detail == null && !dataStatus.detail.loading}
      props:
        title: 未找到 Provider
        description: Provider Code「${route.params.code}」不存在或已被删除
      children:
        - type: Button
          props:
            text: 返回列表
            variant: primary
          events:
            onClick:
              - action: navigate
                params:
                  to: /providers
