dsl: "1.0"
page:
  id: provider-create
  title: 新增 Provider
  name: providerForm
  description: 创建或修改 Provider，并配置上游 Base URL 与 API Key
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 模型资产
          - label: Provider
            href: /providers
          - label: 新增 Provider
    - type: Card
      children:
        - type: Flex
          props:
            direction: vertical
            gap: small
          children:
            - type: Typography
              props:
                variant: h3
                text: 新增 Provider
            - type: Typography
              props:
                variant: muted
                text: 定义供应商并配置上游连接与 API Key
    - type: Form
      props:
        layout: vertical
        initialValues:
          providerType: 商业
          protocol: OpenAI Compatible
          status: enabled
          timeout: 60000
          capabilityExtension: |-
            {
              "supports_streaming": true
            }
      events:
        onSubmit:
          - id: cfm
            action: confirm
            condition: "false"
            params:
              title: 确认停用 Provider
              content: 停用后，该 Provider 将无法被新建 Model / Target 引用。⚠ 存在 ONLINE Target
                引用时，建议先完成切换再停用。（演示）
          - action: if
            params:
              condition: "true"
              then:
                - action: message
                  params:
                    messageType: success
                    text: Provider「${event.name}」已创建。建议下一步：注册模型（演示）
                - action: navigate
                  params:
                    to: /providers
      children:
        - type: Flex
          props:
            direction: vertical
            gap: middle
          children:
            - type: Card
              props:
                title: 基本信息
              children:
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                    className: "[&>[data-slot=grid-item]:last-child]:col-span-full"
                  children:
                    - type: Field
                      children:
                        - type: Flex
                          props:
                            justify: space-between
                            align: center
                            className: w-full mb-3.5
                          children:
                            - type: Flex
                              props:
                                align: center
                                className: gap-0.5
                              children:
                                - type: Text
                                  props:
                                    text: "*"
                                    className: text-destructive text-sm leading-none
                                - type: Label
                                  props:
                                    text: Provider Code
                            - type: Text
                              props:
                                text: Provider Code 创建后不可修改
                                type: secondary
                                className: text-xs leading-none
                        - type: Input
                          props:
                            name: code
                            className: w-full
                            placeholder: 小写 + 数字 + 连字符，如 openai
                            disabled: false
                            rules:
                              - required: true
                                message: 请输入 Provider Code
                    - type: Field
                      props:
                        label: Provider Name
                        required: true
                      children:
                        - type: Input
                          props:
                            name: name
                            className: w-full
                            placeholder: 1–64 字符
                            rules:
                              - required: true
                                message: 请输入 Provider Name
                    - type: Field
                      props:
                        label: Provider Type
                        required: true
                      children:
                        - type: Select
                          props:
                            name: providerType
                            className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                            options:
                              - label: 商业
                                value: 商业
                              - label: 云服务
                                value: 云服务
                              - label: 私有
                                value: 私有
                              - label: 自定义
                                value: 自定义
                            rules:
                              - required: true
                                message: 请选择 Provider Type
                    - type: Field
                      props:
                        label: Default Protocol
                        required: true
                      children:
                        - type: Select
                          props:
                            name: protocol
                            className: w-full [&>span]:w-full [&_[data-slot=select-trigger]]:w-full
                            options:
                              - label: OpenAI Compatible
                                value: OpenAI Compatible
                              - label: Anthropic Messages
                                value: Anthropic Messages
                              - label: Gemini
                                value: Gemini
                              - label: DashScope
                                value: DashScope
                              - label: 自定义
                                value: 自定义
                            rules:
                              - required: true
                                message: 请选择 Default Protocol
                    - type: Field
                      props:
                        label: Status
                      children:
                        - type: RadioGroup
                          props:
                            name: status
                            direction: horizontal
                            options:
                              - label: 启用
                                value: enabled
                              - label: 停用
                                value: disabled
                    - type: Field
                      props:
                        label: Description
                      children:
                        - type: Textarea
                          props:
                            name: description
                            className: w-full
                            placeholder: 最长 500 字符
                            rows: 3
            - type: Card
              props:
                title: 连接与凭证
              children:
                - type: Alert
                  props:
                    showIcon: true
                    variant: info
                    className: mb-4
                    message: 配置 Runtime 访问上游模型服务时使用的地址与 API Key
                - type: Grid
                  props:
                    columns: 2
                    gap: 16
                    className: mt-2
                  children:
                    - type: Field
                      props:
                        label: Base URL
                        required: true
                      children:
                        - type: Input
                          props:
                            name: baseUrl
                            className: w-full
                            placeholder: https://api.openai.com/v1
                            rules:
                              - required: true
                                message: 请输入 Base URL（合法 HTTPS URL）
                    - type: Field
                      props:
                        label: Region
                      children:
                        - type: Input
                          props:
                            name: region
                            className: w-full
                            placeholder: 如 us-east、cn-beijing
                    - type: Field
                      children:
                        - type: Flex
                          props:
                            justify: space-between
                            align: center
                            className: w-full mb-3.5
                          children:
                            - type: Flex
                              props:
                                align: center
                                className: gap-0.5
                              children:
                                - type: Text
                                  props:
                                    text: "*"
                                    className: text-destructive text-sm leading-none
                                - type: Label
                                  props:
                                    text: API Key
                            - type: Text
                              props:
                                text: 保存后不可查看明文；编辑时留空表示不修改
                                type: secondary
                                className: text-xs leading-none
                        - type: Input
                          props:
                            name: apiKey
                            className: w-full
                            type: password
                            placeholder: 保存后不可查看明文
                            rules:
                              - required: true
                                message: 新增时 API Key 不能为空
                    - type: Field
                      props:
                        label: Timeout (ms)
                      children:
                        - type: NumberInput
                          props:
                            name: timeout
                            className: w-full
                            min: 0
                            precision: 0
                            placeholder: "60000"
                    - type: Field
                      props:
                        label: Proxy
                      children:
                        - type: Input
                          props:
                            name: proxy
                            className: w-full
                            placeholder: 可选代理地址
                    - type: Flex
                      props:
                        align: center
                        gap: middle
                        className: h-full
                      children:
                        - type: Button
                          props:
                            text: 测试连接
                            className: mt-[2px]
                          events:
                            onClick:
                              - action: message
                                params:
                                  messageType: success
                                  text: 连接测试成功：HTTP 200, 128ms（演示：不持久化未保存字段）
                        - type: Text
                          props:
                            text: 保存前建议先测试 Base URL 与 API Key 是否有效
                            type: secondary
                            className: text-xs
            - type: Card
              props:
                title: 能力扩展（Capability Extension）
              children:
                - type: Field
                  props:
                    label: JSON 模式
                  children:
                    - type: Textarea
                      props:
                        name: capabilityExtension
                        rows: 5
                        className: font-mono w-full
                        placeholder: '{ "supports_responses": true }'
        - type: Flex
          props:
            justify: end
            className: mt-4
          children:
            - type: Button
              props:
                text: 取消
                icon: x
              events:
                onClick:
                  - action: navigate
                    params:
                      to: /providers
            - type: Button
              props:
                text: 保存
                icon: save
                variant: primary
                submit: true
