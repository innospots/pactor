# 数据列表标准骨架 —— 「搜索 + 表格 + 抽屉新建/编辑」数据列表页的复制起点。
# 本页已注册进 sitemap.yaml（菜单「页面骨架 / 数据列表」，路径 /models/data-list），
# 在模板工程中可直接运行预览；生成业务列表页时复制本文件到 yaml/<模块>/ 下，
# 替换页面信息、字段、接口名（data-list → 业务资源名）与文案。
# 结构与交互约定见 skills/pactor-prd/references/page-templates.md「数据列表标准模型」。
dsl: "1.0"
page:
  id: data-list
  title: 数据列表
  name: dataList
state:
  # 搜索条件镜像：Form submit 后写入，驱动列表请求参数
  keyword: ""
  status: all
  editingId: ""
  # 表单条件显隐镜像（onValuesChange 写入；按页面需要增减，可多个）
  fType: ""
dataSources:
  list:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/data/data-list
      params:
        keyword: ${state.keyword}
        status: ${state.status}
  editing: # 编辑预填；autoLoad: false，打开抽屉前手动 reload
    type: http
    autoLoad: false
    request:
      method: GET
      url: /api/data/data-list/${state.editingId}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 页面骨架
          - label: 数据列表
    # 标题行：左标题 + 副标题，右新建按钮
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            direction: vertical
            gap: 2
          children:
            - type: Typography
              props:
                variant: h3
                text: 数据列表
            - type: Typography
              props:
                variant: muted
                text: 标准列表示例：搜索 + 表格 + 抽屉新建/编辑，复制本页生成业务列表。
        - type: Button
          props:
            text: + 新建记录
            variant: primary
          events:
            onClick:
              - action: setState # 清空编辑态与显隐镜像
                params:
                  editingId: ""
                  fType: ""
              - action: reload # 清空 editing 数据（editingId 为空 → mock 返回空对象）
                params:
                  dataSource: editing
              - action: overlay.open # 锚点 &entityDrawer 在此定义，表格行内用 *entityDrawer 引用
                params:
                  overlay: &entityDrawer
                    type: drawer
                    title: "${state.editingId == '' ? '新建记录' : '编辑记录'}"
                    width: 720
                    content:
                      type: Form
                      props:
                        name: entityForm
                        layout: vertical
                        initialValues: ${data.editing}
                      events:
                        # 条件显隐字段镜像到 state（其他字段变化时保持原值）
                        onValuesChange:
                          - action: setState
                            params:
                              fType: "${event.type != null ? event.type : state.fType}"
                        onSubmit:
                          - action: request
                            params:
                              method: POST
                              url: /api/data/ops/data-list-save
                              body:
                                id: ${state.editingId}
                                name: ${event.name}
                                code: ${event.code}
                                type: ${event.type}
                                extra: ${event.extra}
                                sort: ${event.sort}
                                status: ${event.status}
                          - action: message
                            params:
                              messageType: success
                              text: 已保存（演示）
                          - action: overlay.close
                      children:
                        # 分区结构：标题 → 分割线 → 字段组（不用 Card）；多个分区重复此结构
                        - type: Flex
                          props:
                            direction: vertical
                            gap: middle
                          children:
                            - type: Text
                              props:
                                text: 基本信息
                                strong: true
                            - type: Separator
                            - type: Flex
                              props:
                                direction: vertical
                                gap: small
                              children:
                                - type: Field
                                  props:
                                    label: 名称
                                    required: true
                                  children:
                                    - type: Input
                                      props:
                                        name: name
                                        placeholder: 请输入名称
                                        rules:
                                          - required: true
                                            message: 请输入名称
                                # 编辑时禁用关键字段
                                - type: Field
                                  props:
                                    label: 编码
                                    required: true
                                  children:
                                    - type: Input
                                      props:
                                        name: code
                                        placeholder: 大写字母 + 下划线，如 DEMO_ITEM
                                        disabled: ${state.editingId != ''}
                                        rules:
                                          - required: true
                                            message: 请输入编码
                                # 成对字段用 Grid 两列
                                - type: Grid
                                  props:
                                    columns: 2
                                    gap: 16
                                  children:
                                    - type: Field
                                      props:
                                        label: 类型
                                        required: true
                                      children:
                                        - type: Select
                                          props:
                                            name: type
                                            placeholder: 请选择类型
                                            options: ${data.list.filters.type}
                                            rules:
                                              - required: true
                                                message: 请选择类型
                                    - type: Field
                                      props:
                                        label: 状态
                                      children:
                                        - type: Select
                                          props:
                                            name: status
                                            value: 启用
                                            options: ${data.list.filters.status}
                                - type: Grid
                                  props:
                                    columns: 2
                                    gap: 16
                                  children:
                                    - type: Field
                                      props:
                                        label: 排序
                                      children:
                                        - type: NumberInput
                                          props:
                                            name: sort
                                            className: w-full
                                            min: 0
                                            precision: 0
                                # 条件显隐字段：依赖镜像 state
                                - when: ${state.fType == '高级'}
                                  type: Field
                                  props:
                                    label: 扩展说明
                                  children:
                                    - type: Input
                                      props:
                                        name: extra
                                        placeholder: 高级类型的扩展配置说明
                        # 底部按钮：取消关抽屉，保存触发 Form onSubmit
                        - type: Flex
                          props:
                            justify: end
                            gap: small
                            className: mt-4
                          children:
                            - type: Button
                              props:
                                text: 取消
                              events:
                                onClick:
                                  - action: overlay.close
                            - type: Button
                              props:
                                text: 保存
                                variant: primary
                                submit: true
                                htmlType: submit
              - action: reload # overlay.open 阻塞到关闭，关闭后刷新列表
                params:
                  dataSource: list
    # 搜索栏：Form(layout: inline) + Field 包裹控件
    - type: Card
      children:
        - type: Form
          props:
            name: search
            layout: inline
          events:
            onSubmit:
              - action: setState
                params:
                  keyword: ${event.keyword}
                  status: ${event.status}
              - action: reload
                params:
                  dataSource: list
          children:
            - type: Field
              props:
                label: 编码/名称
              children:
                - type: Input
                  props:
                    name: keyword
                    placeholder: 支持模糊查询
            - type: Field
              props:
                label: 状态
              children:
                - type: Select
                  props:
                    name: status
                    placeholder: 请选择状态
                    options: ${data.list.filters.status} # 选项由接口下发
            # 按钮也放进 Field：label 为 U+00A0 不间断空格（普通空格会被压缩），与左侧控件基线对齐
            - type: Field
              props:
                label: " "
              children:
                - type: Flex
                  props:
                    gap: small
                    align: center
                  children:
                    - type: Button
                      props:
                        text: 查询
                        submit: true
                        htmlType: submit
                    - type: Button
                      props:
                        text: 重置
                      events:
                        onClick:
                          - action: form.setValues
                            params:
                              form: search
                              values:
                                keyword: ""
                                status: all
                          - action: setState
                            params:
                              keyword: ""
                              status: all
                          - action: reload
                            params:
                              dataSource: list
        # 表格：名称列/操作列按钮统一 variant: link size: small
        - type: Table
          props:
            dataSource: ${data.list.items}
            rowKey: id
            pagination: false
            className: mt-4
            columns:
              - title: 名称
                cell:
                  type: Button
                  props:
                    text: ${row.name}
                    variant: link
                    size: small
                  events:
                    onClick: &editRow # 行点击 = 编辑，锚点在此定义
                      - action: setState # 写入编辑 id + 显隐镜像（取自行数据，不等 editing 接口）
                        params:
                          editingId: ${row.id}
                          fType: ${row.type}
                      - action: reload
                        params:
                          dataSource: editing
                      - action: overlay.open
                        params:
                          overlay: *entityDrawer
                      - action: reload
                        params:
                          dataSource: list
              - title: 编码
                dataIndex: code
              - title: 类型
                dataIndex: type
              - title: 状态
                dataIndex: status
              - title: 操作
                cell:
                  type: Button
                  props:
                    text: 编辑
                    variant: link
                    size: small
                  events:
                    onClick: *editRow # 与名称列同一动作
        - type: Text
          props:
            text: 共 ${data.list.total} 条
            type: secondary
            className: mt-3
