# 登录页 DSL：type: Login 业务组件（packages/ui components/business/Login/），
# 布局（layout: split / centered / brand-card / overlap / backdrop）与修饰
# （brandSide / brandRatio / authVariant / brandPanelBackground / decor）正交组合，
# 品牌区/文案/辅助入口/页脚全部 props 化，样式走语义令牌（深浅色/换肤自适应），
# 可配置项权威定义见 openspec/specs/ui-login-component 与组件源码。
# 提交闭环由 DSL 编排：内置 request（POST /api/auth/login 写会话 cookie）
# + 结果判空 + 失败/成功 message + app.reload 整页重载，sitemap 端点按已登录
# 会话重新下发。页面使用 sitemap.yaml 的 login 布局（纯 PageOutlet）。
dsl: "1.0"
page:
  id: login
  title: 登录
  name: login
  description: 登录页

body:
  type: Login
  props:
    layout: split
    authVariant: card
    brand:
      name: Pactor Console
      title: 管理后台登录
      description: 仅已分配平台审核角色的管理人员可以访问。
    title: 登录
    subtitle: 使用管理员账号登录控制台（演示账号 admin / pactor123）
    submitText: 登 录
  events:
    onSubmit:
      - id: loginResult
        action: request
        params:
          method: POST
          url: http://localhost:9011/api/auth/login
          body:
            username: ${event.username}
            password: ${event.password}
      - action: if
        params:
          condition: ${actions.loginResult == null || actions.loginResult.token == null}
          then:
            - action: message
              params:
                messageType: error
                text: 用户名或密码错误（演示账号 admin / pactor123）
      - action: if
        params:
          condition: ${actions.loginResult != null && actions.loginResult.token != null}
          then:
            - action: message
              params:
                messageType: success
                text: 登录成功，正在跳转…
            - action: app.reload
              params: { to: / }
