# 登录页 DSL：卡片结构 + 提交/错误提示/跳转闭环，视觉样式在 app/login.css。
# 全屏渐变外壳（login-page 类）由 sitemap.yaml 的 login 布局提供，
# 提交动作为内置 request（POST /api/auth/login 写会话 cookie）+ app.reload
# 整页重载，sitemap 端点按已登录会话重新下发。
dsl: "1.0"
page:
  id: login
  title: 登录
  name: login
  description: 登录页

body:
  type: Card
  props:
    className: login-card
  children:
    - type: Text
      props:
        text: RESTRICTED ACCESS
        className: login-eyebrow
    - type: Text
      props:
        text: 管理后台登录
        className: login-heading
    - type: Text
      props:
        text: 仅已分配平台审核角色的管理人员可以访问。
        type: secondary
        className: login-subtitle
    - type: Form
      props:
        name: login
        style: { marginTop: 16 }
      events:
        onSubmit:
          - id: loginResult
            action: request
            params:
              method: POST
              url: http://localhost:9011/api/auth/login
              body:
                username: ${event.username}
                password: ${event.password}
          - action: if
            params:
              condition: ${actions.loginResult == null || actions.loginResult.token == null}
              then:
                - action: message
                  params:
                    messageType: error
                    text: 用户名或密码错误（演示账号 admin / pactor123）
          - action: if
            params:
              condition: ${actions.loginResult != null && actions.loginResult.token != null}
              then:
                - action: message
                  params:
                    messageType: success
                    text: 登录成功，正在跳转…
                - action: app.reload
                  params: { to: / }
      children:
        - type: Input
          props:
            name: username
            label: 用户名
            placeholder: 请输入用户名
            rules:
              - { required: true, message: 请输入用户名 }
        - type: Input
          props:
            name: password
            label: 密码
            type: password
            placeholder: 请输入密码
            rules:
              - { required: true, message: 请输入密码 }
        - type: Button
          props:
            text: 登 录
            variant: primary
            submit: true
            size: large
            style: { width: 100%, marginTop: 8 }
