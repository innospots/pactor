dsl: "1.0"
page:
  id: dashboard
  title: $i18n{page.dashboard.text1:仪表盘}
  name: dashboard
  description: 运营概览：核心指标、趋势分析、用量构成
state:
  range:
    start: "{{DEMO_DATE_START}}"
    end: "{{DEMO_DATE_END}}"
  trendMetric: requests
dataSources:
  dashboard:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/dashboard
      params:
        start: ${state.range.start}
        end: ${state.range.end}
i18n:
  namespaces: [ app ]

body:
  type: Page
  children:
    - type: Flex
      props:
        justify: space-between
        align: center
      children:
        - type: Flex
          props:
            align: baseline
            gap: middle
          children:
            - type: Typography
              props:
                variant: h3
                text: $i18n{page.dashboard.text2:仪表盘}
            - type: Typography
              props:
                variant: muted
                text: $i18n{page.dashboard.text3:运营概览}
        - type: Flex
          props:
            align: center
            gap: middle
          children:
            - type: Text
              props:
                text: 实时 ${data.dashboard.realtime.rpm} RPM · ${data.dashboard.realtime.tpm} TPM
                type: secondary
                className: tabular-nums
            - type: Button
              props:
                text: ↻ 刷新
                size: small
              events:
                onClick:
                  - action: reload
                    params:
                      dataSource: dashboard
                  - action: message
                    params:
                      messageType: success
                      text: 看板数据已刷新
    - type: Card
      children:
        - type: Flex
          props:
            align: center
            gap: middle
          children:
            - type: Text
              props:
                text: 分析时间范围
                strong: true
            - type: DatePicker
              props:
                mode: range
                value: ${state.range}
                placeholder: 选择时间范围
                style:
                  width: 280
                presets:
                  - label: 今天
                    days: 1
                  - key: thisWeek
                  - key: thisMonth
                  - label: 近3天
                    days: 3
                  - label: 近7天
                    days: 7
                  - label: 近14天
                    days: 14
                  - label: 近30天
                    days: 30
              events:
                onChange:
                  - action: setState
                    condition: ${event}
                    params:
                      range: ${event}
                  - action: reload
                    condition: ${event}
                    params:
                      dataSource: dashboard
    - type: Typography
      props:
        variant: h4
        text: 核心概览 · ${state.range.start} — ${state.range.end}
    - type: Row
      props:
        gutter: [ 16, 16 ]
        align: stretch
      children:
        - type: Col
          props: { span: 24, md: 12, xl: 6 }
          children:
            - type: Card
              props:
                className: stat-card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: start
                  children:
                    - type: Statistic
                      props:
                        title: 请求量
                        value: ${data.dashboard.stats.requests}
                    - type: Icon
                      props:
                        name: chart
                        size: lg
                        className: stat-card-icon
                - type: Typography
                  props:
                    variant: muted
                    text: ${data.dashboard.stats.activeClients} 位活跃客户端 ·
                      ${data.dashboard.stats.tokens} Token
        - type: Col
          props: { span: 24, md: 12, xl: 6 }
          children:
            - type: Card
              props:
                className: stat-card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: start
                  children:
                    - type: Statistic
                      props:
                        title: 成功率
                        value: ${data.dashboard.stats.successRate}
                        suffix: "%"
                    - type: Icon
                      props:
                        name: check-circle
                        size: lg
                        className: stat-card-icon
                - type: Button
                  props:
                    text: ${data.dashboard.stats.failures} 个失败 · 错误率
                      ${data.dashboard.stats.errorRate}%
                    variant: link
                    size: small
                    style:
                      alignSelf: flex-start
                    className: p-0
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text: 跳转调用日志（失败筛选）
        - type: Col
          props: { span: 24, md: 12, xl: 6 }
          children:
            - type: Card
              props:
                className: stat-card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: start
                  children:
                    - type: Statistic
                      props:
                        title: 平均响应时间
                        value: ${data.dashboard.stats.avgLatency}
                        suffix: " ms"
                    - type: Icon
                      props:
                        name: clock
                        size: lg
                        className: stat-card-icon
                - type: Button
                  props:
                    text: 查看可靠性分析 →
                    variant: link
                    size: small
                    style:
                      alignSelf: flex-start
                    className: p-0
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text: 跳转供应商可用性
        - type: Col
          props: { span: 24, md: 12, xl: 6 }
          children:
            - type: Card
              props:
                className: stat-card
              children:
                - type: Flex
                  props:
                    justify: space-between
                    align: start
                  children:
                    - type: Statistic
                      props:
                        title: 计费金额
                        value: ${data.dashboard.stats.cost}
                    - type: Icon
                      props:
                        name: credit-card
                        size: lg
                        className: stat-card-icon
                - type: Typography
                  props:
                    variant: muted
                    text: 平均每次 ${data.dashboard.stats.avgCost}
    - type: Card
      props:
        title: 趋势分析
      children:
        - type: Flex
          props:
            justify: space-between
            align: center
          children:
            - type: Typography
              props:
                variant: muted
                text: 观察流量变化与异常峰值
            - type: ToggleGroup
              props:
                value: ${state.trendMetric}
                options:
                  - label: 请求
                    value: requests
                  - label: Token
                    value: tokens
                  - label: 费用
                    value: cost
                  - label: 延迟
                    value: latency
              events:
                onChange:
                  - action: setState
                    condition: ${event}
                    params:
                      trendMetric: ${event}
        - type: AreaChart
          props:
            data: ${data.dashboard.trend}
            xKey: t
            yKeys: ${data.dashboard.metricKeys[state.trendMetric]}
            style:
              height: 320
    - type: Row
      props:
        gutter: [ 16, 16 ]
        align: stretch
      children:
        - type: Col
          props: { span: 24, md: 12 }
          children:
            - type: Card
              props:
                title: 用量构成 · 模型
              children:
                - type: Typography
                  props:
                    variant: muted
                    text: 按请求量分布，识别主要模型流量来源
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.models[0].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.models[0].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.models[0].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.models[1].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.models[1].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.models[1].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.models[2].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.models[2].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.models[2].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.models[3].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.models[3].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.models[3].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Button
                  props:
                    text: 查看全部 → 模型用量
                    variant: link
                    size: small
                    style:
                      alignSelf: flex-start
                    className: p-0
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text: 跳转模型用量
        - type: Col
          props: { span: 24, md: 12 }
          children:
            - type: Card
              props:
                title: 用量构成 · 客户端
              children:
                - type: Typography
                  props:
                    variant: muted
                    text: 按请求量分布，识别主要客户端流量来源
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[0].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.clients[0].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[0].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[1].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.clients[1].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[1].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[2].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.clients[2].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[2].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[3].name}
                        style:
                          width: 110
                    - type: Progress
                      props:
                        value: ${data.dashboard.clients[3].percent}
                        style:
                          flex: 1
                    - type: Text
                      props:
                        text: ${data.dashboard.clients[3].percent}%
                        type: secondary
                        className: tabular-nums
                        style:
                          width: 40
                          textAlign: right
                - type: Button
                  props:
                    text: 查看全部 → 客户端用量
                    variant: link
                    size: small
                    style:
                      alignSelf: flex-start
                    className: p-0
                  events:
                    onClick:
                      - action: message
                        params:
                          messageType: info
                          text: 跳转客户端用量
