<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UI Design System · 交互原型</title>
<style>
:root{
  --brand:#2767d8;--brand-50:#eef5ff;--brand-100:#dbeafe;--brand-600:#245bc2;
  --bg:#f5f7fa;--panel:#fff;--text:#172033;--muted:#687386;--subtle:#98a2b3;
  --line:#e6eaf0;--line2:#eef1f5;--hover:#f6f8fb;--selected:#edf4ff;
  --success:#16835e;--warning:#a96a00;--danger:#c53c3c;
  --header:58px;--footer:30px;--left:252px;--right:316px;
  --shadow:0 8px 30px rgba(20,32,56,.08);--radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.topbar{height:var(--header);position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:22px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;min-width:210px;font-weight:700}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#1f5dc5,#4b8ef3);color:white;display:grid;place-items:center;font-size:15px;box-shadow:0 6px 16px rgba(39,103,216,.25)}
.topnav{display:flex;gap:4px;height:100%;align-items:center}
.navitem{height:36px;padding:0 12px;border:0;background:transparent;border-radius:8px;color:#485467}
.navitem:hover{background:var(--hover);color:var(--text)}
.navitem.active{background:var(--brand-50);color:var(--brand);font-weight:600}
.pending-dot{font-size:10px;color:#b77b13;margin-left:4px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-trigger{width:250px;height:34px;border:1px solid var(--line);background:#f8fafc;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#7b8798}
.key{margin-left:auto;border:1px solid #dfe4ea;background:white;border-radius:5px;padding:1px 5px;font-size:11px;color:#8b95a5}
.version{font-size:12px;border:1px solid var(--line);padding:6px 8px;border-radius:7px;background:#fff;color:#5d697a}
.shell{position:fixed;top:var(--header);bottom:var(--footer);left:0;right:0;display:grid;grid-template-columns:var(--left) minmax(650px,1fr) var(--right);overflow:hidden}
.sidebar,.inspector{background:var(--panel);overflow:auto;min-height:0}
.sidebar{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
.main{overflow:auto;min-width:0;background:#fff}
.asset-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:12px;border-bottom:1px solid var(--line)}
.asset-tab{border:0;border-radius:7px;padding:8px 3px;background:#f7f8fa;color:#697486;font-size:12px}
.asset-tab:hover{background:#edf1f6}
.asset-tab.active{background:var(--brand);color:#fff;font-weight:600}
.side-title{padding:16px 16px 7px;color:#9aa3b1;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.side-menu{padding:0 9px 18px}
.menu-item{width:100%;height:38px;border:0;background:transparent;border-radius:8px;text-align:left;padding:0 11px;display:flex;align-items:center;justify-content:space-between;color:#485568;margin:2px 0}
.menu-item:hover{background:var(--hover);color:#202b3c}
.menu-item.active{background:var(--selected);color:var(--brand);font-weight:650}
.menu-count{font-size:11px;color:#9ba5b4}
.side-note{margin:12px;border:1px dashed #dbe1ea;background:#fafbfc;border-radius:10px;padding:11px;color:#7b8797;font-size:11px;line-height:1.65}
.content{max-width:1160px;margin:0 auto;padding:28px 34px 70px}
.breadcrumb{font-size:12px;color:#8a95a5;margin-bottom:11px}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.page-head-main{flex:1}
h1{font-size:27px;line-height:1.25;margin:0 0 8px}
.page-desc{font-size:14px;line-height:1.72;color:#687386;max-width:820px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #dbe1e8;background:#fff;border-radius:8px;padding:8px 11px;color:#465267}
.btn:hover{border-color:#b9c6d8;background:#fafcff}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{border-color:transparent;background:#f5f7fa}
.btn.small{font-size:12px;padding:6px 8px}
.section{margin:28px 0}
.section-title{font-size:17px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.section-sub{font-size:13px;color:#7c8797;margin:-4px 0 13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;transition:.16s}
.card:hover{border-color:#cbd5e2;box-shadow:0 6px 20px rgba(24,38,63,.06);transform:translateY(-1px)}
.card-body{padding:14px}
.card-title{font-weight:650;margin-bottom:6px}
.card-desc{font-size:12px;line-height:1.6;color:#748092;min-height:38px}
.card-actions{display:flex;gap:7px;margin-top:12px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fbfcfe}
.stat b{display:block;font-size:24px;margin-bottom:4px}
.stat span{font-size:12px;color:#7c8796}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.badge{font-size:11px;border-radius:999px;padding:3px 7px;background:#f1f4f8;color:#687487}
.badge.success{background:#eaf7f1;color:#147657}
.badge.warning{background:#fff4df;color:#9b6200}
.badge.info{background:#edf4ff;color:#2b63c2}
.badge.danger{background:#ffeded;color:#b73636}
.demo-banner{display:flex;gap:10px;align-items:flex-start;border:1px solid #f0d8a7;background:#fffaf0;border-radius:10px;padding:11px 13px;margin-bottom:18px;font-size:12px;color:#7a5a18;line-height:1.6}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.input{height:35px;border:1px solid #dfe4eb;border-radius:8px;background:#fff;padding:0 10px;min-width:220px;outline:none}
.input:focus{border-color:#8db4f2;box-shadow:0 0 0 3px rgba(39,103,216,.08)}
.select{height:35px;border:1px solid #dfe4eb;border-radius:8px;background:#fff;padding:0 28px 0 9px;color:#5b6675}
.result-count{font-size:12px;color:#8791a0;margin-left:auto}
.asset-card{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;min-height:160px}
.asset-card:hover{border-color:#c5d4ea}
.asset-card h3{font-size:15px;margin:0 0 7px}
.asset-card p{font-size:12px;color:#748092;line-height:1.6;margin:0}
.asset-card .spacer{flex:1}
.asset-card .meta{font-size:11px;color:#9aa4b2;margin:10px 0 0}
.preview-box{border:1px solid var(--line);border-radius:12px;background:#fafbfc;padding:24px;min-height:230px}
.interactive-surface{border:1px dashed #cfd7e3;border-radius:10px;background:#fff;padding:18px}
.preview-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-button{border:0;border-radius:7px;background:var(--brand);color:#fff;padding:9px 15px;font-weight:600}
.demo-button.secondary{background:#fff;color:#435069;border:1px solid #d8dfe9}
.demo-button.danger{background:#d64b4b}
.demo-input{border:1px solid #d6dde7;border-radius:7px;height:36px;padding:0 10px;width:220px}
.demo-card{border:1px solid #e2e7ed;border-radius:9px;padding:13px;background:#fff;width:220px}
.checkable{position:relative;outline:1px solid transparent;transition:.15s}
.checkable:hover{outline:2px solid rgba(39,103,216,.35);outline-offset:3px}
.checkable.selected{outline:2px solid var(--brand);outline-offset:3px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8fafc;color:#667286;text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--line2);color:#536075;vertical-align:top}
tr:last-child td{border-bottom:0}
.token-chain{display:grid;grid-template-columns:1fr 46px 1fr 46px 1fr;align-items:center;gap:5px}
.token-node{border:1px solid var(--line);background:#fff;border-radius:9px;padding:15px;text-align:center}
.token-node strong{display:block;margin-bottom:5px}
.arrow{text-align:center;color:#9aa5b3;font-size:20px}
.swatches{display:flex;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.swatches span{flex:1}
.family-top{height:80px;padding:14px;color:white;display:flex;align-items:flex-end;font-weight:700}
.palette-dots{display:flex;gap:5px;margin:9px 0}
.palette-dots span{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.template-thumb{height:130px;background:#f4f6f9;border-bottom:1px solid var(--line);padding:10px;display:grid;grid-template-columns:27% 1fr;gap:7px}
.thumb-side,.thumb-main,.thumb-top,.thumb-block{border-radius:5px;background:white;border:1px solid #dce3ec}
.thumb-main{display:grid;grid-template-rows:23px 1fr;gap:6px;padding:6px}
.thumb-content{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.thumb-block{background:#f7f9fc}
.template-stage{display:grid;grid-template-columns:210px 1fr;gap:10px;height:350px}
.tpl-side,.tpl-canvas{border:1px solid var(--line);background:#fff;border-radius:8px}
.tpl-side{padding:10px}
.tpl-canvas{display:grid;grid-template-rows:52px 1fr;gap:10px;padding:10px}
.tpl-head{border:1px dashed #d1d9e5;border-radius:6px;background:#fbfcfe}
.tpl-body{display:grid;grid-template-columns:1fr 240px;gap:10px}
.tpl-primary,.tpl-secondary{border:1px dashed #d1d9e5;border-radius:7px;background:#fbfcfe;padding:10px}
.mini-table{height:140px;border:1px solid #e0e6ee;border-radius:7px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 27px,#eef2f6 28px)}
.inspector-inner{padding:15px}
.ins-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;padding:0 0 11px;border-bottom:1px solid var(--line);z-index:2}
.ins-title{font-weight:700}
.icon-btn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:7px}
.ins-section{padding:15px 0;border-bottom:1px solid var(--line2)}
.ins-section:last-child{border-bottom:0}
.ins-section h4{font-size:12px;color:#8b95a4;margin:0 0 9px;text-transform:uppercase;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:92px 1fr;gap:7px 10px;font-size:12px;line-height:1.5}
.kv dt{color:#8993a2}
.kv dd{margin:0;color:#4e596b;word-break:break-word}
.anchor{display:block;border:0;background:transparent;padding:6px 0;color:#647082;font-size:12px;text-align:left;width:100%}
.anchor:hover{color:var(--brand)}
.footer{position:fixed;bottom:0;left:0;right:0;height:var(--footer);background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 15px;font-size:11px;color:#8a95a4;z-index:60}
.footer .right{margin-left:auto}
.toast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,20px);background:#1f2937;color:#fff;padding:9px 13px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.32);display:none;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:100}
.modal-backdrop.show{display:flex}
.modal{width:min(680px,92vw);background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(20,28,44,.25);overflow:hidden}
.modal-search{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.modal-search input{border:0;outline:0;font-size:15px;width:100%}
.search-results{max-height:440px;overflow:auto;padding:8px}
.search-item{padding:10px 11px;border-radius:8px;display:flex;gap:10px;align-items:center}
.search-item:hover{background:#f6f8fb}
.search-kind{font-size:10px;color:#7e8999;border:1px solid #dfe4ea;border-radius:5px;padding:2px 5px}
.search-main{font-size:13px}
.search-desc{font-size:11px;color:#919baa;margin-top:2px}
.pending-panel{text-align:center;padding:90px 20px}
.pending-panel .big{font-size:36px;margin-bottom:12px}
.empty{text-align:center;padding:48px 15px;color:#8c96a5;border:1px dashed #d8dee8;border-radius:10px;background:#fbfcfd}
.mobile-btn{display:none}
@media(max-width:1080px){
  .shell{grid-template-columns:220px minmax(600px,1fr)}
  .inspector{position:fixed;top:var(--header);bottom:var(--footer);right:0;width:340px;box-shadow:-12px 0 30px rgba(20,32,56,.11);transform:translateX(102%);transition:.2s;z-index:45}
  .inspector.open{transform:translateX(0)}
  .mobile-btn{display:inline-flex}
}
@media(max-width:760px){
  .topnav{display:none}.search-trigger{width:auto}.search-trigger span.label{display:none}
  .brand{min-width:auto}.shell{display:block}.sidebar{position:fixed;top:var(--header);bottom:var(--footer);left:0;width:260px;z-index:45;transform:translateX(-102%);transition:.2s;box-shadow:12px 0 30px rgba(20,32,56,.12)}
  .sidebar.open{transform:translateX(0)}.main{height:100%}.content{padding:22px 16px 70px}
  .grid,.grid.four,.stat-row{grid-template-columns:1fr}.page-head{display:block}.actions{margin-top:14px}.token-chain{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">UI</div><span>Design System</span></div>
  <nav class="topnav">
    <button class="navitem" data-top="docs">文档<span class="pending-dot">待设计</span></button>
    <button class="navitem active" data-top="assets">资产库</button>
    <button class="navitem" data-top="generator">主题生成器<span class="pending-dot">待设计</span></button>
    <button class="navitem" data-top="cases">案例<span class="pending-dot">待设计</span></button>
  </nav>
  <div class="top-actions">
    <button class="btn small mobile-btn" id="leftToggle">目录</button>
    <button class="search-trigger" id="searchTrigger"><span>⌕</span><span class="label">搜索组件、主题、模板、素材…</span><span class="key">⌘K</span></button>
    <span class="version">build 0.9.0 · prototype</span>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="asset-tabs" id="assetTabs"></div>
    <div class="side-title" id="sideTitle">分类</div>
    <div class="side-menu" id="sideMenu"></div>
    <div class="side-note">本页为交互原型。规范中未提供的正式 Token、色值、真实素材和接入状态不会伪造为生产资产。</div>
  </aside>

  <main class="main" id="main">
    <div class="content" id="content"></div>
  </main>

  <aside class="inspector" id="inspector">
    <div class="inspector-inner" id="inspectorInner"></div>
  </aside>
</div>

<footer class="footer">
  <span>当前构建版本：prototype-0.9.0　·　最近同步：2026-09-16　·　Git commit：demo-a84f31c</span>
  <span class="right">静态演示 · Git 管理 · 无在线编辑</span>
</footer>
<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="searchModal">
  <div class="modal">
    <div class="modal-search"><span style="margin-right:10px;color:#8490a0">⌕</span><input id="globalSearch" placeholder="搜索 Button、群青、Chat、图标……" /></div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function tint(hex,amount){
  const h=hex.replace("#",""); let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const mix=x=>Math.round(x+(255-x)*amount).toString(16).padStart(2,"0");
  return "#"+mix(r)+mix(g)+mix(b);
}
function shade(hex,amount){
  const h=hex.replace("#",""); let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const mix=x=>Math.round(x*(1-amount)).toString(16).padStart(2,"0");
  return "#"+mix(r)+mix(g)+mix(b);
}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1500)}

  try{await navigator.clipboard.writeText(text);toast("已复制到剪贴板")}
  catch(e){toast("复制失败，请手动复制")}
}
function setUrl(){
  const p=new URLSearchParams();
  p.set("asset",STATE.asset);p.set("section",STATE.section);
  if(STATE.detail)p.set("detail",STATE.detail);
  if(STATE.query)p.set("q",STATE.query);
  history.replaceState(null,"","?"+p.toString());
}
function fromUrl(){
  const p=new URLSearchParams(location.search);
  if(MENUS[p.get("asset")]) STATE.asset=p.get("asset");
  const sec=p.get("section"); if(sec && MENUS[STATE.asset].includes(sec)) STATE.section=sec;
  STATE.detail=p.get("detail")||null;STATE.query=p.get("q")||"";
}
function demoBanner(){
 return `<div class="demo-banner"><span>⚠</span><div><b>原型数据说明：</b>文档中未提供正式色值、真实素材或接入数据的部分，页面仅用于演示交互结构；相关字段明确显示“待资产接入”或“演示色”，不会作为正式资产值。</div></div>`;
}
function badge(text,kind=""){return `<span class="badge ${kind}">${esc(text)}</span>`}
function pageHead(title,desc,actions=""){
 return `<div class="breadcrumb">资产库 / ${LABELS[STATE.asset]} / ${esc(STATE.section)}${STATE.detail?" / "+esc(STATE.detail):""}</div>
 <div class="page-head"><div class="page-head-main"><h1>${esc(title)}</h1><div class="page-desc">${desc}</div></div><div class="actions">${actions}</div></div>`;
}
function navTo(asset,section,detail=null){
 STATE.asset=asset;STATE.section=section||MENUS[asset][0];STATE.detail=detail;STATE.inspector=null;STATE.query="";
 renderAll();setUrl();document.getElementById("main").scrollTo({top:0,behavior:"smooth"});
 document.getElementById("sidebar").classList.remove("open");
}
function renderTabs(){
 document.getElementById("assetTabs").innerHTML=Object.entries(LABELS).map(([k,v])=>`<button class="asset-tab ${STATE.asset===k?"active":""}" onclick="navTo('${k}','${MENUS[k][0]}')">${v}</button>`).join("");
}
function countForSection(sec){
 if(STATE.asset==="component") return DATA.components[sec]?.length||"";
 if(STATE.asset==="theme") return DATA.families[sec]?.themes.length||"";
 if(STATE.asset==="template") return DATA.templates[sec]?.length||"";
 return "";
}
function renderMenu(){
 document.getElementById("sideTitle").textContent=LABELS[STATE.asset]+"目录";
 document.getElementById("sideMenu").innerHTML=MENUS[STATE.asset].map(s=>`<button class="menu-item ${STATE.section===s?"active":""}" onclick="navTo('${STATE.asset}','${s}')"><span>${esc(s)}</span><span class="menu-count">${countForSection(s)}</span></button>`).join("");
}

function showInspector(obj){
 STATE.inspector=obj; const ins=document.getElementById("inspector");
 ins.classList.add("open");
 document.querySelectorAll(".checkable").forEach(x=>x.classList.remove("selected"));
 if(obj.domId){const e=document.getElementById(obj.domId);if(e)e.classList.add("selected")}
 const rows=Object.entries(obj.props||{}).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
 document.getElementById("inspectorInner").innerHTML=`<div class="ins-head"><div><div class="ins-title">${esc(obj.name)}</div><div style="font-size:11px;color:#8b96a5;margin-top:3px">${esc(obj.type||"对象检查")}</div></div><button class="icon-btn" onclick="clearInspector()">×</button></div>

 <div class="ins-section"><h4>使用说明</h4><div style="font-size:12px;color:#667285;line-height:1.7">${esc(obj.desc||"该对象用于演示右侧检查看板切换。")}</div></div>
 <div class="ins-section"><h4>快捷操作</h4><div class="actions"><button class="btn small" onclick='copyText(${JSON.stringify(obj.copy||obj.name)})'>复制参数</button>${obj.doc?`<button class="btn small" onclick="${obj.doc}">查看完整文档</button>`:""}</div></div>`;
}
function clearInspector(){STATE.inspector=null;document.getElementById("inspector").classList.remove("open");document.querySelectorAll(".checkable").forEach(x=>x.classList.remove("selected"));renderInspectorDefault()}
function closeInspectorPanel(){document.getElementById("inspector").classList.remove("open")}

function renderAll(){renderTabs();renderMenu();renderMain()}
function showPending(name){
 document.getElementById("content").innerHTML=`${pageHead(name,"该顶层模块在当前设计目录中标记为“待设计”，因此原型不伪造尚未定义的页面。",`<button class="btn primary" onclick="navTo('style','样式总览')">返回资产库</button>`)}<div class="pending-panel"><div class="big">◌</div><h2>${esc(name)} · 待设计</h2><p class="page-desc" style="margin:0 auto">当前仅保留导航入口与预期职责。完成专项设计文档后，再接入正式交互页面。</p></div>`;
 document.getElementById("inspectorInner").innerHTML=`<div class="ins-head"><div class="ins-title">设计状态</div></div><div class="ins-section"><h4>当前状态</h4>${badge("待设计","warning")}</div><div class="ins-section"><h4>约束</h4><div style="font-size:12px;line-height:1.7;color:#687386">关联入口不得指向不存在的正式页面，因此这里只显示状态说明。</div></div>`;
}
function openSearch(){
 const modal=document.getElementById("searchModal");modal.classList.add("show");setTimeout(()=>document.getElementById("globalSearch").focus(),0);renderSearch("");
}
function closeSearch(){document.getElementById("searchModal").classList.remove("show")}
function buildSearchIndex(){
 const arr=[];
 Object.entries(DATA.components).forEach(([cat,items])=>items.forEach(x=>arr.push({kind:"组件",name:x.name,desc:`${cat} · ${x.purpose}`,asset:"component",section:cat,detail:x.name})));
 Object.entries(DATA.families).forEach(([fam,f])=>{arr.push({kind:"主题色系",name:`${fam}色系`,desc:f.desc,asset:"theme",section:fam});f.themes.forEach(t=>arr.push({kind:"主题",name:t.name,desc:`${fam} · ${t.tone} · ${t.scene}`,asset:"theme",section:fam,detail:t.name}))});
 Object.entries(DATA.templates).forEach(([cat,items])=>items.forEach(x=>arr.push({kind:"模板",name:x.name,desc:cat,asset:"template",section:cat,detail:x.name})));
 MENUS.style.forEach(s=>arr.push({kind:"样式",name:s,desc:styleDescriptions[s]||"",asset:"style",section:s}));
 Object.keys(MATERIAL_META).forEach(s=>arr.push({kind:"素材",name:s,desc:MATERIAL_META[s].desc,asset:"material",section:s}));
 return arr;
}
const SEARCH_INDEX=buildSearchIndex();
function renderSearch(q){
 q=q.trim().toLowerCase();let res=SEARCH_INDEX.filter(x=>!q||x.name.toLowerCase().includes(q)||x.desc.toLowerCase().includes(q)).slice(0,30);
 document.getElementById("searchResults").innerHTML=res.length?res.map(x=>`<div class="search-item" onclick='closeSearch();navTo(${JSON.stringify(x.asset)},${JSON.stringify(x.section)},${JSON.stringify(x.detail||null)})'><span class="search-kind">${x.kind}</span><div><div class="search-main">${esc(x.name)}</div><div class="search-desc">${esc(x.desc)}</div></div></div>`).join(""):`<div class="empty">没有匹配结果</div>`;
}
document.getElementById("searchTrigger").onclick=openSearch;
document.getElementById("globalSearch").oninput=e=>renderSearch(e.target.value);
document.getElementById("searchModal").onclick=e=>{if(e.target.id==="searchModal")closeSearch()};
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch()} if(e.key==="Escape")closeSearch()});
document.getElementById("leftToggle").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.querySelectorAll("[data-top]").forEach(b=>b.onclick=()=>{const k=b.dataset.top;if(k==="assets")navTo(STATE.asset,STATE.section);else showPending({docs:"文档",generator:"主题生成器",cases:"案例"}[k])});
fromUrl();renderAll();
</script>
</body>
</html>
