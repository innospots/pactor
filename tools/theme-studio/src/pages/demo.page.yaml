                    children:
                      - type: Flex
                        props:
                          gap: 8
                          style: { alignItems: center }
                        children:
                          - type: Text
                            props: { text: 代办事项, strong: true }
                          - type: Badge
                            props: { text: '12', variant: secondary }
                      - type: Flex
                        props:
                          direction: vertical
                          style: { marginTop: 8 }
                        children:
                          - type: Flex
                            props:
                              justify: space-between
                              align: center
                              style: { padding: '10px 0', borderBottom: 1px solid var(--border) }
                            children:
                              - type: Flex
                                props: { direction: vertical, gap: 2 }
                                children:
                                  - type: Text
                                    props: { text: AntV 数据可视化 申请发布, strong: true }
                                  - type: Text
                                    props: { text: 青士 · 2020-07-01 14:00, type: secondary, style: { fontSize: 12 } }
                              - type: Flex
                                props: { gap: 8, style: { alignItems: center } }
                                children:
                                  - type: Badge
                                    props: { text: Ant Design, variant: outline }
                                  - type: Badge
                                    props: { text: 待审核 }
