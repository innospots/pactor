# 根级 children：左侧菜单栏 + 右侧工作台内容（横幅 / 代办 / 常用 / 动态 / 收藏 / 帮助 / 公告）
children:
  - type: Flex
    props:
      style: { height: 100vh, alignItems: stretch }
    children:
      # ===== 左侧菜单 =====
      - type: Flex
        props:
          direction: vertical
          style:
            {
              width: 208,
              flexShrink: 0,
              background: var(--card),
              borderRight: 1px solid var(--border),
            }
        children:
          - type: Flex
            props:
              gap: 8
              style:
                {
                  padding: '14px 16px',
                  alignItems: center,
                  borderBottom: 1px solid var(--border),
                }
            children:
              - type: Icon
                props: { name: package, color: var(--primary) }
              - type: Text
                props: { text: Pactor Pro, strong: true }
          - type: Menu
            props:
              items: ${data.menuItems}
              selectedKey: ${state.menuKey}
              style: { padding: 8 }
            events:
              onSelect:
                - action: setState
                  params:
                    menuKey: ${event}

      # ===== 右侧内容 =====
      - type: Flex
        props:
          direction: vertical
          style:
            {
              flex: 1,
              minWidth: 0,
              overflowY: auto,
              padding: 16,
              background: var(--background),
            }
        children:
          # 欢迎横幅：主色实底（保证文字对比度）+ 透明渐变罩层
          # （前景色 16% 光泽 → 透明 → 辅色 22% 轻染），亮/暗随令牌联动
          - type: Flex
            props:
              direction: vertical
              gap: 8
              style:
                {
                  padding: '20px 24px',
                  borderRadius: var(--radius),
                  background: 'linear-gradient(120deg, color-mix(in oklab, var(--primary-foreground) 16%, transparent) 0%, transparent 45%, color-mix(in oklab, var(--info, var(--primary-foreground)) 22%, transparent) 100%), var(--primary)',
                }
            children:
              - type: Text
                props:
                  text: Hi，欢迎使用应用 Paas 平台！
                  strong: true
                  style: { color: var(--primary-foreground), fontSize: 18 }
              - type: Text
                props:
                  text: 轻松创建、部署和管理你的应用，提升研发效率，降低业务成本
                  style:
                    {
                      color: 'color-mix(in oklab, var(--primary-foreground) 80%, transparent)',
                      fontSize: 13,
                    }

          # 主体两栏
          - type: Flex
            props:
              style: { marginTop: 12, alignItems: flex-start, gap: 16 }
            children:
              # ---- 左列 ----
              - type: Flex
                props:
                  direction: vertical
                  gap: 16
                  style: { flex: 2, minWidth: 0 }
                children:
                  # 代办事项
