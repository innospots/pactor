# 用户分析：活跃/新增/留存/付费指标 + 趋势 + 分层 + 地域 + 分层明细。
dsl: "1.0"
page:
  id: users
  title: 用户分析
state:
  rangeStart: "2026-11-11"
  rangeEnd: "2026-11-17"
  kpis:
    - { key: active, label: 活跃用户, value: "12,860", suffix: "", footnote: "较上周期 +6.4%", tone: positive }
    - { key: new, label: 新增用户, value: "1,248", suffix: "", footnote: "较上周期 +9.1%", tone: positive }
    - { key: retention, label: 7 日留存, value: "42.8", suffix: "%", footnote: "较上周期 +1.2%", tone: positive }
    - { key: pay, label: 付费转化, value: "4.6", suffix: "%", footnote: "较上周期 -0.2%", tone: danger }
  trend:
    - { date: "11-11", active: 1680, new: 248 }
    - { date: "11-12", active: 1740, new: 276 }
    - { date: "11-13", active: 1690, new: 261 }
    - { date: "11-14", active: 1820, new: 302 }
    - { date: "11-15", active: 1940, new: 338 }
    - { date: "11-16", active: 1810, new: 294 }
    - { date: "11-17", active: 2020, new: 356 }
  segments:
    - { name: 高价值用户, value: 18 }
    - { name: 成长用户, value: 32 }
    - { name: 普通用户, value: 38 }
    - { name: 沉默用户, value: 12 }
  regions:
    - { name: 华东, value: 3680 }
    - { name: 华南, value: 2860 }
    - { name: 华北, value: 2240 }
    - { name: 西南, value: 1580 }
    - { name: 其他, value: 860 }
  insights:
    - { key: growth, title: 新增来源集中, text: 内容推荐带来的新增占 41%，建议继续加投。 }
    - { key: retention, title: 留存提升明显, text: 7 日留存连续两周上升，新用户引导流程有效。" }
    - { key: churn, title: 沉默用户回升, text: 沉默用户占比 12%，建议触发召回任务。" }
  segmentRows:
    - { segment: 高价值用户, users: "2,315", share: "18%", retention: "78.6%", arpu: "¥ 286", trend: "+12.4%", tone: up }
    - { segment: 成长用户, users: "4,115", share: "32%", retention: "56.2%", arpu: "¥ 128", trend: "+6.8%", tone: up }
    - { segment: 普通用户, users: "4,887", share: "38%", retention: "38.4%", arpu: "¥ 46", trend: "+1.2%", tone: up }
    - { segment: 沉默用户, users: "1,543", share: "12%", retention: "12.8%", arpu: "¥ 8", trend: "-3.6%", tone: down }
body:
  type: Page
  props: { className: p-0 app-page }
  children:
    - type: Header
      props: { className: app-topbar }
      children:
        - type: Flex
          props: { direction: vertical, gap: 2, className: app-topbar-heading }
          children:
            - type: Text
              props: { text: 数据分析 / 用户分析, className: app-topbar-breadcrumb }
            - type: Typography
              props: { variant: h2, text: 用户分析, className: app-topbar-title }
        - type: Flex
          props: { className: app-topbar-actions, align: center, gap: 8 }
          children:
            - type: DatePicker
              props:
                mode: range
                size: small
                value:
                  start: ${state.rangeStart}
                  end: ${state.rangeEnd}
                presets:
                  - { label: 近 7 天, days: 7 }
                  - { label: 近 30 天, days: 30 }
              events:
                onChange:
                  - action: setState
                    params:
                      rangeStart: "${event.start}"
                      rangeEnd: "${event.end}"
            - type: Button
              props: { text: 导出, icon: download, size: small, variant: default }
              events:
                onClick:
                  - action: message
                    params: { messageType: info, text: 用户分析导出任务已创建（演示） }

    - type: Text
      props:
        text: 观察用户规模、结构、留存与付费表现，定位增长机会与流失原因
        className: app-page-subtitle

    - type: For
      props:
        className: da-metrics
        columns: 4
        gap: 12
        keyField: key
        items: "${state.kpis}"
      children:
        - type: Flex
          props: { className: da-metric-cell, direction: vertical }
          children:
            - type: MetricCard
              props:
                title: "${row.label}"
                value: "${row.value}"
                suffix: "${row.suffix}"
                className: da-metric
            - type: Text
              props:
                text: "${row.footnote}"
                className: "da-metric-footnote da-metric-footnote--${row.tone}"

    - type: Grid
      props: { className: da-panels, columns: 2, gap: 16 }
      children:
        - type: Card
          props: { title: 活跃与新增趋势, className: da-card da-chart-card }
          children:
            - type: LineChart
              props:
                data: ${state.trend}
                xKey: date
                yKeys: [active, new]
                smooth: true
                showArea: true
                height: 260
        - type: Card
          props: { title: 用户分层构成, className: da-card da-chart-card }
          children:
            - type: PieChart
              props:
                data: ${state.segments}
                nameKey: name
                valueKey: value
                height: 260

    - type: Grid
      props: { className: da-panels, columns: 2, gap: 16 }
      children:
        - type: Card
          props: { title: 地域用户分布, className: da-card da-chart-card }
          children:
            - type: BarChart
              props:
                data: ${state.regions}
                yKey: name
                xKeys: [value]
                height: 240
        - type: Card
          props: { title: 关键洞察, className: da-card da-insight-card }
          children:
            - type: Flex
              props: { direction: vertical, gap: 14 }
              children:
                - type: For
                  props: { keyField: key, items: "${state.insights}" }
                  children:
                    - type: Flex
                      props: { direction: vertical, gap: 3, className: da-insight }
                      children:
                        - type: Text
                          props: { text: "${row.title}", className: da-insight-title }
                        - type: Text
                          props: { text: "${row.text}", className: da-insight-text }

    - type: Card
      props: { title: 用户分层明细, className: da-card da-table-card }
      children:
        - type: Table
          props:
            dataSource: ${state.segmentRows}
            rowKey: segment
            pagination: false
            columns:
              - { title: 分层, dataIndex: segment }
              - { title: 用户数, dataIndex: users, align: right }
              - { title: 占比, dataIndex: share, align: right }
              - { title: 7 日留存, dataIndex: retention, align: right }
              - { title: ARPU, dataIndex: arpu, align: right }
              - title: 环比
                dataIndex: trend
                align: right
                cell:
                  type: Text
                  props:
                    text: ${row.trend}
                    className: "da-trend da-trend--${row.tone}"
