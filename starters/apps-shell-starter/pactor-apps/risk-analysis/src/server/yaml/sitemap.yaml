# 单页应用：数据价值分析工作台。
# 页面与布局 DSL 在 /api/sitemap 响应中内联下发。
# 无侧栏：仅一个全宽内容区，顶栏由页面自绘。
id: site
resourceType: sitemap
version: 1
dslVersion: "1.0"
app: { name: Pactor Console }

layouts:
  # 无菜单外壳：内容区铺满视口并独立滚动。
  admin:
    dsl: "1.0"
    body:
      type: Layout
      props: { className: shell-root }
      children:
        - type: Content
          props: { className: shell-content }
          children:
            - type: PageOutlet

pages:
  - id: risk-data-value
    path: /
    title: 数据价值分析工作台
    version: 1
    file: risk-analysis/risk-data-value.page.yaml

menus:
  - id: risk-analysis
    type: page
    pageId: risk-data-value
    path: /
    title: 风险分析
    icon: chart
    layout: admin
    public: true
