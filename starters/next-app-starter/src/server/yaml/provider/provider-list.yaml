dsl: "1.0"
page:
  id: provider-list
  title: 供应商
  name: providerList
  description: 模型资产 / Provider：上游 AI 供应商端点管理（卡片式列表）
state:
  keyword: ""
  statusChip: all
  typeChips: []
dataSources:
  providers:
    type: http
    autoLoad: true
    request:
      method: GET
      url: /api/d/providers
      params:
        keyword: ${state.keyword}
        status: ${state.statusChip}
        types: ${state.typeChips}
body:
  type: Page
  children:
    - type: Breadcrumb
      props:
        items:
          - label: 模型资产
          - label: Provider
    - type: Flex
      props:
        align: baseline
        gap: middle
      children:
        - type: Typography
          props:
            variant: h3
            text: 供应商
        - type: Typography
          props:
            variant: muted
            text: 上游 AI 供应商端点。导入模板后，请填入你的 API Key。
    - type: Card
      children:
        - type: Flex
          props:
            align: center
            gap: middle
          children:
            - type: Flex
              props:
                align: center
                gap: small
                className: h-9 rounded-md border bg-background px-3
                style:
                  flex: 1
              children:
                - type: Icon
                  props:
                    name: search
                    className: text-muted-foreground
                - type: Input
                  props:
                    value: ${state.keyword}
                    placeholder: 搜索供应商、ID、端点或能力
                    className: border-0 bg-transparent px-0 shadow-none focus-visible:ring-0
                    style:
                      flex: 1
                  events:
                    onChange:
                      - action: setState
                        params:
                          keyword: ${event}
                      - action: reload
                        params:
                          dataSource: providers
            - type: Text
              props:
                text: 显示 ${data.providers.items.length} / ${data.providers.total}
                type: secondary
                className: tabular-nums text-sm
        - type: Flex
          props:
            align: center
            gap: small
            style:
              flexWrap: wrap
            className: mt-2
          children:
            - type: ChipFilter
              props:
                mode: single
                value: ${state.statusChip}
                items: ${data.providers.filters.status}
              events:
                onChange:
                  - action: setState
                    params:
                      statusChip: ${event}
                  - action: reload
                    params:
                      dataSource: providers
            - type: ChipFilter
              props:
                mode: multi
                value: ${state.typeChips}
                items: ${data.providers.filters.types}
              events:
                onChange:
                  - action: setState
                    params:
                      typeChips: ${event}
                  - action: reload
                    params:
                      dataSource: providers
    - type: Grid
      props:
        columns: 3
        gap: 16
      children:
        - type: Card
          props:
            className: border-dashed h-full bg-(--muted) border-2
              border-[color-mix(in_srgb,var(--foreground)_30%,transparent)]
          children:
            - type: Flex
              props:
                direction: vertical
                gap: large
                align: stretch
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-10 shrink-0 rounded-full bg-primary
                      children:
                        - type: Icon
                          props:
                            name: plus
                            size: 28
                            color: var(--primary-foreground)
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 2
                      children:
                        - type: Text
                          props:
                            text: 添加供应商
                            strong: true
                            className: text-base
                        - type: Text
                          props:
                            text: 从模板导入，或新建空白供应商
                            type: secondary
                            className: text-sm
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Button
                      props:
                        text: 导入
                        icon: download
                        variant: default
                        style:
                          flex: 1
                      events:
                        onClick:
                          - action: message
                            params:
                              messageType: info
                              text: 模板导入流程
                    - type: Button
                      props:
                        text: 新建
                        icon: plus
                        variant: primary
                        style:
                          flex: 1
                      events:
                        onClick:
                          - action: navigate
                            params:
                              to: /providers/new
        - type: ProviderCardLink
          when: ${data.providers.items[0] != null}
          props:
            href: /providers/${data.providers.items[0].code}
          children:
            - type: Card
              props:
                className: h-full provider-card relative
              children:
                - type: Flex
                  props:
                    align: center
                    gap: middle
                  children:
                    - type: Flex
                      props:
                        align: center
                        justify: center
                        className: size-14 shrink-0 rounded-full bg-(--muted)
                      children:
                        - type: Icon
                          props:
                            name: ${data.providers.items[0].icon}
                            size: 28
                    - type: Flex
                      props:
                        direction: vertical
                        gap: 0
                        style:
                          alignItems: flex-start
                          flex: 1
                      children:
                        - type: Button
                          props:
                            text: ${data.providers.items[0].displayName}
                            variant: link
                            className: p-0 font-semibold text-base
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /providers/${data.providers.items[0].code}
                        - type: Flex
                          props:
                            justify: space-between
                            align: center
                            style:
                              width: 100%
                              marginTop: 2
                          children:
                            - type: TextLink
                              props:
                                text: ${data.providers.items[0].routeSummary}
                                className: text-sm text-(--muted-foreground) underline-offset-4 hover:underline
                              events:
                                onClick:
                                  - action: navigate
                                    params:
                                      to: /routes
                            - type: Text
                              when: ${data.providers.items[0].keyStatus != 'configured'}
                              props:
                                text: "${data.providers.items[0].keyStatus == 'pending' ? '● 待填密钥' : '● 无密钥'}"
                                type: "${data.providers.items[0].keyStatus == 'pending' ? 'warning' : 'danger'}"
                                className: text-xs
                            - type: Text
                              when: ${data.providers.items[0].keyStatus == 'configured'}
                              props:
                                text: ""
                - type: Flex
                  props:
                    align: center
                    gap: 2
                    className: absolute right-3 top-3 provider-card-actions
                  children:
                    - type: Tooltip
                      props:
                        content: "${data.providers.items[0].status == 'enabled' ? '停用' : '启用'}"
                      children:
                        - type: Button
                          props:
                            variant: text
                            size: small
                            className: size-6 p-0
                          children:
                            - type: StatusToggleIcon
                              props:
                                enabled: ${data.providers.items[0].status == 'enabled'}
                          events:
                            onClick:
                              - id: statusCfm
                                action: overlay.open
                                params:
                                  overlay:
                                    type: modal
                                    title: "${data.providers.items[0].status == 'enabled' ? '确认停用 Provider' : '确认启用
                                      Provider'}"
                                    width: 480
                                    content:
                                      type: Flex
                                      props:
                                        direction: vertical
                                        gap: middle
                                      children:
                                        - type: Text
                                          props:
                                            size: small
                                            text: "${data.providers.items[0].status == 'enabled' ? '停用后，该 Provider 将无法被新建
                                              Model / Target 引用。' : '启用后，该
                                              Provider 可被 Model / Target 引用。'}"
                                        - type: Flex
                                          props:
                                            direction: vertical
                                            gap: small
                                          children:
                                            - type: Text
                                              props:
                                                text: 影响范围：
                                                strong: true
                                            - type: Text
                                              props:
                                                text: · Model：${data.providers.items[0].modelCount}
                                                  个（${data.providers.items[0].enabledModelCount}
                                                  个启用）
                                                type: secondary
                                            - type: Text
                                              props:
                                                text: · Route Target 引用：${data.providers.items[0].routes.total} 个
                                                type: secondary
                                        - type: Text
                                          when: ${data.providers.items[0].status == 'enabled'}
                                          props:
                                            size: small
                                            text: ⚠ 存在 ONLINE Target 引用时，建议先完成切换再停用。
                                            type: warning
                                        - type: Flex
                                          props:
                                            justify: end
                                            gap: middle
                                          children:
                                            - type: Button
                                              props:
                                                text: 取消
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                            - type: Button
                                              props:
                                                text: "${data.providers.items[0].status == 'enabled' ? '确认停用' : '确认启用'}"
                                                variant: primary
                                                danger: ${data.providers.items[0].status == 'enabled'}
                                              events:
                                                onClick:
                                                  - action: overlay.close
                                                    params:
                                                      payload:
                                                        ok: true
                              - action: if
                                params:
                                  condition: ${actions.statusCfm.ok}
                                  then:
                                    - action: message
                                      params:
                                        messageType: success
                                        text: "${data.providers.items[0].status == 'enabled' ? '已停用' :
                                          '已启用'}"
                    - type: Tooltip
                      props:
                        content: 编辑
                      children:
                        - type: Button
                          props:
                            icon: pencil
                            variant: text
                            size: small
                            className: size-6 p-0
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /providers/${data.providers.items[0].code}/edit
                    - type: Tooltip
                      when: ${data.providers.items[0].keyStatus != 'configured'}
                      props:
                        content: 填写密钥
                      children:
                        - type: Button
                          props:
                            icon: key
                            variant: text
                            size: small
                            className: size-6 p-0
                          events:
                            onClick:
                              - action: navigate
                                params:
                                  to: /providers/${data.providers.items[0].code}/edit
                - type: Flex
                  props:
                    align: center
                    gap: small
                    style:
                      flexWrap: wrap
                  children:
                    - type: Badge
                      when: ${data.providers.items[0].capabilities[0] != null}
                      props:
