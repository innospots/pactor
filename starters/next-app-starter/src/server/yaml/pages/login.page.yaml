# 登录页 DSL：内联在 sitemap 中下发（public 页，匿名可见）。
# 登录 / 登出是普通 HTTP 调用，用内置 request 动作表达；
# 登录成功整页重载，sitemap 端点按已登录会话重新裁剪内容。
dsl: "1.0"
page:
  id: login
  title: 登录

state:
  submitting: false

body:
  type: Form
  events:
    onSubmit:
      - action: setState
        params: { submitting: true }
      - id: loginResult
        action: request
        params:
          method: POST
          url: http://localhost:9011/api/auth/login
          body:
            username: ${event.username}
            password: ${event.password}
      - action: setState
        params: { submitting: false }
      - action: if
        params:
          condition: ${actions.loginResult.token}
          then:
            - action: app.reload
              params: { to: / }
          else:
            - action: message
              params:
                messageType: error
                text: 登录失败：用户名或密码错误
  children:
    - type: Alert
      props:
        variant: info
        message: 演示账号 admin / pactor123，guest / guest123
        description: admin 可见「报表」菜单（report:view）；guest 仅可见首页。登录后 sitemap 按角色重新下发。
        style: { marginBottom: 16 }
    - type: Input
      props:
        name: username
        label: 用户名
        placeholder: 请输入用户名
        rules:
          - { required: true, message: 请输入用户名 }
    - type: Input
      props:
        name: password
        label: 密码
        type: password
        placeholder: 请输入密码
        rules:
          - { required: true, message: 请输入密码 }
    - type: Flex
      props: { justify: end }
      children:
        - type: Button
          props:
            text: 登 录
            variant: primary
            submit: true
            loading: ${state.submitting}
