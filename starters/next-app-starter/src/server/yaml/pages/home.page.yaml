# 首页 DSL：内联在 sitemap 中下发（需登录）。
# ${data.session.user.name} 由客户端注入的 session dataSource 提供。
dsl: "1.0"
page:
  id: home
  title: 首页
  name: home
  grantGroup: homeGroup

body:
  type: Page
  props: { title: "${t('home.title')}" }
  children:
    - type: Alert
      props:
        variant: info
        message: "${t('home.welcome', { name: data.session.user.name })}"
        description: "${t('home.description')}"
        style: { marginBottom: 16 }
    - type: Button
      props: { text: "${t('home.viewMonthly')}" }
      events:
        onClick:
          - action: navigate
            params: { to: /reports/monthly }
