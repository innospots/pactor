# Sitemap 入口数据（design/dynamic-page.md 方案 B）：元数据 + 布局 + 页面 + 菜单全量。
# 本文件是会话无关的超集；可见性由 src/server/sitemap.ts 按会话裁剪：
#   public: true   → 匿名可见（登录/注册页）
#   permission: x  → 需登录且具备对应权限
#   无标记         → 需登录
# 页面 DSL 按 id 约定从 pages/<id>.page.yaml 加载；lazy: true 不随 sitemap
# 内联下发，客户端经 /api/pages/{id} 懒加载。updatedAt / user / permissions
# 为会话动态字段，由服务端在响应时注入。

id: site
resourceType: sitemap
version: 13
dslVersion: "1.0"
app: { name: 动态页面 Starter }
layout: admin
auth: { loginPath: /login }

pages:
  - { id: login, path: /login, title: 登录, version: 1, public: true }
  - { id: register, path: /register, title: 注册, version: 1, public: true }
  - { id: home, path: /, title: 首页, version: 3 }
  - { id: users, path: /users, title: 用户列表, version: 1, permission: user:view, lazy: true }
  - { id: monthly, path: /reports/monthly, title: 月报, version: 7, permission: report:view, lazy: true }
  - { id: monthly-detail, path: /reports/monthly/:id, title: 月报详情, version: 2, permission: report:view }

menus:
  - { id: login, type: page, pageId: login, title: 登录, layout: login, public: true, hidden: true }
  - { id: register, type: page, pageId: register, title: 注册, layout: login, public: true, hidden: true }
  - { id: home, type: page, pageId: home, title: 首页, icon: home, layout: admin, order: 1 }
  - { id: users, type: page, pageId: users, title: 用户列表, icon: users, layout: admin, permission: user:view, order: 2 }
  - id: reports
    type: group
    title: 报表
    icon: chart
    order: 3
    children:
      - { id: monthly, type: page, pageId: monthly, title: 报表中心, icon: chart, layout: admin, permission: report:view }
      - { id: monthly-detail, type: page, pageId: monthly-detail, title: 月报详情, layout: admin, hidden: true, activeMenu: monthly, permission: report:view }
  - { id: help, type: link, title: 帮助, path: https://github.com/, external: true, permission: report:view, order: 4 }

# 布局 DSL（PageOutlet 为页面内容出口）。
# 布局 body 内 ${data.session.*} 由客户端注入的 session dataSource 提供
#（user / app / menus）；${route.params.pathname} 为当前路径（客户端注入）。
# 登录 / 登出是普通 HTTP 调用，DSL 用内置 request 动作表达（跨域绝对地址，
# 客户端 httpHooks 自动改写进项目内代理前缀），无需客户端注册服务。
layouts:
  # 管理端外壳：左侧 SitemapMenu 导航 + 顶栏用户菜单 + PageOutlet
  admin:
    dsl: "1.0"
    body:
      type: Flex
      props: { gap: 0, direction: horizontal, style: { height: 100vh } }
      children:
        - type: Flex
          props:
            direction: vertical
            style:
              width: 224
              flexShrink: 0
              borderRight: 1px solid var(--border)
          children:
            - type: Flex
              props:
                style:
                  padding: 16px 16px
                  fontWeight: 600
                  borderBottom: 1px solid var(--border)
              children:
                - type: Text
                  props: { text: "${data.session.app.name}" }
            - type: SitemapMenu
              props:
                items: ${data.session.menus}
                collapsible: true
              events:
                onSelect:
                  - action: navigate
                    params: { to: "${event}" }
        - type: Flex
          props:
            direction: vertical
            style: { flex: 1, minWidth: 0 }
          children:
            - type: Flex
              props:
                justify: end
                align: center
                style:
                  padding: 10px 20px
                  borderBottom: 1px solid var(--border)
              children:
                - type: DropdownMenu
                  props:
                    items:
                      - { label: 个人设置, value: settings, icon: settings }
                      - { label: 退出登录, value: logout, icon: log-out }
                  events:
                    onSelect:
                      - action: if
                        params:
                          condition: ${event == 'logout'}
                          then:
                            - action: request
                              params:
                                method: POST
                                url: http://localhost:9011/api/auth/logout
                            - action: app.reload
                              params: { to: /login }
                          else:
                            - action: message
                              params: { text: 演示环境未实现个人设置 }
                  children:
                    - type: Button
                      props:
                        text: ${data.session.user.name}
                        variant: text
            - type: Flex
              props:
                direction: vertical
                style: { flex: 1, minHeight: 0, overflow: auto }
              children:
                - type: PageOutlet
  # 登录 / 注册页外壳：居中卡片
  login:
    dsl: "1.0"
    body:
      type: Flex
      props:
        direction: vertical
        justify: center
        align: center
        style: { minHeight: 100vh, padding: 24 }
      children:
        - type: Flex
          props:
            direction: vertical
            style:
              width: 380
              padding: 24
              border: 1px solid var(--border)
              borderRadius: 12
          children:
            - type: PageOutlet
  # 裸布局：无外壳，页面铺满
  blank:
    dsl: "1.0"
    body:
      type: PageOutlet
