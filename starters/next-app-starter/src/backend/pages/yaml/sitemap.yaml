# Starter sitemap: session-aware pages, data-driven navigation and admin layout.
# Public pages are visible anonymously; permission entries require the matching
# code; all other entries require a signed-in session.
id: site
resourceType: sitemap
version: 16
dslVersion: "1.0"
app: { name: "Example Admin" }
layout: admin
auth: { loginPath: /login }

pages:
  - { id: login, path: /login, title: 登录, version: 1, public: true }
  - { id: register, path: /register, title: 注册, version: 1, public: true }
  - { id: workspace, path: /workspace, title: 工作台, version: 3 }
  - { id: dashboard, path: /dashboard, title: 数据概览, version: 2, lazy: true }
  - { id: monitoring, path: /monitoring, title: 数据监控, version: 1, lazy: true }
  - { id: monthly, path: /reports/monthly, title: 报表中心, version: 3, permission: report:view, lazy: true }
  - { id: monthly-detail, path: /reports/monthly/:id, title: 月报详情, version: 2, permission: report:view, lazy: true }
  - { id: data-list, path: /models/data-list, title: 数据列表, version: 1, lazy: true }
  - { id: system-settings, path: /settings/general, title: 系统设置, version: 2, lazy: true }
  - { id: dictionaries, path: /settings/dictionaries, title: 字典管理, version: 2, lazy: true }
  - { id: audit-logs, path: /settings/audit-logs, title: 审计日志, version: 4, lazy: true }
  - { id: roles, path: /settings/roles, title: 角色管理, version: 1, lazy: true }
  - { id: role-detail, path: /settings/roles/:roleId, title: 角色详情, version: 1, lazy: true }
  - { id: users, path: /settings/users, title: 用户管理, version: 1, permission: user:view, lazy: true }
  - { id: themes, path: /settings/themes, title: 主题设置, version: 2, lazy: true }
  - { id: profile, path: /profile, title: 个人中心, version: 2, lazy: true }

menus:
  - { id: login, type: page, pageId: login, path: /login, title: 登录, layout: login, public: true, hidden: true }
  - { id: register, type: page, pageId: register, path: /register, title: 注册, layout: auth, public: true, hidden: true }

  - { id: workspace, type: page, pageId: workspace, path: /workspace, title: 工作台, icon: workspace, layout: admin }

  - id: analytics
    type: group
    title: 数据经营
    icon: chart-no-axes-combined
    children:
      - { id: dashboard, type: page, pageId: dashboard, path: /dashboard, title: 数据概览, layout: admin }
      - { id: monitoring, type: page, pageId: monitoring, path: /monitoring, title: 数据监控, layout: admin }
      - { id: monthly, type: page, pageId: monthly, path: /reports/monthly, title: 报表中心, layout: admin, permission: report:view }
      - { id: data-list, type: page, pageId: data-list, path: /models/data-list, title: 数据列表, layout: admin }

  - id: system
    type: group
    title: 系统管理
    icon: settings
    children:
      - { id: system-settings, type: page, pageId: system-settings, path: /settings/general, title: 系统设置, layout: admin }
      - { id: dictionaries, type: page, pageId: dictionaries, path: /settings/dictionaries, title: 字典管理, layout: admin }
      - { id: audit-logs, type: page, pageId: audit-logs, path: /settings/audit-logs, title: 审计日志, layout: admin }
      - { id: roles, type: page, pageId: roles, path: /settings/roles, title: 角色管理, layout: admin }
      - { id: users, type: page, pageId: users, path: /settings/users, title: 用户管理, layout: admin, permission: user:view }
      - { id: themes, type: page, pageId: themes, path: /settings/themes, title: 主题设置, layout: admin }
  - { id: role-detail, type: page, pageId: role-detail, path: /settings/roles/:roleId, title: 角色详情, layout: admin, hidden: true, activeMenu: roles }
  - { id: monthly-detail, type: page, pageId: monthly-detail, path: /reports/monthly/:id, title: 月报详情, layout: admin, hidden: true, activeMenu: monthly, permission: report:view }
  - { id: profile, type: page, pageId: profile, path: /profile, title: 个人中心, layout: admin, hidden: true }

layouts:
  admin:
    dsl: "1.0"
    body:
      type: Layout
      props: { className: shell-root }
      children:
        - type: NavigationShell
          props:
            user: ${data.session.user}
            menus: ${data.session.menus}
          children:
            - type: Content
              props: { className: shell-content }
              children:
                - type: PageOutlet

  login:
    dsl: "1.0"
    body:
      type: PageOutlet

  auth:
    dsl: "1.0"
    body:
      type: Flex
      props:
        direction: vertical
        justify: center
        align: center
        style: { minHeight: 100vh, padding: 24 }
      children:
        - type: Flex
          props:
            direction: vertical
            style:
              width: 380
              padding: 24
              border: 1px solid var(--border)
              borderRadius: 12
          children:
            - type: PageOutlet

  blank:
    dsl: "1.0"
    body:
      type: PageOutlet
